<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmdadX HR — نظام إدارة الموظفين والحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-3: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-soft: #334155;
  --text-muted: #64748b;

  --primary: #10b981;
  --primary-dark: #047857;
  --primary-50: rgba(16,185,129,.10);
  --primary-light: #34d399;

  --info: #06b6d4;
  --warning: #f59e0b;
  --danger: #dc2626;
  --success: #10b981;
  --purple: #7c3aed;
  --pink: #ec4899;
  --orange: #f97316;
  --indigo: #6366f1;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --shadow-sm: 0 1px 3px rgba(15,23,42,.06);
  --shadow: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
  --shadow-xl: 0 20px 48px rgba(15,23,42,.16);
}

[data-theme="dark"] {
  --bg: #050810;
  --surface: #0d131f;
  --surface-2: #131b2a;
  --surface-3: #1a2336;
  --border: #1e2a3d;
  --border-strong: #2a3a52;
  --text: #f1f5f9;
  --text-soft: #cbd5e1;
  --text-muted: #94a3b8;
  --primary-50: rgba(16,185,129,.18);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.40);
  --shadow: 0 4px 12px rgba(0,0,0,.40);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.50);
  --shadow-xl: 0 20px 48px rgba(0,0,0,.60);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}

/* ============================================================
   LOGIN PAGE
============================================================ */
.login-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0f766e 0%, #134e4a 50%, #0c4a6e 100%);
  z-index: 1000;
  padding: 20px;
}
[data-theme="dark"] .login-overlay {
  background: linear-gradient(135deg, #022c22 0%, #0c4a6e 50%, #1e1b4b 100%);
}
.login-overlay::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 800px 400px at 20% 15%, rgba(16,185,129,.20) 0%, transparent 50%),
    radial-gradient(ellipse 600px 300px at 80% 80%, rgba(6,182,212,.15) 0%, transparent 50%);
  animation: floatBg 14s ease-in-out infinite alternate;
}
@keyframes floatBg {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(-30px, 20px) scale(1.05); }
}

.login-card {
  background: rgba(255,255,255,.98);
  border-radius: 28px;
  width: 100%; max-width: 440px;
  padding: 36px 32px 30px;
  box-shadow: 0 32px 80px rgba(0,0,0,.40);
  position: relative;
  z-index: 1;
}
[data-theme="dark"] .login-card {
  background: rgba(15,23,42,.97);
  border: 1px solid rgba(255,255,255,.05);
}

.login-logo {
  width: 88px; height: 88px;
  border-radius: 26px;
  background: linear-gradient(135deg, #10b981, #047857);
  display: grid; place-items: center;
  margin: 0 auto 16px;
  box-shadow: 0 12px 28px rgba(16,185,129,.40);
  position: relative;
}
.login-logo svg {
  width: 48px; height: 48px;
  color: white;
}
.login-title {
  text-align: center;
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(135deg, #047857, #0c4a6e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.login-subtitle {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 28px;
  font-weight: 600;
}

.login-form { display: flex; flex-direction: column; gap: 14px; }
.login-field {
  position: relative;
}
.login-field-icon {
  position: absolute;
  inset-inline-start: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  z-index: 1;
}
.login-input {
  width: 100%;
  padding: 14px 14px 14px 44px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--surface-2);
  font-family: inherit;
  font-size: 14px;
  color: var(--text);
  transition: all .2s;
}
.login-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-50);
  background: var(--surface);
}
.login-btn {
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #10b981, #047857);
  color: white;
  font-family: inherit;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
  box-shadow: 0 6px 16px rgba(16,185,129,.35);
  margin-top: 6px;
  letter-spacing: 0.2px;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(16,185,129,.45);
}
.login-btn:active { transform: translateY(0); }
.login-error {
  background: rgba(220,38,38,.08);
  color: #b91c1c;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  border: 1px solid rgba(220,38,38,.25);
  display: none;
}
.login-error.show { display: block; }
.login-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 18px;
  padding: 10px;
  background: var(--surface-2);
  border-radius: 10px;
  border: 1px dashed var(--border-strong);
}
.login-hint b { color: var(--primary-dark); font-weight: 800; }

/* ============================================================
   APP LAYOUT (sidebar + main)
============================================================ */
.app { display: none; min-height: 100vh; }
.app.show { display: flex; }

.sidebar {
  width: 250px;
  background: var(--surface);
  border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
  z-index: 50;
}
[data-theme="dark"] .sidebar {
  background: #0a0f1a;
  border-color: rgba(255,255,255,.05);
}

.sb-header {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sb-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #10b981, #047857);
  border-radius: 10px;
  display: grid; place-items: center;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(16,185,129,.30);
}
.sb-name { font-size: 15px; font-weight: 900; letter-spacing: -0.3px; color: var(--text); }
.sb-sub { font-size: 10.5px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }

.sb-nav {
  flex: 1;
  padding: 14px 10px;
  display: flex; flex-direction: column;
  gap: 2px;
}
.sb-section-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px 12px 6px;
}
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-soft);
  transition: all .15s;
  position: relative;
}
.sb-item:hover { background: var(--surface-2); color: var(--text); }
.sb-item.active {
  background: var(--primary-50);
  color: var(--primary-dark);
}
[data-theme="dark"] .sb-item.active { color: var(--primary-light); }
.sb-item.active::before {
  content: '';
  position: absolute;
  inset-inline-start: -10px;
  top: 50%; transform: translateY(-50%);
  width: 4px; height: 60%;
  background: var(--primary);
  border-radius: 0 4px 4px 0;
  box-shadow: 0 0 12px var(--primary);
}
.sb-item-icon {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 13px;
}
.sb-badge {
  margin-inline-start: auto;
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: white;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(220,38,38,.40);
  animation: badgePulse 1.8s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { box-shadow: 0 2px 6px rgba(220,38,38,.40), 0 0 0 0 rgba(220,38,38,.5); }
  50%      { box-shadow: 0 2px 6px rgba(220,38,38,.40), 0 0 0 6px rgba(220,38,38,0); }
}

.sb-footer {
  padding: 10px;
  border-top: 1px solid var(--border);
}
.sb-user {
  display: flex; align-items: center; gap: 10px;
  padding: 8px;
  border-radius: 10px;
  background: var(--surface-2);
}
.sb-user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: white;
  display: grid; place-items: center;
  font-weight: 900;
  font-size: 15px;
  flex-shrink: 0;
}
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name { font-size: 12.5px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-role { font-size: 10.5px; color: var(--text-muted); font-weight: 700; }
.sb-user-actions { display: flex; gap: 4px; }
.sb-icon-btn {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  display: grid; place-items: center;
  color: var(--text-muted);
  transition: all .15s;
}
.sb-icon-btn:hover { color: var(--primary); border-color: var(--primary); }

/* ============================================================
   MAIN CONTENT
============================================================ */
.main {
  flex: 1;
  min-width: 0;
  display: flex; flex-direction: column;
}

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 22px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(10px);
}
[data-theme="dark"] .topbar { background: rgba(13,19,31,.85); }

.topbar-clock {
  font-family: 'Cairo', monospace;
  font-size: 14px;
  font-weight: 800;
  color: var(--text-soft);
  padding: 6px 14px;
  background: var(--surface-2);
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar-clock-date {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.topbar-quick {
  margin-inline-start: auto;
  display: flex; gap: 8px;
}
.tb-quick-btn {
  padding: 7px 14px;
  border-radius: 999px;
  border: none;
  font-family: inherit;
  font-weight: 800;
  font-size: 12.5px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.tb-quick-in {
  background: linear-gradient(135deg, #10b981, #047857);
  color: white;
  box-shadow: 0 4px 10px rgba(16,185,129,.30);
}
.tb-quick-in:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(16,185,129,.45); }
.tb-quick-out {
  background: linear-gradient(135deg, #f59e0b, #c2410c);
  color: white;
  box-shadow: 0 4px 10px rgba(245,158,11,.30);
}
.tb-quick-out:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(245,158,11,.45); }

.content {
  padding: 22px;
  flex: 1;
}

/* ============================================================
   COMMON COMPONENTS
============================================================ */

/* Page Header */
.page-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 22px;
  gap: 12px;
  flex-wrap: wrap;
}
.page-title {
  font-size: 22px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}
.page-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
}
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn {
  padding: 9px 16px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
}
.btn:hover { transform: translateY(-1px); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 12px 22px; font-size: 14px; }
.btn-primary {
  background: linear-gradient(135deg, #10b981, #047857);
  color: white;
  box-shadow: 0 4px 10px rgba(16,185,129,.30);
}
.btn-primary:hover { box-shadow: 0 6px 14px rgba(16,185,129,.45); }
.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-3); }
.btn-ghost {
  background: transparent;
  color: var(--text-muted);
}
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }
.btn-danger {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: white;
  box-shadow: 0 4px 10px rgba(220,38,38,.30);
}
.btn-success {
  background: linear-gradient(135deg, #10b981, #047857);
  color: white;
  box-shadow: 0 4px 10px rgba(16,185,129,.30);
}
.btn-warning {
  background: linear-gradient(135deg, #f59e0b, #c2410c);
  color: white;
  box-shadow: 0 4px 10px rgba(245,158,11,.30);
}
.btn-info {
  background: linear-gradient(135deg, #06b6d4, #0e7490);
  color: white;
  box-shadow: 0 4px 10px rgba(6,182,212,.30);
}
.btn-purple {
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: white;
  box-shadow: 0 4px 10px rgba(124,58,237,.30);
}
.btn-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  cursor: pointer;
  display: inline-grid; place-items: center;
  color: var(--text-muted);
  transition: all .15s;
}
.btn-icon:hover { color: var(--primary); border-color: var(--primary); }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, var(--surface-2), transparent);
}
.card-title { font-size: 14px; font-weight: 800; color: var(--text); }
.card-body { padding: 18px; }

/* KPI cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; gap: 12px;
  position: relative;
  overflow: hidden;
  transition: all .2s;
}
.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: -40px; inset-inline-end: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  opacity: 0.08;
  pointer-events: none;
  background: currentColor;
}
.kpi-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 22px;
  color: white;
  box-shadow: 0 4px 10px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.20);
}
.kpi-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
.kpi-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}
.kpi-val {
  font-size: 22px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.5px;
  line-height: 1.1;
}
.kpi-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  margin-top: 3px;
}

.kpi-green { color: #10b981; }
.kpi-green .kpi-icon { background: linear-gradient(135deg, #10b981, #047857); }
.kpi-blue { color: #06b6d4; }
.kpi-blue .kpi-icon { background: linear-gradient(135deg, #06b6d4, #0e7490); }
.kpi-purple { color: #7c3aed; }
.kpi-purple .kpi-icon { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
.kpi-orange { color: #f59e0b; }
.kpi-orange .kpi-icon { background: linear-gradient(135deg, #f59e0b, #c2410c); }
.kpi-red { color: #ef4444; }
.kpi-red .kpi-icon { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.kpi-pink { color: #ec4899; }
.kpi-pink .kpi-icon { background: linear-gradient(135deg, #ec4899, #be185d); }
.kpi-indigo { color: #6366f1; }
.kpi-indigo .kpi-icon { background: linear-gradient(135deg, #6366f1, #4338ca); }

/* Forms */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.form-group label {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--text-soft);
}
.form-control {
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  transition: all .2s;
  width: 100%;
}
.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-50);
}
textarea.form-control { resize: vertical; min-height: 70px; }
select.form-control { cursor: pointer; }

/* Tables */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-scroll {
  overflow-x: auto;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table thead th {
  background: var(--surface-2);
  padding: 11px 14px;
  text-align: start;
  font-weight: 800;
  font-size: 11.5px;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
.data-table tbody tr {
  transition: background .15s;
}
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tbody tr:last-child td { border-bottom: none; }

/* Badges */
.badge {
  display: inline-flex;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  align-items: center;
  gap: 4px;
}
.badge-success { background: rgba(16,185,129,.12); color: #047857; }
.badge-danger { background: rgba(220,38,38,.12); color: #b91c1c; }
.badge-warning { background: rgba(245,158,11,.12); color: #c2410c; }
.badge-info { background: rgba(6,182,212,.12); color: #0e7490; }
.badge-purple { background: rgba(124,58,237,.12); color: #6d28d9; }
.badge-pink { background: rgba(236,72,153,.12); color: #be185d; }
.badge-gray { background: rgba(100,116,139,.12); color: var(--text-muted); }
[data-theme="dark"] .badge-success { background: rgba(16,185,129,.22); color: #34d399; }
[data-theme="dark"] .badge-danger { background: rgba(220,38,38,.22); color: #fca5a5; }
[data-theme="dark"] .badge-warning { background: rgba(245,158,11,.22); color: #fbbf24; }
[data-theme="dark"] .badge-info { background: rgba(6,182,212,.22); color: #67e8f9; }
[data-theme="dark"] .badge-purple { background: rgba(124,58,237,.22); color: #c4b5fd; }
[data-theme="dark"] .badge-pink { background: rgba(236,72,153,.22); color: #f9a8d4; }

/* Tabs */
.tabs {
  display: flex; gap: 4px;
  background: var(--surface-2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  flex-wrap: wrap;
}
.tab {
  padding: 8px 16px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 8px;
  transition: all .2s;
}
.tab:hover { color: var(--text); }
.tab.active {
  background: var(--surface);
  color: var(--primary-dark);
  box-shadow: 0 2px 6px rgba(15,23,42,.06);
}
[data-theme="dark"] .tab.active { color: var(--primary-light); }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .icon {
  font-size: 64px;
  margin-bottom: 12px;
  opacity: .5;
}
.empty-state h3 {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}
.empty-state p { font-size: 13px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.55);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 200;
  padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: scale(1); } }
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 560px;
  max-height: 90vh;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-xl);
  animation: scaleIn .25s ease;
}
.modal.large { max-width: 900px; }
.modal.xl { max-width: 1100px; }
.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 17px; font-weight: 800; }
.modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px;
  background: var(--surface-2);
}
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  cursor: pointer;
  display: grid; place-items: center;
  color: var(--text-muted);
  transition: all .15s;
}
.modal-close:hover { color: var(--danger); border-color: var(--danger); }

/* Toast */
.toast-container {
  position: fixed;
  top: 20px;
  inset-inline-end: 20px;
  z-index: 300;
  display: flex; flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px;
  min-width: 220px;
  animation: toastIn .3s ease;
  pointer-events: auto;
}
@keyframes toastIn { from { transform: translateX(50%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-success { border-color: var(--success); background: linear-gradient(135deg, rgba(16,185,129,.06), var(--surface)); }
.toast-error { border-color: var(--danger); background: linear-gradient(135deg, rgba(220,38,38,.06), var(--surface)); }
.toast-warning { border-color: var(--warning); background: linear-gradient(135deg, rgba(245,158,11,.06), var(--surface)); }
.toast-info { border-color: var(--info); background: linear-gradient(135deg, rgba(6,182,212,.06), var(--surface)); }

/* ============================================================
   DASHBOARD SPECIFIC
============================================================ */
.dash-row {
  display: grid;
  gap: 16px;
  margin-bottom: 16px;
}
.dash-2col { grid-template-columns: 2fr 1fr; }
.dash-3col { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 900px) {
  .dash-2col, .dash-3col { grid-template-columns: 1fr; }
}

.live-presence {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.lp-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.lp-title {
  font-size: 14px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.lp-live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
  animation: livePulse 1.5s ease-in-out infinite;
}
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.lp-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.lp-stat {
  padding: 10px;
  border-radius: 10px;
  background: var(--surface-2);
  text-align: center;
}
.lp-stat-val { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
.lp-stat-label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); }
.lp-stat-present .lp-stat-val { color: #10b981; }
.lp-stat-field .lp-stat-val { color: #f59e0b; }
.lp-stat-absent .lp-stat-val { color: var(--text-muted); }

.lp-list {
  max-height: 380px;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 6px;
}
.lp-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px;
  border-radius: 10px;
  background: var(--surface-2);
  transition: all .15s;
}
.lp-row:hover { background: var(--surface-3); }
.lp-row-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: white;
  display: grid; place-items: center;
  font-weight: 900;
  font-size: 14px;
  flex-shrink: 0;
  overflow: hidden;
}
.lp-row-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lp-row-info { flex: 1; min-width: 0; }
.lp-row-name { font-size: 13px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-row-position { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.lp-row-status {
  text-align: end;
  white-space: nowrap;
}
.lp-row-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Today's Tasks */
.today-tasks {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.tt-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  background: var(--surface-2);
  border-radius: 10px;
  margin-bottom: 6px;
  border-inline-start: 3px solid;
}
.tt-row-pending { border-color: var(--warning); }
.tt-row-progress { border-color: var(--info); }
.tt-row-done { border-color: var(--success); }
.tt-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 14px;
}
.tt-info { flex: 1; min-width: 0; }
.tt-title { font-size: 13px; font-weight: 800; color: var(--text); }
.tt-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

/* ============================================================
   ATTENDANCE PAGE
============================================================ */
.checkin-card {
  background: linear-gradient(135deg, rgba(16,185,129,.06), var(--surface));
  border: 1.5px solid rgba(16,185,129,.30);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 22px;
}
.checkin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
@media (max-width: 700px) { .checkin-grid { grid-template-columns: 1fr; } }
.ci-method {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.ci-method:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.ci-method-icon {
  width: 56px; height: 56px;
  border-radius: 16px;
  margin: 0 auto 10px;
  display: grid; place-items: center;
  font-size: 26px;
  color: white;
}
.ci-method-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
.ci-method-desc { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }

/* PIN Pad */
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 280px;
  margin: 0 auto;
}
.pin-key {
  padding: 18px 0;
  border-radius: 14px;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  cursor: pointer;
  transition: all .15s;
}
.pin-key:hover {
  background: var(--primary-50);
  border-color: var(--primary);
  color: var(--primary-dark);
}
.pin-key:active { transform: scale(0.95); }
.pin-display {
  text-align: center;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 8px;
  padding: 16px;
  background: var(--surface-2);
  border-radius: 12px;
  margin-bottom: 16px;
  color: var(--primary-dark);
  min-height: 70px;
  display: flex; align-items: center; justify-content: center;
}

/* QR Reader */
#qr-reader {
  max-width: 360px;
  margin: 0 auto;
  border-radius: 14px;
  overflow: hidden;
}

/* ============================================================
   EMPLOYEES PAGE
============================================================ */
.emp-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
}
.emp-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: all .2s;
  cursor: pointer;
  position: relative;
}
.emp-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
  border-color: var(--primary);
}
.emp-card-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.emp-card-avatar {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: white;
  display: grid; place-items: center;
  font-weight: 900;
  font-size: 20px;
  flex-shrink: 0;
  overflow: hidden;
}
.emp-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
.emp-card-name { font-size: 14.5px; font-weight: 900; color: var(--text); letter-spacing: -0.2px; }
.emp-card-position { font-size: 11.5px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
.emp-card-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.emp-card-stat {
  font-size: 11px;
  color: var(--text-muted);
}
.emp-card-stat b { display: block; font-size: 13px; font-weight: 900; color: var(--text); }
.emp-card-status-dot {
  position: absolute;
  top: 14px; inset-inline-end: 14px;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--surface);
}
.emp-status-active { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,.6); }
.emp-status-field { background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,.6); }
.emp-status-absent { background: #94a3b8; }
.emp-status-disabled { background: #ef4444; }

/* ============================================================
   FIELD TASKS PAGE
============================================================ */
.task-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  border-inline-start: 4px solid;
}
.task-pending { border-inline-start-color: var(--warning); }
.task-progress { border-inline-start-color: var(--info); }
.task-done { border-inline-start-color: var(--success); }
.task-cancelled { border-inline-start-color: var(--text-muted); opacity: 0.6; }
.task-header {
  display: flex; justify-content: space-between; align-items: start;
  gap: 10px;
  margin-bottom: 8px;
}
.task-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.task-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
.task-meta b { color: var(--text); font-weight: 800; }
.task-desc { font-size: 12.5px; color: var(--text-soft); font-weight: 600; padding: 6px 0; line-height: 1.6; }
.task-footer {
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.task-assignees {
  display: flex; gap: 4px;
}
.task-assignee-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #5b21b6);
  color: white;
  display: grid; place-items: center;
  font-weight: 900;
  font-size: 11px;
  border: 2px solid var(--surface);
  margin-inline-start: -8px;
  overflow: hidden;
}
.task-assignee-avatar:first-child { margin-inline-start: 0; }
.task-assignee-avatar img { width: 100%; height: 100%; object-fit: cover; }
.task-actions { display: flex; gap: 4px; }

/* Task type icons */
.task-type-icon {
  display: inline-flex;
  width: 22px; height: 22px;
  border-radius: 6px;
  align-items: center; justify-content: center;
  font-size: 11px;
  margin-inline-end: 4px;
}
.tt-maintenance { background: rgba(245,158,11,.15); color: #c2410c; }
.tt-installation { background: rgba(6,182,212,.15); color: #0e7490; }
.tt-delivery { background: rgba(16,185,129,.15); color: #047857; }
.tt-visit { background: rgba(124,58,237,.15); color: #6d28d9; }
.tt-other { background: rgba(100,116,139,.15); color: var(--text-muted); }

/* ============================================================
   SHIFT/SCHEDULE PAGE
============================================================ */
.schedule-grid {
  display: grid;
  grid-template-columns: 180px repeat(7, 1fr);
  gap: 6px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  border: 1px solid var(--border);
  overflow-x: auto;
  min-width: 800px;
}
.sched-header {
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  padding: 8px;
  color: var(--text);
  background: var(--surface-2);
  border-radius: 8px;
}
.sched-emp-name {
  font-size: 12px;
  font-weight: 800;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: 8px;
  display: flex; align-items: center; gap: 8px;
}
.sched-cell {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 6px 4px;
  min-height: 60px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.sched-cell:hover { background: var(--surface-3); }
.sched-cell.has-shift { background: linear-gradient(135deg, rgba(16,185,129,.10), var(--surface-2)); border: 1px solid rgba(16,185,129,.30); color: #047857; }
.sched-cell.is-off { background: rgba(220,38,38,.05); color: var(--text-muted); }
.sched-cell.is-today { box-shadow: inset 0 0 0 2px var(--primary); }
[data-theme="dark"] .sched-cell.has-shift { color: #34d399; }

/* ============================================================
   FILTERS BAR
============================================================ */
.filter-bar {
  display: flex; gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-search-wrap {
  position: relative;
  flex: 1;
  min-width: 220px;
}
.filter-search-icon {
  position: absolute;
  inset-inline-start: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}
.filter-search-input {
  width: 100%;
  padding: 9px 14px 9px 40px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  transition: all .2s;
}
.filter-search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-50);
}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    inset-inline-start: -250px;
    transition: inset-inline-start .25s;
  }
  .sidebar.show { inset-inline-start: 0; }
  .content { padding: 16px; }
  .topbar { padding: 12px 16px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ============================================================
   THEME TRANSITION ANIMATION
============================================================ */
.theme-transitioning,
.theme-transitioning * {
  transition: background-color .4s ease, color .35s ease, border-color .4s ease, box-shadow .4s ease !important;
}
.sb-icon-btn svg { transition: transform .4s ease; }
.sb-icon-btn:hover svg { transform: rotate(25deg); }

/* Page entry animation */
.content > * {
  animation: pageSlideIn .35s ease;
}
@keyframes pageSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* KPI card stagger */
.kpi-card { animation: kpiPop .4s ease backwards; }
.kpi-card:nth-child(1) { animation-delay: .02s; }
.kpi-card:nth-child(2) { animation-delay: .06s; }
.kpi-card:nth-child(3) { animation-delay: .10s; }
.kpi-card:nth-child(4) { animation-delay: .14s; }
.kpi-card:nth-child(5) { animation-delay: .18s; }
.kpi-card:nth-child(6) { animation-delay: .22s; }
@keyframes kpiPop {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Employee/task card stagger */
.emp-card { animation: kpiPop .35s ease backwards; }
.task-card { animation: pageSlideIn .3s ease backwards; }

/* Sidebar item hover slide */
.sb-item { transition: all .18s ease, padding-inline-start .2s ease; }
.sb-item:hover { padding-inline-start: 16px; }

/* Payroll inputs */
.payroll-input {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  transition: all .15s;
}
.payroll-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-50);
  background: var(--surface);
}

/* Button press feedback */
.btn:active { transform: translateY(1px) scale(.98); }

/* Modal smoother */
.modal-overlay { transition: opacity .2s ease; }

/* Toast slide variations */
.toast { transition: transform .3s ease, opacity .3s ease; }

/* Live dot enhanced */
.lp-live-dot { will-change: opacity; }

/* Print */
@media print {
  .sidebar, .topbar, .page-actions, .modal-overlay { display: none !important; }
  .main { display: block; }
  .content { padding: 0; }
  body { background: #fff; }
}
</style>
</head>

/* ===== app.js ===== */

const STORAGE_KEY = 'emdadx_hr_v1';
const SESSION_KEY = 'emdadx_hr_session';

/* ===========================================================
   DATABASE
=========================================================== */
const DB = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        this.data = JSON.parse(raw);
        this.ensureSchema();
      } else {
        this.data = this.seedData();
        this.save();
      }
    } catch (e) {
      console.error('DB load failed:', e);
      this.data = this.seedData();
    }
  },
  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    } catch (e) {
      toast('فشل حفظ البيانات — المساحة ممتلئة', 'error');
    }
  },
  ensureSchema() {
    if (!this.data.users) this.data.users = [];
    if (!this.data.employees) this.data.employees = [];
    if (!this.data.attendance) this.data.attendance = []; // check-in/out records
    if (!this.data.tasks) this.data.tasks = [];           // field tasks
    if (!this.data.shifts) this.data.shifts = [];         // shift schedule
    if (!this.data.leaves) this.data.leaves = [];         // leave requests
    if (!this.data.salaryRuns) this.data.salaryRuns = []; // monthly payroll runs
    if (!this.data.locations) this.data.locations = [];   // company locations
    if (!this.data.auditLog) this.data.auditLog = [];
    if (!this.data.settings) this.data.settings = {};
    if (!this.data.settings.companyName) this.data.settings.companyName = 'شركتي';

    if (!this.data.settings.workEnd) this.data.settings.workEnd = '17:00';

    const now = Date.now();
    return {
      users: [
        { id: 'u_admin', username: 'admin', password: 'admin123', name: 'مدير النظام', role: 'admin', createdAt: now }

      tasks: [],

        companyName: 'شركتي',

/* ===========================================================
   UTILITIES
=========================================================== */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeArabic(s) {
  if (!s) return '';
  return String(s)
    .toLowerCase()
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/\u0640/g, '')
    .replace(/[إأآٱ]/g, 'ا')
    .replace(/ة/g, 'ه')
    .replace(/ى/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ئ/g, 'ي')
    .replace(/ء/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function nowTime() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${h}:${m}`;
}

function fmtTime(timeStr) {
  if (!timeStr) return '—';
  return timeStr;
}

function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleString('ar-EG', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function fmtDate(ds) {
  if (!ds) return '—';
  const d = new Date(ds);
  if (isNaN(d)) return ds;
  return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtDayName(ds) {
  if (!ds) return '';
  const d = new Date(ds);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('ar-EG', { weekday: 'long' });
}

function diffMinutes(t1, t2) {
  if (!t1 || !t2) return 0;
  const [h1, m1] = t1.split(':').map(Number);
  const [h2, m2] = t2.split(':').map(Number);
  return (h2 * 60 + m2) - (h1 * 60 + m1);
}

function minsToHours(mins) {
  if (!mins || mins < 0) return '0:00';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function getDayCode(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  return ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()];
}

function getDayLabel(code) {
  return { SU:'الأحد', MO:'الإثنين', TU:'الثلاثاء', WE:'الأربعاء', TH:'الخميس', FR:'الجمعة', SA:'السبت' }[code] || code;
}

function isWeekend(dateStr) {
  const code = getDayCode(dateStr);
  return (DB.data.settings.weekendDays || []).includes(code);
}

/* ===========================================================
   TOAST NOTIFICATIONS
=========================================================== */
function toast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  t.innerHTML = `<span style="font-weight:900;font-size:16px">${icons[type]||'•'}</span><span>${escapeHtml(message)}</span>`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .3s, transform .3s';
    t.style.opacity = '0';
    t.style.transform = 'translateX(50%)';
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

/* ===========================================================
   MODAL
=========================================================== */
function openModal(title, bodyHTML, footerHTML = '', size = '') {
  const m = document.getElementById('modal');
  m.className = 'modal' + (size ? ' ' + size : '');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  const footer = document.getElementById('modal-footer');
  if (footerHTML) {
    footer.innerHTML = footerHTML;
    footer.style.display = 'flex';
  } else {
    footer.innerHTML = '';
    footer.style.display = 'none';
  }
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function confirmDialog(message, onYes) {
  openModal('تأكيد',
    `<p style="font-size:14px;line-height:1.7">${escapeHtml(message)}</p>`,
    `<button class="btn btn-danger" id="confirm-yes">نعم، متابعة</button>
     <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>`
  );
  document.getElementById('confirm-yes').onclick = () => { closeModal(); onYes(); };
}

/* ===========================================================
   AUTH
=========================================================== */
let currentUser = null;

const PERMISSIONS = {
  admin: ['dashboard','attendance','employees','tasks','schedule','leaves','payroll','ai','reports','settings','audit'],
  manager: ['dashboard','attendance','employees','tasks','schedule','leaves','payroll','ai','reports'],
  employee: ['dashboard','attendance','tasks']
};

function can(page) {
  return currentUser && (PERMISSIONS[currentUser.role] || []).includes(page);
}

function attemptLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');

  const user = DB.data.users.find(u =>
    (u.username === username || u.email === username) &&
    u.password === password
  );

  if (!user) {
    errorEl.textContent = '⚠ بيانات الدخول غير صحيحة';
    errorEl.classList.add('show');
    return;
  }
  errorEl.classList.remove('show');
  currentUser = user;
  sessionStorage.setItem(SESSION_KEY, user.id);
  showApp();
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  currentUser = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-overlay').style.display = 'flex';
}

function restoreSession() {
  const userId = sessionStorage.getItem(SESSION_KEY);
  if (!userId) return false;
  const user = DB.data.users.find(u => u.id === userId);
  if (!user) return false;
  currentUser = user;
  showApp();
  return true;
}

function showApp() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('app').classList.add('show');
  renderSidebar();
  renderUserInfo();
  startClock();
  navigate('dashboard');
}

function renderUserInfo() {
  const initial = (currentUser.name || currentUser.username || 'U').charAt(0).toUpperCase();
  document.getElementById('sb-user-avatar').textContent = initial;
  document.getElementById('sb-user-name').textContent = currentUser.name || currentUser.username;
  const roles = { admin: 'مدير النظام', manager: 'مشرف', employee: 'موظف' };
  document.getElementById('sb-user-role').textContent = roles[currentUser.role] || currentUser.role;
}

/* ===========================================================
   NAVIGATION
=========================================================== */
let currentPage = 'dashboard';

const NAV_ITEMS = [
  { key: 'dashboard',  label: 'لوحة التحكم',          color: '#10b981', icon: '📊', section: 'main' },
  { key: 'attendance', label: 'الحضور والانصراف',     color: '#06b6d4', icon: '⏰', section: 'main' },
  { key: 'employees',  label: 'الموظفون',             color: '#7c3aed', icon: '👥', section: 'main' },
  { key: 'tasks',      label: 'المهام الميدانية',     color: '#f59e0b', icon: '🚗', section: 'main' },
  { key: 'schedule',   label: 'الورديات والجدولة',    color: '#ec4899', icon: '📅', section: 'main' },
  { key: 'leaves',     label: 'الإجازات والأذون',     color: '#6366f1', icon: '🏖️', section: 'main' },
  { key: 'payroll',    label: 'المرتبات',             color: '#22c55e', icon: '💰', section: 'finance' },
  { key: 'ai',         label: 'المساعد الذكي',        color: '#a855f7', icon: '🤖', section: 'finance' },
  { key: 'reports',    label: 'التقارير',             color: '#0ea5e9', icon: '📈', section: 'admin' },
  { key: 'settings',   label: 'الإعدادات',            color: '#64748b', icon: '⚙️', section: 'admin' }
];

function renderSidebar() {
  const nav = document.getElementById('sb-nav');
  if (!currentUser) return;
  const sections = { main: 'الأقسام الرئيسية', finance: 'المالية والذكاء', admin: 'الإدارة' };
  let html = '';
  let lastSection = null;
  NAV_ITEMS.forEach(item => {
    if (!can(item.key)) return;
    if (item.section !== lastSection) {
      html += `<div class="sb-section-label">${sections[item.section]||''}</div>`;
      lastSection = item.section;
    }
    let badge = '';
    if (item.key === 'tasks') {
      const pending = DB.data.tasks.filter(t => t.status === 'pending').length;
      if (pending > 0) badge = `<span class="sb-badge">${pending}</span>`;
    }
    if (item.key === 'leaves') {
      const pending = DB.data.leaves.filter(l => l.status === 'pending').length;
      if (pending > 0) badge = `<span class="sb-badge">${pending}</span>`;
    }
    html += `
      <div class="sb-item ${currentPage===item.key?'active':''}" onclick="navigate('${item.key}')">
        <div class="sb-item-icon" style="background:${item.color}1a;color:${item.color}">${item.icon}</div>
        <span>${item.label}</span>
        ${badge}
      </div>
    `;
  });
  nav.innerHTML = html;
}

function navigate(page) {
  if (!can(page)) {
    toast('ليس لديك صلاحية للوصول لهذه الصفحة', 'error');
    return;
  }
  currentPage = page;
  renderSidebar();
  if (page === 'dashboard') renderDashboard();
  else if (page === 'attendance') renderAttendancePage();
  else if (page === 'employees') renderEmployeesPage();
  else if (page === 'tasks') renderTasksPage();
  else if (page === 'schedule') renderSchedulePage();
  else if (page === 'leaves') renderLeavesPage();
  else if (page === 'payroll') renderPayrollPage();
  else if (page === 'ai') renderAIPage();
  else if (page === 'reports') renderReportsPage();
  else if (page === 'settings') renderSettingsPage();
}

function startClock() {

    const d = new Date();
    document.getElementById('topbar-time').textContent =

      String(d.getMinutes()).padStart(2,'0') + ':' +

    document.getElementById('topbar-date').textContent =
      d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
  };
  update();
  setInterval(update, 1000);

/* ===========================================================
   THEME TOGGLE
=========================================================== */
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  // Add transition class for smooth color animation
  html.classList.add('theme-transitioning');
  html.setAttribute('data-theme', next);
  localStorage.setItem('emdadx_hr_theme', next);
  updateThemeIcon(next);
  setTimeout(() => html.classList.remove('theme-transitioning'), 400);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('theme-icon');
  if (!icon) return;
  if (theme === 'dark') {
    // Moon icon
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    // Sun icon
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}

function restoreTheme() {
  const saved = localStorage.getItem('emdadx_hr_theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    setTimeout(() => updateThemeIcon('dark'), 50);
  }
}

/* ===========================================================

=========================================================== */

function renderAttendancePage() {
  const content = document.getElementById('content');
  const today = todayStr();
  const todayRecords = DB.data.attendance.filter(a => a.date === today);
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Calculate stats
  const checkedInIds = new Set(todayRecords.filter(r => r.checkIn).map(r => r.employeeId));
  const checkedOutIds = new Set(todayRecords.filter(r => r.checkOut).map(r => r.employeeId));
  const stillIn = [...checkedInIds].filter(id => !checkedOutIds.has(id));
  const absent = employees.filter(e => !checkedInIds.has(e.id));
  const settings = DB.data.settings;

  // Late count
  let lateCount = 0;
  todayRecords.forEach(r => {
    if (r.checkIn) {
      const diff = diffMinutes(settings.workStart, r.checkIn);
      if (diff > settings.lateGraceMins) lateCount++;
    }
  });

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">⏰ الحضور والانصراف</div>
        <div class="page-subtitle">${fmtDate(today)} • ${employees.length} موظف مسجل</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openManualAttendanceModal()">
          ➕ تسجيل يدوي
        </button>
        <button class="btn btn-secondary" onclick="openAttendanceExport()">
          📥 تصدير اليوم
        </button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">✓</div>
        <div class="kpi-body">
          <div class="kpi-label">الحاضرون</div>
          <div class="kpi-val">${checkedInIds.size}</div>
          <div class="kpi-sub">من إجمالي ${employees.length} موظف</div>
        </div>
      </div>
      <div class="kpi-card kpi-orange">

function renderAttendanceRows(records) {
  if (records.length === 0) {
    return `<tr><td colspan="8" class="empty-state">
      <div class="icon">📋</div>
      <h3>لا توجد عمليات حضور اليوم بعد</h3>
      <p>سجّل أول حضور باستخدام إحدى الطرق أعلاه</p>
    </td></tr>`;
  }

  // Sort by check-in time (latest first)
  const sorted = records.slice().sort((a, b) => (b.checkIn || '').localeCompare(a.checkIn || ''));
  const settings = DB.data.settings;

  return sorted.map(r => {
    const emp = DB.data.employees.find(e => e.id === r.employeeId);
    if (!emp) return '';
    const lateMinutes = r.checkIn ? diffMinutes(settings.workStart, r.checkIn) : 0;
    const isLate = lateMinutes > settings.lateGraceMins;
    const durationMins = (r.checkIn && r.checkOut) ? diffMinutes(r.checkIn, r.checkOut) : 0;
    const methods = { pin: '🔢 PIN', qr: '📱 QR', gps: '📍 GPS', manual: '✏️ يدوي' };
    const status = !r.checkIn ? 'غائب' : !r.checkOut ? (isLate ? 'متأخر' : 'حاضر') : 'منصرف';
    const statusClass = !r.checkIn ? 'badge-gray' : !r.checkOut ? (isLate ? 'badge-warning' : 'badge-success') : 'badge-info';

    return `<tr data-emp-name="${escapeHtml(emp.name.toLowerCase())}">
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="lp-row-avatar" style="width:32px;height:32px;font-size:12px">${emp.photo?`<img src="${emp.photo}">`:escapeHtml(emp.name.charAt(0))}</div>
          <b>${escapeHtml(emp.name)}</b>
        </div>
      </td>
      <td>${escapeHtml(emp.position||'-')}</td>
      <td><b style="color:${isLate?'#c2410c':'#047857'}">${fmtTime(r.checkIn)}</b>${isLate?`<br><small style="color:#c2410c">متأخر ${lateMinutes-settings.lateGraceMins} د</small>`:''}</td>
      <td>${r.checkOut ? `<b>${fmtTime(r.checkOut)}</b>` : '<span style="color:var(--text-muted)">—</span>'}</td>
      <td>${durationMins ? `<b>${minsToHours(durationMins)}</b>` : '—'}</td>
      <td><span class="badge ${statusClass}">${status}</span></td>
      <td><span style="font-size:11px">${methods[r.method] || '—'}</span></td>
      <td>
        ${!r.checkOut && currentUser.role !== 'employee' ? `<button class="btn btn-sm btn-warning" onclick="manualCheckOut('${r.id}')">⏰ انصراف</button>` : ''}
        ${currentUser.role === 'admin' ? `<button class="btn-icon" onclick="editAttendance('${r.id}')" title="تعديل" style="color:var(--info)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-icon" onclick="deleteAttendance('${r.id}')" title="حذف" style="color:var(--danger)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

function filterAttendanceLog(query) {
  const q = normalizeArabic(query);
  const rows = document.querySelectorAll('#attendance-log-body tr');
  rows.forEach(row => {
    const name = row.getAttribute('data-emp-name') || '';
    row.style.display = normalizeArabic(name).includes(q) ? '' : 'none';
  });
}

/* ===========================================================
   CHECK-IN: PIN method
=========================================================== */
let pinBuffer = '';

function openPinCheckin() {
  pinBuffer = '';
  openModal('🔢 تسجيل بالـPIN', `
    <div style="text-align:center;padding:14px 0">
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">أدخل الرقم السري الخاص بك (4 أرقام)</p>
      <div class="pin-display" id="pin-display">— — — —</div>
      <div class="pin-pad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key" onclick="pinPress('clear')" style="color:#c2410c">مسح</button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key" onclick="pinPress('back')" style="color:#c2410c">⌫</button>
      </div>
    </div>
  `, '<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>');
}

function pinPress(key) {
  if (key === 'clear') { pinBuffer = ''; updatePinDisplay(); return; }
  if (key === 'back')  { pinBuffer = pinBuffer.slice(0,-1); updatePinDisplay(); return; }
  if (pinBuffer.length < 4) {
    pinBuffer += key;
    updatePinDisplay();
    if (pinBuffer.length === 4) {
      setTimeout(() => processPinCheckin(pinBuffer), 200);
    }
  }
}

function updatePinDisplay() {
  const display = document.getElementById('pin-display');
  if (!display) return;
  let str = '';
  for (let i = 0; i < 4; i++) {
    str += (i < pinBuffer.length) ? '●' : '— ';
  }
  display.textContent = str;
}

function processPinCheckin(pin) {
  const emp = DB.data.employees.find(e => e.pin === pin && !e.disabled);
  if (!emp) {
    toast('PIN غير صحيح', 'error');
    pinBuffer = '';
    setTimeout(() => updatePinDisplay(), 300);
    return;
  }
  closeModal();
  performCheck(emp.id, 'pin');
}

/* ===========================================================
   CHECK-IN: QR method
=========================================================== */
let html5QrScanner = null;

function openQRCheckin() {
  openModal('📱 تسجيل بـQR Code', `
    <div style="text-align:center;padding:8px 0">
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">وجّه كاميرا الجوّال نحو الـQR Code الخاص بالموظف</p>
      <div id="qr-reader"></div>
      <div id="qr-result" style="margin-top:14px;font-weight:700"></div>
    </div>
  `, '<button class="btn btn-secondary" onclick="closeQRScanner()">إلغاء</button>');

  // Initialize the scanner
  setTimeout(() => {
    try {
      html5QrScanner = new Html5Qrcode('qr-reader');
      html5QrScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        (decoded) => {
          html5QrScanner.stop().then(() => {
            processQRCheckin(decoded);
          });
        },
        () => {}
      ).catch(err => {
        document.getElementById('qr-result').innerHTML = `<span style="color:var(--danger)">⚠ لا يمكن فتح الكاميرا: ${escapeHtml(err.message||err)}</span>`;
      });
    } catch (e) {
      document.getElementById('qr-result').innerHTML = `<span style="color:var(--danger)">⚠ ${escapeHtml(e.message)}</span>`;
    }
  }, 200);
}

function closeQRScanner() {
  if (html5QrScanner) {
    html5QrScanner.stop().catch(() => {});
    html5QrScanner = null;
  }
  closeModal();
}

function processQRCheckin(qrData) {
  // QR format: EMDADX-HR-EMP:<empId>
  if (!qrData.startsWith('EMDADX-HR-EMP:')) {
    toast('QR Code غير صحيح', 'error');
    closeModal();
    return;
  }
  const empId = qrData.replace('EMDADX-HR-EMP:', '').trim();
  const emp = DB.data.employees.find(e => e.id === empId && !e.disabled);
  if (!emp) {
    toast('الموظف غير موجود', 'error');
    closeModal();
    return;
  }
  closeModal();
  performCheck(emp.id, 'qr');
}

/* ===========================================================
   CHECK-IN: GPS method
=========================================================== */
function openGPSCheckin() {
  openModal('📍 تسجيل بالموقع', `
    <div style="text-align:center;padding:14px 0">
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">سيتم تسجيل موقعك الحالي مع الحضور</p>
      <div id="gps-status" style="padding:20px;background:var(--surface-2);border-radius:12px;font-size:13px;font-weight:700">
        🛰️ جاري الحصول على موقعك...
      </div>
      <div class="form-group" style="margin-top:18px;text-align:start">
        <label>اختر الموظف</label>
        <select class="form-control" id="gps-emp-select">
          <option value="">-- اختر --</option>
          ${DB.data.employees.filter(e=>!e.disabled).map(e => `<option value="${e.id}">${escapeHtml(e.name)} (${escapeHtml(e.position||'-')})</option>`).join('')}
        </select>
      </div>
    </div>
  `, `
    <button class="btn btn-primary" onclick="confirmGPSCheckin()">✓ تسجيل الحضور</button>
    <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
  `);

  // Get location
  if (!navigator.geolocation) {
    document.getElementById('gps-status').innerHTML = `<span style="color:var(--danger)">⚠ متصفحك لا يدعم تحديد المواقع</span>`;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      window._gpsPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      document.getElementById('gps-status').innerHTML = `
        <div style="color:#047857;font-weight:900;font-size:14px;margin-bottom:6px">✓ تم تحديد موقعك بنجاح</div>
        <div style="font-size:11px;color:var(--text-muted)">
          📍 ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}<br>
          🎯 دقة: ${Math.round(pos.coords.accuracy)} متر
        </div>
      `;
    },
    err => {
      document.getElementById('gps-status').innerHTML = `<span style="color:var(--danger)">⚠ ${escapeHtml(err.message)}</span>`;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function confirmGPSCheckin() {
  const empId = document.getElementById('gps-emp-select').value;
  if (!empId) { toast('اختر موظف', 'error'); return; }
  if (!window._gpsPosition) { toast('انتظر تحديد الموقع', 'error'); return; }
  closeModal();
  performCheck(empId, 'gps', window._gpsPosition);
  delete window._gpsPosition;
}

function openManualAttendanceModal() {

  openModal('✏️ تسجيل حضور يدوي', `
    <div class="form-group">
      <label>الموظف *</label>
      <select class="form-control" id="man-emp-id">
        <option value="">-- اختر --</option>
        ${employees.map(e => `<option value="${e.id}">${escapeHtml(e.name)} (${escapeHtml(e.position||'-')})</option>`).join('')}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>التاريخ *</label>
        <input type="date" class="form-control" id="man-date" value="${todayStr()}">
      </div>
      <div class="form-group">
        <label>نوع التسجيل</label>
        <select class="form-control" id="man-action">
          <option value="checkin">حضور</option>
          <option value="checkout">انصراف</option>
          <option value="both">حضور + انصراف</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="man-times">
      <div class="form-group">
        <label>وقت الحضور</label>
        <input type="time" class="form-control" id="man-checkin" value="${nowTime()}">
      </div>
      <div class="form-group" id="man-checkout-group" style="display:none">
        <label>وقت الانصراف</label>
        <input type="time" class="form-control" id="man-checkout">
      </div>
    </div>
    <div class="form-group">
      <label>ملاحظات (اختياري)</label>
      <textarea class="form-control" id="man-notes" rows="2" placeholder="مثلاً: حضور بعد إجازة، استثناء..."></textarea>
    </div>
  `, `
    <button class="btn btn-primary" onclick="saveManualAttendance()">💾 حفظ</button>
    <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
  `);

  document.getElementById('man-action').addEventListener('change', (e) => {
    const checkoutGrp = document.getElementById('man-checkout-group');
    const checkinGrp = document.getElementById('man-checkin').parentElement;
    if (e.target.value === 'checkout') {
      checkinGrp.style.display = 'none';
      checkoutGrp.style.display = '';
    } else if (e.target.value === 'checkin') {
      checkinGrp.style.display = '';
      checkoutGrp.style.display = 'none';
    } else {
      checkinGrp.style.display = '';
      checkoutGrp.style.display = '';
    }
  });
}

function saveManualAttendance() {
  const empId = document.getElementById('man-emp-id').value;
  const date = document.getElementById('man-date').value;
  const action = document.getElementById('man-action').value;
  const checkIn = document.getElementById('man-checkin').value;
  const checkOut = document.getElementById('man-checkout').value;
  const notes = document.getElementById('man-notes').value.trim();

  if (!empId || !date) { toast('املأ كل البيانات المطلوبة', 'error'); return; }

  const emp = DB.data.employees.find(e => e.id === empId);
  if (!emp) { toast('الموظف غير موجود', 'error'); return; }

  // Find or create record for this date
  let record = DB.data.attendance.find(a => a.employeeId === empId && a.date === date);
  if (!record) {
    record = {
      id: 'att_' + uid(),
      employeeId: empId,
      employeeName: emp.name,
      date,
      checkIn: null,
      checkOut: null,
      method: 'manual',
      notes: '',
      createdAt: Date.now()
    };
    DB.data.attendance.push(record);
  }

  if (action === 'checkin' || action === 'both') record.checkIn = checkIn;
  if (action === 'checkout' || action === 'both') record.checkOut = checkOut;
  record.method = 'manual';
  if (notes) record.notes = notes;

  DB.save();
  toast(`✓ تم تسجيل ${action==='checkout'?'الانصراف':action==='checkin'?'الحضور':'الحضور والانصراف'} لـ ${emp.name}`, 'success');
  closeModal();
  renderAttendancePage();
  renderSidebar();
}

/* ===========================================================
   CORE: perform check-in or check-out
=========================================================== */
function performCheck(employeeId, method, gps) {
  const emp = DB.data.employees.find(e => e.id === employeeId);
  if (!emp) { toast('الموظف غير موجود', 'error'); return; }

  const today = todayStr();
  const now = nowTime();
  let record = DB.data.attendance.find(a => a.employeeId === employeeId && a.date === today);

  if (!record) {
    // First time today → check-in
    record = {
      id: 'att_' + uid(),
      employeeId,
      employeeName: emp.name,
      date: today,
      checkIn: now,
      checkOut: null,
      method,
      gps: gps || null,
      createdAt: Date.now()
    };
    DB.data.attendance.push(record);
    DB.save();
    const settings = DB.data.settings;
    const lateMins = diffMinutes(settings.workStart, now);
    if (lateMins > settings.lateGraceMins) {
      toast(`✓ حضور ${emp.name} - متأخر ${lateMins - settings.lateGraceMins} دقيقة`, 'warning');
    } else {
      toast(`✓ تم تسجيل حضور ${emp.name} الساعة ${now}`, 'success');
    }
  } else if (!record.checkOut) {
    // Already checked in → check-out
    record.checkOut = now;
    record.checkOutMethod = method;
    if (gps) record.checkOutGps = gps;
    DB.save();
    const duration = diffMinutes(record.checkIn, now);
    toast(`✓ تم انصراف ${emp.name} (مدة: ${minsToHours(duration)})`, 'info');
  } else {
    // Already checked out
    toast(`${emp.name} انصرف بالفعل اليوم`, 'warning');
    return;
  }

  if (currentPage === 'attendance') renderAttendancePage();
  if (currentPage === 'dashboard') renderDashboard();
  renderSidebar();
}

function manualCheckOut(recordId) {
  const r = DB.data.attendance.find(x => x.id === recordId);
  if (!r) return;
  r.checkOut = nowTime();
  r.checkOutMethod = 'manual';
  DB.save();
  toast(`تم تسجيل انصراف ${r.employeeName}`, 'success');
  renderAttendancePage();
}

function saveEditAttendance(id) {
  const r = DB.data.attendance.find(x => x.id === id);
  if (!r) return;

function openAttendanceExport() {
  const today = todayStr();
  const records = DB.data.attendance.filter(a => a.date === today);
  if (records.length === 0) { toast('لا توجد بيانات للتصدير', 'warning'); return; }
  const settings = DB.data.settings;
  let csv = 'الموظف,الوظيفة,التاريخ,الحضور,الانصراف,المدة,الحالة,الطريقة\n';
  records.forEach(r => {
    const emp = DB.data.employees.find(e => e.id === r.employeeId);
    if (!emp) return;
    const dur = (r.checkIn && r.checkOut) ? minsToHours(diffMinutes(r.checkIn, r.checkOut)) : '';
    const lateMins = r.checkIn ? diffMinutes(settings.workStart, r.checkIn) : 0;
    const status = !r.checkIn ? 'غائب' : !r.checkOut ? (lateMins>settings.lateGraceMins?'متأخر':'حاضر') : 'منصرف';
    csv += `"${emp.name}","${emp.position||''}","${r.date}","${r.checkIn||''}","${r.checkOut||''}","${dur}","${status}","${r.method||''}"\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `attendance-${today}.csv`;
  a.click();
  toast('✓ تم تصدير الملف', 'success');
}

let employeesFilter = { search: '', status: 'all' };

function renderEmployeesPage() {
  const content = document.getElementById('content');
  const employees = DB.data.employees.slice();
  const today = todayStr();

  // Filter employees
  let filtered = employees;
  if (employeesFilter.search) {
    const q = normalizeArabic(employeesFilter.search);
    filtered = filtered.filter(e =>
      normalizeArabic(e.name||'').includes(q) ||
      normalizeArabic(e.position||'').includes(q) ||
      (e.phone||'').includes(employeesFilter.search) ||
      normalizeArabic(e.department||'').includes(q)
    );
  }
  if (employeesFilter.status === 'active') filtered = filtered.filter(e => !e.disabled);
  if (employeesFilter.status === 'disabled') filtered = filtered.filter(e => e.disabled);

  // Compute live status for each
  const todayAttendance = DB.data.attendance.filter(a => a.date === today);
  const onField = new Set(DB.data.tasks.filter(t => t.status === 'progress').flatMap(t => t.assignees || []));

  filtered = filtered.map(e => {
    const att = todayAttendance.find(a => a.employeeId === e.id);
    let status = 'absent';
    if (e.disabled) status = 'disabled';
    else if (onField.has(e.id)) status = 'field';
    else if (att && att.checkIn && !att.checkOut) status = 'active';
    else if (att && att.checkOut) status = 'absent';
    return { ...e, _status: status, _attendance: att };
  });

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">👥 الموظفون</div>
        <div class="page-subtitle">${employees.length} موظف مسجل • ${employees.filter(e=>!e.disabled).length} نشط</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openEmployeeForm()">
          ➕ موظف جديد
        </button>
        <button class="btn btn-secondary" onclick="openBulkActionsMenu()">
          ⚙️ إجراءات
        </button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-search-wrap">
        <svg class="filter-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="filter-search-input" placeholder="ابحث بالاسم، الوظيفة، الهاتف..." value="${escapeHtml(employeesFilter.search)}"
               oninput="employeesFilter.search=this.value;updateEmpFilter()">
      </div>
      <div class="tabs" style="margin-bottom:0">
        <button class="tab ${employeesFilter.status==='all'?'active':''}" onclick="employeesFilter.status='all';renderEmployeesPage()">الكل</button>
        <button class="tab ${employeesFilter.status==='active'?'active':''}" onclick="employeesFilter.status='active';renderEmployeesPage()">النشطون</button>
        <button class="tab ${employeesFilter.status==='disabled'?'active':''}" onclick="employeesFilter.status='disabled';renderEmployeesPage()">المعطّلون</button>
      </div>
    </div>

    ${filtered.length === 0 ? `
      <div class="empty-state">
        <div class="icon">👥</div>
        <h3>${employees.length === 0 ? 'لم يتم إضافة موظفين بعد' : 'لا توجد نتائج'}</h3>
        <p>${employees.length === 0 ? 'اضغط "موظف جديد" لإضافة أول موظف' : 'جرب تغيير معايير البحث'}</p>
      </div>
    ` : `
      <div class="emp-grid">
        ${filtered.map(emp => renderEmployeeCard(emp)).join('')}
      </div>
    `}
  `;
}

function updateEmpFilter() {
  // Re-render but maintain focus
  const focused = document.activeElement;
  const cursorPos = focused && focused.selectionStart;
  renderEmployeesPage();
  if (focused && focused.tagName === 'INPUT') {
    const newInput = document.querySelector('.filter-search-input');
    if (newInput) {
      newInput.focus();
      try { newInput.setSelectionRange(cursorPos, cursorPos); } catch(e) {}
    }
  }
}

function renderEmployeeCard(emp) {
  const statusLabels = {
    active: { label: 'في العمل', class: 'badge-success' },
    field: { label: 'في الميدان', class: 'badge-warning' },
    absent: { label: 'غائب', class: 'badge-gray' },
    disabled: { label: 'معطّل', class: 'badge-danger' }
  };
  const status = statusLabels[emp._status] || statusLabels.absent;
  const today = todayStr();
  // Count this month's tasks for this employee
  const monthStart = today.slice(0,7);
  const monthTasks = DB.data.tasks.filter(t =>
    (t.assignees||[]).includes(emp.id) &&
    (t.date||'').startsWith(monthStart)
  );
  const monthAttendance = DB.data.attendance.filter(a =>
    a.employeeId === emp.id && (a.date||'').startsWith(monthStart) && a.checkIn
  ).length;

  return `
    <div class="emp-card" onclick="openEmployeeDetail('${emp.id}')">
      <div class="emp-card-status-dot emp-status-${emp._status}"></div>
      <div class="emp-card-header">

        <div class="emp-card-stat">
          <b>${monthAttendance}</b>

        <div class="emp-card-stat">
          <b>${monthTasks.length}</b>

}

/* Attachment handling for employee form */
function onEmpAttachSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) {
    toast('الملف كبير جداً (الحد الأقصى 4MB)', 'error');
    event.target.value = '';
    return;
  }
  const type = document.getElementById('emp-attach-type').value;
  const reader = new FileReader();
  reader.onload = (e) => {
    if (!window._empAttachStaging) window._empAttachStaging = [];
    window._empAttachStaging.push({
      id: 'att_' + uid(),
      type,
      name: file.name,
      mime: file.type,
      size: file.size,
      data: e.target.result,
      uploadedAt: Date.now()
    });
    refreshEmpAttachList();
    toast('✓ تم إضافة الملف (احفظ الموظف للتأكيد)', 'success');
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function refreshEmpAttachList() {
  const host = document.getElementById('emp-attach-list');
  if (!host) return;
  const list = window._empAttachStaging || [];
  const typeLabels = {
    contract: '📄 عقد العمل', id: '🪪 البطاقة', certificate: '🎓 شهادة',
    cv: '📋 سيرة ذاتية', medical: '🏥 طبية', other: '📌 أخرى'
  };
  if (list.length === 0) {
    host.innerHTML = '<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:6px">لا توجد مرفقات بعد</div>';
    return;
  }
  host.innerHTML = list.map(a => {
    const isPdf = (a.mime||'').includes('pdf');
    const icon = isPdf ? '📕' : '🖼️';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px">
      <span style="font-size:18px">${icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(a.name)}</div>
        <div style="font-size:10.5px;color:var(--text-muted)">${typeLabels[a.type]||a.type} • ${formatFileSize(a.size)}</div>
      </div>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
