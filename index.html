}

function removeEmpAttach(attId) {
  window._empAttachStaging = (window._empAttachStaging || []).filter(a => a.id !== attId);
  refreshEmpAttachList();
}

function formatFileSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function onEmpPhotoSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('الصورة كبيرة جداً (الحد الأقصى 2MB)', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    // Compress by drawing to canvas
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxSize = 300;
      let { width, height } = img;
      if (width > height && width > maxSize) {
        height = (height * maxSize) / width;
        width = maxSize;
      } else if (height > maxSize) {
        width = (width * maxSize) / height;
        height = maxSize;
      }
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('emp-photo-data').value = dataUrl;
      document.getElementById('emp-photo-preview').innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function generateRandomPIN() {
  // Generate unique 4-digit PIN not used by other employees
  let pin;
  const existing = new Set(DB.data.employees.map(e => e.pin).filter(Boolean));
  do {
    pin = String(Math.floor(1000 + Math.random() * 9000));
  } while (existing.has(pin));
  document.getElementById('emp-pin').value = pin;
}

function saveEmployee(id) {
  const name = document.getElementById('emp-name').value.trim();
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  const position = document.getElementById('emp-position').value.trim();
  if (!position) { toast('الوظيفة مطلوبة', 'error'); return; }
  const pin = document.getElementById('emp-pin').value.trim();
  if (pin && (pin.length !== 4 || !/^\d+$/.test(pin))) {
    toast('PIN يجب أن يكون 4 أرقام', 'error');
    return;
  }
  // Check PIN uniqueness
  if (pin) {
    const existing = DB.data.employees.find(e => e.pin === pin && e.id !== id);
    if (existing) { toast(`الـPIN مستخدم بالفعل بواسطة ${existing.name}`, 'error'); return; }
  }

  const data = {
    name,
    position,
    department: document.getElementById('emp-dept').value.trim(),
    phone: document.getElementById('emp-phone').value.trim(),
    email: document.getElementById('emp-email').value.trim(),
    nationalId: document.getElementById('emp-nid').value.trim(),
    hireDate: document.getElementById('emp-hire').value,
    baseSalary: parseFloat(document.getElementById('emp-salary').value) || 0,
    managerId: document.getElementById('emp-manager').value,
    contractType: document.getElementById('emp-contract').value,
    attachments: window._empAttachStaging || [],
    pin,
    address: document.getElementById('emp-address').value.trim(),
    notes: document.getElementById('emp-notes').value.trim(),
    photo: document.getElementById('emp-photo-data').value
  };

  if (id) {
    const emp = DB.data.employees.find(e => e.id === id);
    if (!emp) return;
    const disabledEl = document.getElementById('emp-disabled');
    if (disabledEl) data.disabled = disabledEl.checked;
    Object.assign(emp, data);
    emp.updatedAt = Date.now();
  } else {
    if (!DB.data.counters) DB.data.counters = { employee: 100 };
    DB.data.counters.employee = (DB.data.counters.employee || 100) + 1;
    DB.data.employees.push({
      id: 'emp_' + uid(),
      empCode: 'EMP-' + DB.data.counters.employee,
      ...data,
      disabled: false,
      createdAt: Date.now()
    });
  }

  DB.save();
  toast(`✓ ${id?'تم تحديث':'تم إضافة'} الموظف`, 'success');
  closeModal();
  renderEmployeesPage();
  renderSidebar();
}

/* ===========================================================

=========================================================== */
function openEmployeeDetail(id) {
  const emp = DB.data.employees.find(e => e.id === id);
  if (!emp) return;

  const today = todayStr();
  const monthStart = today.slice(0,7);

  const monthAttendance = DB.data.attendance.filter(a => a.employeeId === id && (a.date||'').startsWith(monthStart));
  const monthTasks = DB.data.tasks.filter(t => (t.assignees||[]).includes(id) && (t.date||'').startsWith(monthStart));

  const totalMinutes = monthAttendance.reduce((s, a) => s + (a.checkIn && a.checkOut ? diffMinutes(a.checkIn, a.checkOut) : 0), 0);

  // Late days count
  const settings = DB.data.settings;
  const lateDays = monthAttendance.filter(a => a.checkIn && diffMinutes(settings.workStart, a.checkIn) > settings.lateGraceMins).length;

  // Tasks by type
  const tasksByType = {};

    const tp = t.type || 'other';
    tasksByType[tp] = (tasksByType[tp]||0) + 1;

    maintenance: '🔧 صيانة',
    installation: '🔌 تركيب',

        <div style="width:120px;height:120px;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:white;display:grid;place-items:center;font-weight:900;font-size:42px;overflow:hidden;box-shadow:0 8px 22px rgba(124,58,237,.30)">
          ${emp.photo ? `<img src="${emp.photo}" style="width:100%;height:100%;object-fit:cover">` : escapeHtml(emp.name.charAt(0).toUpperCase())}
        </div>
        ${emp.empCode ? `<div style="margin-top:8px;font-size:11px;color:var(--text-muted);font-weight:700">${escapeHtml(emp.empCode)}</div>`:''}
      </div>
      <div>
        <h2 style="font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:-0.4px">${escapeHtml(emp.name)}</h2>
        <div style="font-size:14px;color:var(--text-muted);font-weight:700;margin-bottom:10px">${escapeHtml(emp.position||'-')}${emp.department?' • '+escapeHtml(emp.department):''}</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px">
          ${emp.phone ? `<div>📞 ${escapeHtml(emp.phone)}</div>`:''}
          ${emp.email ? `<div>✉️ ${escapeHtml(emp.email)}</div>`:''}
          ${emp.nationalId ? `<div>🪪 ${escapeHtml(emp.nationalId)}</div>`:''}
          ${emp.hireDate ? `<div>📅 تاريخ التعيين: ${fmtDate(emp.hireDate)}</div>`:''}
          ${emp.baseSalary ? `<div>💰 المرتب: ${emp.baseSalary.toLocaleString('en-US')} ج.م</div>`:''}
          ${(() => {
            const mgr = emp.managerId ? DB.data.employees.find(e=>e.id===emp.managerId) : null;
            return mgr ? `<div>👔 المدير: ${escapeHtml(mgr.name)}</div>` : '';
          })()}
          ${(() => {
            const ct = { permanent:'دائم', temporary:'مؤقت', parttime:'دوام جزئي', contract:'بالعقد', trial:'تحت الاختبار' };
            return emp.contractType ? `<div>📝 العقد: ${ct[emp.contractType]||emp.contractType}</div>` : '';
          })()}
          ${emp.pin ? `<div>🔢 PIN: <code style="background:var(--surface-2);padding:1px 6px;border-radius:5px">${escapeHtml(emp.pin)}</code></div>`:''}
          ${emp.address ? `<div style="grid-column:1/-1">📍 ${escapeHtml(emp.address)}</div>`:''}
        </div>
      </div>
    </div>

    <!-- Quick KPIs for the month -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:18px">
      <div style="padding:12px;background:linear-gradient(135deg,rgba(16,185,129,.10),var(--surface));border:1px solid rgba(16,185,129,.30);border-radius:10px;text-align:center">
        <div style="font-size:22px;font-weight:900;color:#047857;line-height:1">${monthAttendance.filter(a=>a.checkIn).length}</div>
        <div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-top:2px">يوم حضور (الشهر)</div>

      <div style="padding:12px;background:linear-gradient(135deg,rgba(245,158,11,.10),var(--surface));border:1px solid rgba(245,158,11,.30);border-radius:10px;text-align:center">
        <div style="font-size:22px;font-weight:900;color:#c2410c;line-height:1">${lateDays}</div>
        <div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-top:2px">مرة تأخير</div>

      <button class="tab" onclick="switchEmpDetailTab('files', '${id}', this)">📎 الملفات ${emp.attachments&&emp.attachments.length?`(${emp.attachments.length})`:''}</button>
      <button class="tab" onclick="switchEmpDetailTab('qr', '${id}', this)">📱 QR Code</button>
    </div>

    <div id="emp-detail-content">
      ${buildEmpAttendanceList(id)}
    </div>
  `, `
    ${currentUser.role === 'admin' || currentUser.role === 'manager' ? `
    <button class="btn btn-primary" onclick="closeModal();openEmployeeForm('${id}')">✏️ تعديل</button>
    <button class="btn btn-info" onclick="closeModal();openTaskForm(null, ['${id}'])">➕ مهمة جديدة</button>
    ${currentUser.role === 'admin' ? `<button class="btn btn-danger" onclick="confirmDeleteEmployee('${id}')">🗑️ حذف</button>` : ''}
    ` : ''}
    <button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>
  `, 'large');
}

function switchEmpDetailTab(tab, empId, btn) {
  // Update active state
  btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const host = document.getElementById('emp-detail-content');
  if (tab === 'attendance') host.innerHTML = buildEmpAttendanceList(empId);
  else if (tab === 'tasks') host.innerHTML = buildEmpTasksList(empId);
  else if (tab === 'files') host.innerHTML = buildEmpFilesList(empId);
  else if (tab === 'qr') host.innerHTML = buildEmpQRCode(empId);
}

function buildEmpFilesList(empId) {
  const emp = DB.data.employees.find(e => e.id === empId);
  if (!emp) return '';
  const files = emp.attachments || [];
  const typeLabels = {
    contract: '📄 عقد العمل', id: '🪪 البطاقة', certificate: '🎓 شهادة',
    cv: '📋 سيرة ذاتية', medical: '🏥 طبية', other: '📌 أخرى'
  };
  if (files.length === 0) {
    return `<div class="empty-state"><div class="icon">📎</div><h3>لا توجد مرفقات</h3><p>أضف الملفات من زرار "تعديل"</p></div>`;
  }
  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
      ${files.map(a => {
        const isPdf = (a.mime||'').includes('pdf');
        return `<div style="padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;cursor:pointer;text-align:center" onclick="viewEmpAttachment('${empId}','${a.id}')">
          <div style="font-size:40px;margin-bottom:8px">${isPdf?'📕':'🖼️'}</div>
          <div style="font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(a.name)}</div>
          <div style="font-size:10.5px;color:var(--text-muted);margin-top:3px">${typeLabels[a.type]||a.type}</div>
          <div style="font-size:10px;color:var(--text-muted)">${formatFileSize(a.size)} • ${fmtDate(new Date(a.uploadedAt).toISOString().slice(0,10))}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function viewEmpAttachment(empId, attId) {
  const emp = DB.data.employees.find(e => e.id === empId);
  if (!emp) return;
  const att = (emp.attachments||[]).find(a => a.id === attId);
  if (!att) return;
  const isPdf = (att.mime||'').includes('pdf');
  const w = window.open('', '_blank');
  if (isPdf) {
    w.document.write(`<iframe src="${att.data}" style="width:100%;height:100vh;border:none"></iframe>`);
  } else {
    w.document.write(`<body style="margin:0;background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${att.data}" style="max-width:100%;max-height:100vh"></body>`);
  }
  w.document.close();
}

function buildEmpAttendanceList(empId) {
  const records = DB.data.attendance
    .filter(a => a.employeeId === empId)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''))
    .slice(0, 30);
  if (records.length === 0) {
    return '<div class="empty-state"><div class="icon">📋</div><h3>لا توجد سجلات حضور</h3></div>';
  }
  const settings = DB.data.settings;
  return `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>التاريخ</th><th>اليوم</th><th>الحضور</th><th>الانصراف</th><th>المدة</th><th>الحالة</th></tr></thead>
        <tbody>
          ${records.map(r => {
            const lateMins = r.checkIn ? diffMinutes(settings.workStart, r.checkIn) : 0;
            const isLate = lateMins > settings.lateGraceMins;
            const dur = (r.checkIn && r.checkOut) ? minsToHours(diffMinutes(r.checkIn, r.checkOut)) : '—';
            return `<tr>
              <td><b>${r.date}</b></td>
              <td>${fmtDayName(r.date)}</td>
              <td style="color:${isLate?'#c2410c':'#047857'};font-weight:700">${r.checkIn||'—'}</td>
              <td>${r.checkOut||'—'}</td>
              <td><b>${dur}</b></td>
              <td><span class="badge ${isLate?'badge-warning':'badge-success'}">${isLate?'متأخر':'في الوقت'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function buildEmpTasksList(empId) {
  const tasks = DB.data.tasks
    .filter(t => (t.assignees||[]).includes(empId))
    .sort((a,b) => (b.date||'').localeCompare(a.date||''))
    .slice(0, 30);
  if (tasks.length === 0) {
    return '<div class="empty-state"><div class="icon">🚗</div><h3>لا توجد مهام ميدانية</h3></div>';
  }
  const typeLabels = { maintenance:'🔧 صيانة', installation:'🔌 تركيب', delivery:'🚚 توصيل', visit:'🚗 زيارة', other:'📌 أخرى' };
  const statusLabels = { pending:'معلّقة', progress:'جارية', done:'منجزة', cancelled:'ملغية' };
  const statusClasses = { pending:'badge-warning', progress:'badge-info', done:'badge-success', cancelled:'badge-gray' };
  return `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>التاريخ</th><th>النوع</th><th>العنوان</th><th>الموقع</th><th>الحالة</th></tr></thead>
        <tbody>
          ${tasks.map(t => `<tr>
            <td><b>${t.date}</b></td>
            <td>${typeLabels[t.type]||t.type}</td>
            <td>${escapeHtml(t.title||'-')}</td>
            <td>${escapeHtml(t.location||'-')}</td>
            <td><span class="badge ${statusClasses[t.status]||'badge-gray'}">${statusLabels[t.status]||t.status}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function buildEmpQRCode(empId) {
  const emp = DB.data.employees.find(e => e.id === empId);
  if (!emp) return '';
  // Generate QR after render
  setTimeout(() => {
    const canvas = document.getElementById('emp-qr-canvas');
    if (canvas && typeof QRCode !== 'undefined') {
      QRCode.toCanvas(canvas, 'EMDADX-HR-EMP:' + empId, { width: 240, margin: 2 }, (err) => {
        if (err) console.error('QR error:', err);
      });
    }
  }, 100);
  return `
    <div style="text-align:center;padding:20px">
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px">كارت الموظف (يمكن طباعته واستخدامه لتسجيل الحضور)</p>
      <div style="display:inline-block;padding:18px;background:#fff;border:2px dashed var(--border-strong);border-radius:14px">
        <canvas id="emp-qr-canvas" width="240" height="240"></canvas>
        <div style="margin-top:10px;font-weight:900;color:#0f172a;font-size:15px">${escapeHtml(emp.name)}</div>
        <div style="font-size:12px;color:#64748b;font-weight:700">${escapeHtml(emp.position||'-')}</div>
        ${emp.empCode ? `<div style="font-size:11px;color:#64748b;margin-top:4px">${escapeHtml(emp.empCode)}</div>`:''}
      </div>
      <div style="margin-top:14px">
        <button class="btn btn-primary" onclick="printEmployeeBadge('${empId}')">🖨️ طباعة الكارت</button>
      </div>
    </div>
  `;
}

function confirmDeleteEmployee(id) {
  const emp = DB.data.employees.find(e => e.id === id);
  if (!emp) return;
  confirmDialog(
    `هل تريد حذف الموظف "${emp.name}" نهائياً؟\n\nسيتم حذف كل سجلات الحضور والمهام المرتبطة به.`,
    () => {
      DB.data.employees = DB.data.employees.filter(e => e.id !== id);
      DB.data.attendance = DB.data.attendance.filter(a => a.employeeId !== id);
      DB.data.tasks = DB.data.tasks.map(t => ({
        ...t,
        assignees: (t.assignees||[]).filter(aId => aId !== id)
      }));
      DB.save();
      toast('تم حذف الموظف', 'success');
      closeModal();
      renderEmployeesPage();
    }
  );
}

function openBulkActionsMenu() {
  openModal('⚙️ إجراءات الموظفين', `
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-secondary" onclick="closeModal();exportEmployeesCSV()" style="justify-content:start">📥 تصدير كل الموظفين Excel</button>
      <button class="btn btn-secondary" onclick="closeModal();printAllBadges()" style="justify-content:start">🖨️ طباعة كل كروت الموظفين</button>
      <button class="btn btn-secondary" onclick="closeModal();printPINsList()" style="justify-content:start">🔢 طباعة قائمة الأرقام السرية</button>
    </div>
  `, '<button class="btn btn-secondary" onclick="closeModal()">إغلاق</button>');
}

function exportEmployeesCSV() {
  const emps = DB.data.employees;
  if (emps.length === 0) { toast('لا يوجد موظفين', 'warning'); return; }
  let csv = 'الكود,الاسم,الوظيفة,القسم,الهاتف,الإيميل,تاريخ التعيين,المرتب,PIN,الحالة\n';
  emps.forEach(e => {
    csv += `"${e.empCode||''}","${e.name}","${e.position||''}","${e.department||''}","${e.phone||''}","${e.email||''}","${e.hireDate||''}","${e.baseSalary||0}","${e.pin||''}","${e.disabled?'معطّل':'نشط'}"\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `employees-${todayStr()}.csv`;
  a.click();
  toast('✓ تم التصدير', 'success');
}

/* ===========================================================
   FIELD TASKS — Maintenance, Installation, Delivery, Visits
=========================================================== */

let tasksFilter = {
  search: '',
  status: 'all',  // all|pending|progress|done|cancelled
  type: 'all',    // all|maintenance|installation|delivery|visit|other
  assignee: 'all',
  dateMode: 'all', // all|today|week|month|range
  from: '',
  to: ''
};

const TASK_TYPES = {
  maintenance: { label: 'صيانة', icon: '🔧', class: 'tt-maintenance' },
  installation: { label: 'تركيب', icon: '🔌', class: 'tt-installation' },
  delivery:    { label: 'توصيل', icon: '🚚', class: 'tt-delivery' },
  visit:       { label: 'زيارة',  icon: '🚗', class: 'tt-visit' },
  other:       { label: 'أخرى',   icon: '📌', class: 'tt-other' }
};

const TASK_STATUS = {
  pending:   { label: '⏳ معلّقة',  class: 'badge-warning', cardClass: 'task-pending' },
  progress:  { label: '🔄 جارية',  class: 'badge-info',    cardClass: 'task-progress' },
  done:      { label: '✓ منجزة',   class: 'badge-success', cardClass: 'task-done' },
  cancelled: { label: '✕ ملغية',   class: 'badge-gray',    cardClass: 'task-cancelled' }
};

function renderTasksPage() {
  const content = document.getElementById('content');
  const all = DB.data.tasks.slice();

  // Apply filters
  let filtered = all;
  if (tasksFilter.search) {
    const q = normalizeArabic(tasksFilter.search);
    filtered = filtered.filter(t =>
      normalizeArabic(t.title||'').includes(q) ||
      normalizeArabic(t.location||'').includes(q) ||
      normalizeArabic(t.description||'').includes(q) ||
      String(t.number||'').includes(tasksFilter.search)
    );
  }
  if (tasksFilter.status !== 'all') filtered = filtered.filter(t => t.status === tasksFilter.status);
  if (tasksFilter.type !== 'all') filtered = filtered.filter(t => t.type === tasksFilter.type);
  if (tasksFilter.assignee !== 'all') filtered = filtered.filter(t => (t.assignees||[]).includes(tasksFilter.assignee));

  // Date filter
  if (tasksFilter.dateMode === 'today') {
    const today = todayStr();
    filtered = filtered.filter(t => t.date === today);
  } else if (tasksFilter.dateMode === 'week') {
    const today = new Date();
    const weekStart = new Date(today); weekStart.setDate(today.getDate()-6);
    const ws = weekStart.toISOString().slice(0,10);
    filtered = filtered.filter(t => t.date >= ws);
  } else if (tasksFilter.dateMode === 'month') {
    const ms = todayStr().slice(0,7);
    filtered = filtered.filter(t => (t.date||'').startsWith(ms));
  } else if (tasksFilter.dateMode === 'range') {
    if (tasksFilter.from) filtered = filtered.filter(t => t.date >= tasksFilter.from);
    if (tasksFilter.to) filtered = filtered.filter(t => t.date <= tasksFilter.to);
  }

  // Sort: pending/progress first, then by date desc
  const sortPriority = { pending: 0, progress: 1, done: 2, cancelled: 3 };
  filtered.sort((a,b) => {
    const sa = sortPriority[a.status] ?? 99;
    const sb = sortPriority[b.status] ?? 99;
    if (sa !== sb) return sa - sb;
    return (b.date||'').localeCompare(a.date||'');
  });

  // KPIs
  const today = todayStr();
  const todayTasks = all.filter(t => t.date === today);
  const pending = all.filter(t => t.status === 'pending').length;
  const inProgress = all.filter(t => t.status === 'progress').length;
  const doneToday = all.filter(t => t.date === today && t.status === 'done').length;

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">🚗 المهام الميدانية</div>
        <div class="page-subtitle">صيانة، تركيب، توصيل، زيارات • ${filtered.length} مهمة معروضة</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openTaskForm()">
          ➕ مهمة جديدة
        </button>
        <button class="btn btn-secondary" onclick="exportTasksCSV()">📥 تصدير</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-orange">
        <div class="kpi-icon">⏳</div>
        <div class="kpi-body">
          <div class="kpi-label">معلّقة</div>
          <div class="kpi-val">${pending}</div>
          <div class="kpi-sub">في انتظار البدء</div>
        </div>
      </div>
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">🔄</div>
        <div class="kpi-body">
          <div class="kpi-label">جارية الآن</div>
          <div class="kpi-val">${inProgress}</div>
          <div class="kpi-sub">قيد التنفيذ</div>
        </div>
      </div>
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">✓</div>
        <div class="kpi-body">
          <div class="kpi-label">منجزة اليوم</div>
          <div class="kpi-val">${doneToday}</div>
          <div class="kpi-sub">تم إنهاؤها</div>
        </div>
      </div>
      <div class="kpi-card kpi-purple">
        <div class="kpi-icon">📊</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي</div>
          <div class="kpi-val">${all.length}</div>
          <div class="kpi-sub">كل المهام</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-search-wrap">
        <svg class="filter-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="filter-search-input" placeholder="ابحث في العنوان، الموقع، الوصف..." value="${escapeHtml(tasksFilter.search)}"
               oninput="tasksFilter.search=this.value;updateTasksFilter()">
      </div>
      <select class="form-control" style="width:auto" onchange="tasksFilter.status=this.value;renderTasksPage()">
        <option value="all">كل الحالات</option>
        ${Object.entries(TASK_STATUS).map(([k,v]) => `<option value="${k}" ${tasksFilter.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select class="form-control" style="width:auto" onchange="tasksFilter.type=this.value;renderTasksPage()">
        <option value="all">كل الأنواع</option>
        ${Object.entries(TASK_TYPES).map(([k,v]) => `<option value="${k}" ${tasksFilter.type===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
      </select>
      <select class="form-control" style="width:auto" onchange="tasksFilter.assignee=this.value;renderTasksPage()">
        <option value="all">كل الموظفين</option>
        ${DB.data.employees.filter(e=>!e.disabled).map(e => `<option value="${e.id}" ${tasksFilter.assignee===e.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
      </select>
      <select class="form-control" style="width:auto" onchange="tasksFilter.dateMode=this.value;renderTasksPage()">
        <option value="all">كل التواريخ</option>
        <option value="today" ${tasksFilter.dateMode==='today'?'selected':''}>اليوم</option>
        <option value="week" ${tasksFilter.dateMode==='week'?'selected':''}>هذا الأسبوع</option>
        <option value="month" ${tasksFilter.dateMode==='month'?'selected':''}>هذا الشهر</option>
        <option value="range" ${tasksFilter.dateMode==='range'?'selected':''}>فترة محددة</option>
      </select>
      ${tasksFilter.dateMode === 'range' ? `
        <input type="date" class="form-control" style="width:140px" value="${tasksFilter.from}" onchange="tasksFilter.from=this.value;renderTasksPage()">
        <input type="date" class="form-control" style="width:140px" value="${tasksFilter.to}" onchange="tasksFilter.to=this.value;renderTasksPage()">
      ` : ''}
      <button class="btn btn-ghost btn-sm" onclick="tasksFilter={search:'',status:'all',type:'all',assignee:'all',dateMode:'all',from:'',to:''};renderTasksPage()">إعادة ضبط</button>
    </div>

    <!-- Task list -->
    ${filtered.length === 0 ? `
      <div class="empty-state">
        <div class="icon">🚗</div>
        <h3>لا توجد مهام مطابقة</h3>
        <p>ابدأ بإضافة مهمة جديدة من الزرار في الأعلى</p>
      </div>
    ` : filtered.map(t => renderTaskCard(t)).join('')}
  `;
}

function updateTasksFilter() {
  const focused = document.activeElement;
  const cursorPos = focused && focused.selectionStart;
  renderTasksPage();
  if (focused && focused.tagName === 'INPUT') {
    const newInput = document.querySelector('.filter-search-input');
    if (newInput) {
      newInput.focus();
      try { newInput.setSelectionRange(cursorPos, cursorPos); } catch(e){}
    }
  }
}

function saveTask(id) {
  const title = document.getElementById('task-title').value.trim();
  if (!title) { toast('عنوان المهمة مطلوب', 'error'); return; }
  const date = document.getElementById('task-date').value;
  if (!date) { toast('التاريخ مطلوب', 'error'); return; }

  const assignees = Array.from(document.querySelectorAll('input[name="assignees"]:checked')).map(i => i.value);
  if (assignees.length === 0) { toast('اختر موظف واحد على الأقل', 'error'); return; }

  const data = {
    type: document.getElementById('task-type').value,
    priority: document.getElementById('task-priority').value,
    title,
    location: document.getElementById('task-location').value.trim(),
    customer: document.getElementById('task-customer').value.trim(),
    customerPhone: document.getElementById('task-customer-phone').value.trim(),
    description: document.getElementById('task-description').value.trim(),
    estimatedDuration: parseInt(document.getElementById('task-duration').value) || 60,
    date,
    time: document.getElementById('task-time').value,
    assignees
  };

  if (id) {
    const task = DB.data.tasks.find(t => t.id === id);
    if (!task) return;
    const statusEl = document.getElementById('task-status');
    if (statusEl) data.status = statusEl.value;
    Object.assign(task, data);
    task.updatedAt = Date.now();
  } else {
    if (!DB.data.counters) DB.data.counters = { task: 1000 };
    DB.data.counters.task = (DB.data.counters.task || 1000) + 1;
    DB.data.tasks.push({
      id: 'task_' + uid(),
      number: DB.data.counters.task,
      ...data,
      status: 'pending',
      createdAt: Date.now(),
      createdBy: currentUser.id
    });
  }

  DB.save();
  toast(`✓ ${id?'تم تحديث':'تم إضافة'} المهمة`, 'success');
  closeModal();
  renderTasksPage();
  renderSidebar();
}

function updateTaskStatus(id, status) {
  const t = DB.data.tasks.find(t => t.id === id);
  if (!t) return;
  const prev = t.status;
  t.status = status;
  t.updatedAt = Date.now();
  if (status === 'progress' && !t.startedAt) {
    t.startedAt = Date.now();
    t.startedTime = nowTime();
  }
  if (status === 'done' && !t.completedAt) {
    t.completedAt = Date.now();
    t.completedTime = nowTime();
  }
  DB.save();
  toast(`✓ تم تحديث الحالة → ${TASK_STATUS[status].label}`, 'success');
  renderTasksPage();
  renderSidebar();
}

  `, 'large');
}

function deleteTask(id) {
  const t = DB.data.tasks.find(t => t.id === id);
  if (!t) return;
  confirmDialog(`حذف مهمة "${t.title}"؟`, () => {
    DB.data.tasks = DB.data.tasks.filter(x => x.id !== id);
    DB.save();
    toast('تم الحذف', 'success');
    renderTasksPage();
    renderSidebar();
  });
}

function exportTasksCSV() {
  if (DB.data.tasks.length === 0) { toast('لا توجد مهام', 'warning'); return; }
  let csv = 'الرقم,التاريخ,النوع,العنوان,الموقع,العميل,الفنيون,الحالة,الأولوية\n';
  DB.data.tasks.forEach(t => {
    const type = TASK_TYPES[t.type]?.label || '-';
    const assignees = (t.assignees||[]).map(id => {
      const e = DB.data.employees.find(emp => emp.id === id);
      return e ? e.name : '';
    }).filter(Boolean).join(' / ');
    const status = TASK_STATUS[t.status]?.label.replace(/[⏳🔄✓✕]/g,'').trim() || '-';
    csv += `"${t.number||''}","${t.date||''}","${type}","${t.title||''}","${t.location||''}","${t.customer||''}","${assignees}","${status}","${t.priority||''}"\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tasks-${todayStr()}.csv`;
  a.click();
  toast('✓ تم التصدير', 'success');
}

function renderDashboardCharts() {
  // Monthly attendance chart
  const today = todayStr();
  const monthStart = today.slice(0,7);
  const daysInMonth = [];
  const d = new Date(today);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  for (let i = 1; i <= lastDay; i++) {
    const dayStr = `${monthStart}-${String(i).padStart(2,'0')}`;
    daysInMonth.push(dayStr);
  }
  const monthData = daysInMonth.map(day => {
    return DB.data.attendance.filter(a => a.date === day && a.checkIn).length;
  });
  const monthCanvas = document.getElementById('chart-monthly-attendance');
  if (monthCanvas) {
    new Chart(monthCanvas, {
      type: 'line',
      data: {
        labels: daysInMonth.map(d => d.slice(-2)),
        datasets: [{
          label: 'الحضور',
          data: monthData,
          borderColor: '#10b981',
          backgroundColor: 'rgba(16,185,129,.10)',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
          pointBackgroundColor: '#10b981'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(100,116,139,.10)' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // Tasks by type
  const typesData = {};
  DB.data.tasks.forEach(t => {
    const tp = t.type || 'other';
    typesData[tp] = (typesData[tp]||0) + 1;
  });
  const taskCanvas = document.getElementById('chart-tasks-type');
  if (taskCanvas && Object.keys(typesData).length > 0) {
    new Chart(taskCanvas, {
      type: 'doughnut',
      data: {
        labels: Object.keys(typesData).map(k => (TASK_TYPES[k]||{label:k}).label),
        datasets: [{
          data: Object.values(typesData),
          backgroundColor: ['#f59e0b','#06b6d4','#10b981','#7c3aed','#64748b']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }
      }
    });
  }

  // Top employees
  const empScores = {};
  DB.data.employees.forEach(e => empScores[e.id] = { emp: e, attendance: 0, tasks: 0 });
  DB.data.attendance.filter(a => (a.date||'').startsWith(today.slice(0,7)) && a.checkIn).forEach(a => {
    if (empScores[a.employeeId]) empScores[a.employeeId].attendance++;
  });
  DB.data.tasks.filter(t => (t.date||'').startsWith(today.slice(0,7))).forEach(t => {
    (t.assignees||[]).forEach(id => {
      if (empScores[id]) empScores[id].tasks++;
    });
  });
  const ranked = Object.values(empScores)
    .map(s => ({ ...s, score: s.attendance + s.tasks * 2 }))
    .sort((a,b) => b.score - a.score)
    .slice(0, 5);
  const topHost = document.getElementById('top-employees');
  if (topHost) {
    topHost.innerHTML = ranked.length === 0 ? '<p style="color:var(--text-muted);font-size:13px;text-align:center">لا توجد بيانات</p>' :
      ranked.map((r, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px;background:${i===0?'linear-gradient(135deg,rgba(245,158,11,.10),var(--surface-2))':'var(--surface-2)'};border-radius:10px;margin-bottom:6px;border:1px solid ${i===0?'rgba(245,158,11,.30)':'var(--border)'}">
          <div style="font-size:18px;font-weight:900;color:${i===0?'#c2410c':'var(--text-muted)'};width:24px;text-align:center">${['🥇','🥈','🥉','4','5'][i]||(i+1)}</div>
          <div class="lp-row-avatar" style="width:32px;height:32px;font-size:13px">${r.emp.photo?`<img src="${r.emp.photo}">`:escapeHtml(r.emp.name.charAt(0))}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:800">${escapeHtml(r.emp.name)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${r.attendance} حضور • ${r.tasks} مهمة</div>
          </div>
          <div style="font-weight:900;color:var(--primary-dark)">${r.score}</div>
        </div>
      `).join('');
  }
}

let scheduleWeekOffset = 0; // 0 = current week, -1 = last, +1 = next

function renderSchedulePage() {
  const content = document.getElementById('content');
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Compute week boundaries
  const today = new Date();
  today.setDate(today.getDate() + scheduleWeekOffset * 7);
  const day = today.getDay(); // 0 = Sunday
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - day);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    days.push({
      date: d.toISOString().slice(0,10),
      label: d.toLocaleDateString('ar-EG', { weekday: 'short' }),
      shortDate: d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'numeric' }),
      isToday: d.toDateString() === new Date().toDateString(),
      code: ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()]

  const weekStartStr = days[0].date;
  const weekEndStr = days[6].date;
  const settings = DB.data.settings;

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">📅 الورديات والجدولة</div>

    </div>

    ${scheduleWeekOffset !== 0 ? `
      <div style="text-align:center;margin-bottom:14px">

    ${employees.length === 0 ? `
      <div class="empty-state">
        <div class="icon">📅</div>
        <h3>لا يوجد موظفين</h3>
        <p>أضف موظفين أولاً لتتمكن من جدولة الورديات</p>
      </div>
    ` : `
      <div class="schedule-grid" style="grid-template-columns:200px repeat(7, 1fr)">
        <div class="sched-header" style="background:var(--primary-50);color:var(--primary-dark)">الموظف</div>

          ${days.map(d => {
            const shift = DB.data.shifts.find(s => s.employeeId === emp.id && s.date === d.date);
            const weekendDef = (settings.weekendDays||[]).includes(d.code);
            const isOff = shift?.type === 'off' || (!shift && weekendDef);
            const isToday = d.isToday;
            let content = '';
            let classNames = `sched-cell ${isToday?'is-today':''}`;
            if (shift && shift.type !== 'off') {
              classNames += ' has-shift';
              content = `<div style="font-weight:900">${escapeHtml(shift.shiftName||'وردية')}</div>
                         <div style="font-size:10px;margin-top:2px">${shift.from||settings.workStart} - ${shift.to||settings.workEnd}</div>`;
            } else if (isOff) {
              classNames += ' is-off';
              content = `<div style="opacity:0.6">إجازة</div>`;
            } else {
              content = `<div style="opacity:0.3">+</div>`;
            }
            return `<div class="${classNames}" onclick="openShiftForm('${emp.id}','${d.date}')">${content}</div>`;
          }).join('')}
        `).join('')}
      </div>

      <div style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted)">

        <div style="font-size:11px">💡 اضغط على أي خانة لإضافة/تعديل وردية</div>

    `}
  `;
}

function saveShift() {
  const empId = document.getElementById('sh-emp').value;
  const date = document.getElementById('sh-date').value;
  if (!empId || !date) { toast('اختر الموظف والتاريخ', 'error'); return; }

  const data = {
    employeeId: empId,
    date,
    shiftName: document.getElementById('sh-name').value.trim() || 'عادية',
    type: document.getElementById('sh-type').value,
    from: document.getElementById('sh-from').value,
    to: document.getElementById('sh-to').value,
    notes: document.getElementById('sh-notes').value.trim()
  };

  const existing = DB.data.shifts.find(s => s.employeeId === empId && s.date === date);
  if (existing) {
    Object.assign(existing, data, { updatedAt: Date.now() });
  } else {
    DB.data.shifts.push({ id: 'sh_' + uid(), ...data, createdAt: Date.now() });
  }
  DB.save();
  toast('✓ تم الحفظ', 'success');
  closeModal();
  renderSchedulePage();
}

function deleteShift(id) {
  DB.data.shifts = DB.data.shifts.filter(s => s.id !== id);
  DB.save();
  toast('تم الحذف', 'success');
  closeModal();
  renderSchedulePage();
}

function autoFillDefaultShifts(weekStart, weekEnd) {
  const employees = DB.data.employees.filter(e => !e.disabled);
  const settings = DB.data.settings;
  let count = 0;

  employees.forEach(emp => {
    for (let d = new Date(weekStart); d <= new Date(weekEnd); d.setDate(d.getDate()+1)) {
      const dateStr = d.toISOString().slice(0,10);
      const code = ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()];
      // Skip if shift exists
      if (DB.data.shifts.find(s => s.employeeId === emp.id && s.date === dateStr)) continue;
      const isWeekend = (settings.weekendDays||[]).includes(code);
      DB.data.shifts.push({
        id: 'sh_' + uid(),
        employeeId: emp.id,
        date: dateStr,
        shiftName: isWeekend ? 'إجازة أسبوعية' : 'عادية',
        type: isWeekend ? 'off' : 'work',
        from: settings.workStart,
        to: settings.workEnd,
        notes: '',
        createdAt: Date.now()
      });
      count++;
    }
  });
  DB.save();
  toast(`✓ تم إضافة ${count} وردية تلقائياً`, 'success');
  renderSchedulePage();
}

/* ===========================================================
   REPORTS — Comprehensive analytics
=========================================================== */
let reportPeriod = 'month'; // day|week|month|range
let reportFrom = '';
let reportTo = '';

function renderReportsPage() {
  const content = document.getElementById('content');
  const today = todayStr();

  // Determine date range
  let from, to = today;
  if (reportPeriod === 'day') { from = today; }
  else if (reportPeriod === 'week') {
    const w = new Date(today); w.setDate(w.getDate()-6);
    from = w.toISOString().slice(0,10);
  } else if (reportPeriod === 'month') {
    from = today.slice(0,7) + '-01';
    const d = new Date(today.slice(0,7) + '-01');
    d.setMonth(d.getMonth()+1); d.setDate(0);
    to = d.toISOString().slice(0,10);
  } else if (reportPeriod === 'range') {
    from = reportFrom || today;
    to = reportTo || today;
  }

  const attendance = DB.data.attendance.filter(a => a.date >= from && a.date <= to);
  const tasks = DB.data.tasks.filter(t => t.date >= from && t.date <= to);
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Per-employee stats
  const stats = employees.map(emp => {
    const empAtt = attendance.filter(a => a.employeeId === emp.id);
    const empTasks = tasks.filter(t => (t.assignees||[]).includes(emp.id));
    const presentDays = empAtt.filter(a => a.checkIn).length;
    const settings = DB.data.settings;
    const lateDays = empAtt.filter(a => a.checkIn && diffMinutes(settings.workStart, a.checkIn) > settings.lateGraceMins).length;
    const totalMinutes = empAtt.reduce((s,a) => s + (a.checkIn && a.checkOut ? diffMinutes(a.checkIn, a.checkOut) : 0), 0);
    const tasksByType = {};
    empTasks.forEach(t => {
      const tp = t.type || 'other';
      tasksByType[tp] = (tasksByType[tp]||0) + 1;
    });
    return {
      emp,
      presentDays,
      lateDays,
      totalMinutes,
      totalTasks: empTasks.length,
      doneTasks: empTasks.filter(t => t.status === 'done').length,
      tasksByType
    };
  });

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">📈 التقارير</div>
        <div class="page-subtitle">من ${fmtDate(from)} إلى ${fmtDate(to)}</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="printReport()">🖨️ طباعة</button>
        <button class="btn btn-secondary" onclick="exportReportCSV()">📥 Excel</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${reportPeriod==='day'?'active':''}" onclick="reportPeriod='day';renderReportsPage()">اليوم</button>
      <button class="tab ${reportPeriod==='week'?'active':''}" onclick="reportPeriod='week';renderReportsPage()">آخر 7 أيام</button>
      <button class="tab ${reportPeriod==='month'?'active':''}" onclick="reportPeriod='month';renderReportsPage()">هذا الشهر</button>
      <button class="tab ${reportPeriod==='range'?'active':''}" onclick="reportPeriod='range';renderReportsPage()">فترة محددة</button>
    </div>

    ${reportPeriod === 'range' ? `
      <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center">
        <span style="font-weight:700">من:</span>
        <input class="form-control" style="width:170px" type="date" value="${reportFrom}" onchange="reportFrom=this.value;renderReportsPage()">
        <span style="font-weight:700">إلى:</span>
        <input class="form-control" style="width:170px" type="date" value="${reportTo}" onchange="reportTo=this.value;renderReportsPage()">
      </div>
    ` : ''}

    <!-- Summary KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">📋</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي ساعات العمل</div>
          <div class="kpi-val">${minsToHours(stats.reduce((s,st) => s+st.totalMinutes, 0))}</div>
        </div>
      </div>
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">👥</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي أيام الحضور</div>
          <div class="kpi-val">${stats.reduce((s,st) => s+st.presentDays, 0)}</div>
        </div>
      </div>
      <div class="kpi-card kpi-orange">
        <div class="kpi-icon">⚠️</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي حالات التأخير</div>
          <div class="kpi-val">${stats.reduce((s,st) => s+st.lateDays, 0)}</div>
        </div>
      </div>
      <div class="kpi-card kpi-purple">
        <div class="kpi-icon">🚗</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي المهام</div>
          <div class="kpi-val">${tasks.length}</div>
          <div class="kpi-sub">${tasks.filter(t=>t.status==='done').length} منجزة</div>
        </div>
      </div>
    </div>

    <!-- Per-employee report table -->
    <div class="card" id="report-table-card">
      <div class="card-header">
        <div class="card-title">📊 تقرير تفصيلي لكل موظف</div>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>الموظف</th>
              <th>أيام الحضور</th>
              <th>أيام التأخير</th>
              <th>ساعات العمل</th>
              <th>المهام المسندة</th>
              <th>المهام المنجزة</th>
              <th>صيانة</th>
              <th>تركيب</th>
              <th>توصيل</th>
              <th>زيارات</th>
            </tr>
          </thead>
          <tbody>
            ${stats.length === 0 ? '<tr><td colspan="10" class="empty-state">لا توجد بيانات</td></tr>' :
              stats.sort((a,b) => b.totalMinutes - a.totalMinutes).map(s => `<tr>
                <td>

}

function exportReportCSV() {
  if (!window._currentReport) { toast('لا توجد بيانات', 'warning'); return; }
  const { stats, from, to } = window._currentReport;
  let csv = `تقرير من ${from} إلى ${to}\n\n`;
  csv += 'الموظف,الوظيفة,أيام الحضور,أيام التأخير,ساعات العمل,إجمالي المهام,المهام المنجزة,صيانة,تركيب,توصيل,زيارات\n';
  stats.forEach(s => {
    csv += `"${s.emp.name}","${s.emp.position||''}",${s.presentDays},${s.lateDays},"${minsToHours(s.totalMinutes)}",${s.totalTasks},${s.doneTasks},${s.tasksByType.maintenance||0},${s.tasksByType.installation||0},${s.tasksByType.delivery||0},${s.tasksByType.visit||0}\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `hr-report-${from}-${to}.csv`;
  a.click();
  toast('✓ تم التصدير', 'success');
}

  DB.data.settings.workEnd = document.getElementById('set-work-end').value;
  DB.data.settings.lateGraceMins = parseInt(document.getElementById('set-late-grace').value) || 15;
  DB.data.settings.weekendDays = Array.from(document.querySelectorAll('input[name="weekend"]:checked')).map(i => i.value);
  DB.save();
  toast('✓ تم حفظ الإعدادات', 'success');
}

function exportFullBackup() {
  const blob = new Blob([JSON.stringify(DB.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `emdadx-hr-backup-${todayStr()}.json`;
  a.click();
  toast('✓ تم تنزيل النسخة الاحتياطية', 'success');
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.users) { toast('ملف غير صالح', 'error'); return; }
        confirmDialog('هل تريد استبدال كل البيانات الحالية؟ لا يمكن التراجع.', () => {
          DB.data = data;
          DB.save();
          toast('✓ تم الاستعادة', 'success');
          location.reload();
        });
      } catch (err) {
        toast('ملف غير صالح', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmClearAll() {
  confirmDialog('⚠️ هل أنت متأكد من مسح كل البيانات؟ لا يمكن التراجع عن هذه العملية!', () => {
    localStorage.removeItem(STORAGE_KEY);
    toast('تم مسح البيانات', 'info');
    setTimeout(() => location.reload(), 800);
  });
}

=========================================================== */

let payrollMonth = todayStr().slice(0,7); // YYYY-MM

function renderPayrollPage() {
  const content = document.getElementById('content');
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Find existing run for this month
  if (!DB.data.salaryRuns) DB.data.salaryRuns = [];
  const run = DB.data.salaryRuns.find(r => r.month === payrollMonth);

  // Build staging from run or fresh
  if (!window._payrollStaging || window._payrollStagingMonth !== payrollMonth) {
    window._payrollStaging = employees.map(emp => {
      const existing = run ? (run.items||[]).find(i => i.employeeId === emp.id) : null;
      // Auto-compute deductions from absence/late
      const monthAtt = DB.data.attendance.filter(a => a.employeeId === emp.id && (a.date||'').startsWith(payrollMonth) && a.checkIn);
      const settings = DB.data.settings;
      const lateDays = monthAtt.filter(a => diffMinutes(settings.workStart, a.checkIn) > settings.lateGraceMins).length;
      return existing || {
        employeeId: emp.id,
        name: emp.name,
        baseSalary: emp.baseSalary || 0,
        bonus: 0,
        deduction: 0,
        advance: 0,
        note: '',
        presentDays: monthAtt.length,
        lateDays,
        included: true
      };
    });
    window._payrollStagingMonth = payrollMonth;
  }

  const staging = window._payrollStaging;
  const totalNet = staging.filter(s => s.included).reduce((sum, s) => sum + computeNet(s), 0);
  const totalBase = staging.filter(s => s.included).reduce((sum, s) => sum + (s.baseSalary||0), 0);
  const totalBonus = staging.filter(s => s.included).reduce((sum, s) => sum + (s.bonus||0), 0);
  const totalDeduction = staging.filter(s => s.included).reduce((sum, s) => sum + (s.deduction||0) + (s.advance||0), 0);
  const includedCount = staging.filter(s => s.included).length;

  content.innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">💰 المرتبات</div>
        <div class="page-subtitle">إدارة وصرف مرتبات الموظفين شهرياً</div>
      </div>
      <div class="page-actions">
        <input type="month" class="form-control" style="width:auto" value="${payrollMonth}" onchange="payrollMonth=this.value;window._payrollStaging=null;renderPayrollPage()">
        <button class="btn btn-primary" onclick="savePayrollRun()">💾 حفظ كشف الرواتب</button>
        <button class="btn btn-secondary" onclick="printPayroll()">🖨️ طباعة</button>
      </div>
    </div>

    ${run ? `<div style="padding:10px 14px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.30);border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--primary-dark)">
      ✓ تم حفظ كشف رواتب هذا الشهر بتاريخ ${fmtDate(new Date(run.savedAt).toISOString().slice(0,10))} — يمكنك التعديل وإعادة الحفظ
    </div>` : ''}

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card kpi-green">
        <div class="kpi-icon">💵</div>
        <div class="kpi-body">
          <div class="kpi-label">صافي المرتبات</div>
          <div class="kpi-val">${fmtMoney(totalNet)}</div>
          <div class="kpi-sub">${includedCount} موظف</div>
        </div>
      </div>
      <div class="kpi-card kpi-blue">
        <div class="kpi-icon">📋</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي الأساسي</div>
          <div class="kpi-val">${fmtMoney(totalBase)}</div>
        </div>
      </div>
      <div class="kpi-card kpi-purple">
        <div class="kpi-icon">🎁</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي الحوافز</div>
          <div class="kpi-val">${fmtMoney(totalBonus)}</div>
        </div>
      </div>
      <div class="kpi-card kpi-red">
        <div class="kpi-icon">➖</div>
        <div class="kpi-body">
          <div class="kpi-label">إجمالي الخصومات والسلف</div>
          <div class="kpi-val">${fmtMoney(totalDeduction)}</div>
        </div>
      </div>
    </div>

    <!-- Payroll table -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 كشف رواتب ${payrollMonth}</div>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:30px"><input type="checkbox" checked onchange="togglePayrollAll(this.checked)" style="accent-color:#10b981"></th>
              <th>الموظف</th>
              <th>أيام الحضور</th>
              <th>الأساسي</th>
              <th>حوافز</th>
              <th>خصومات</th>
              <th>سلفة</th>
              <th>الصافي</th>
              <th>ملاحظة</th>
            </tr>
          </thead>
          <tbody>
            ${staging.length === 0 ? '<tr><td colspan="9" class="empty-state"><div class="icon">💰</div><h3>لا يوجد موظفين</h3></td></tr>' :
              staging.map((s, idx) => {
                const emp = DB.data.employees.find(e => e.id === s.employeeId);
                return `<tr style="${!s.included?'opacity:0.45':''}">
                  <td><input type="checkbox" ${s.included?'checked':''} onchange="togglePayrollRow(${idx}, this.checked)" style="accent-color:#10b981"></td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <div class="lp-row-avatar" style="width:30px;height:30px;font-size:12px">${emp&&emp.photo?`<img src="${emp.photo}">`:escapeHtml(s.name.charAt(0))}</div>
                      <div>
                        <b style="font-size:12.5px">${escapeHtml(s.name)}</b>
                        ${s.lateDays>0?`<br><small style="color:#c2410c">${s.lateDays} تأخير</small>`:''}
                      </div>
                    </div>
                  </td>
                  <td><b>${s.presentDays||0}</b></td>
                  <td><input type="number" value="${s.baseSalary||0}" onchange="updatePayrollField(${idx},'baseSalary',this.value)" class="payroll-input" style="width:90px"></td>
                  <td><input type="number" value="${s.bonus||0}" onchange="updatePayrollField(${idx},'bonus',this.value)" class="payroll-input" style="width:80px;color:#047857"></td>
                  <td><input type="number" value="${s.deduction||0}" onchange="updatePayrollField(${idx},'deduction',this.value)" class="payroll-input" style="width:80px;color:#b91c1c"></td>
                  <td><input type="number" value="${s.advance||0}" onchange="updatePayrollField(${idx},'advance',this.value)" class="payroll-input" style="width:80px;color:#b91c1c"></td>
                  <td><b style="color:var(--primary-dark);font-size:14px">${fmtMoney(computeNet(s))}</b></td>
                  <td><input type="text" value="${escapeHtml(s.note||'')}" onchange="updatePayrollField(${idx},'note',this.value)" class="payroll-input" style="width:120px" placeholder="..."></td>
                </tr>`;
              }).join('')
            }
          </tbody>
          <tfoot>
            <tr style="background:var(--surface-2);font-weight:900">
              <td colspan="3" style="text-align:end">الإجمالي</td>
              <td>${fmtMoney(totalBase)}</td>
              <td style="color:#047857">${fmtMoney(totalBonus)}</td>
              <td colspan="2" style="color:#b91c1c">${fmtMoney(totalDeduction)}</td>
              <td style="color:var(--primary-dark);font-size:15px">${fmtMoney(totalNet)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- Past runs -->
    ${DB.data.salaryRuns.length > 0 ? `
    <div class="card" style="margin-top:16px">
      <div class="card-header"><div class="card-title">📅 كشوف الرواتب السابقة</div></div>
      <div class="card-body">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${DB.data.salaryRuns.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(r => `
            <button class="btn btn-sm ${r.month===payrollMonth?'btn-primary':'btn-secondary'}" onclick="payrollMonth='${r.month}';window._payrollStaging=null;renderPayrollPage()">
              ${r.month} — ${fmtMoney(r.totalNet||0)}
            </button>
          `).join('')}
        </div>
      </div>
    </div>` : ''}
  `;
}

function fmtMoney(n) {
  return (n||0).toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' ج.م';
}

function computeNet(s) {
  return (s.baseSalary||0) + (s.bonus||0) - (s.deduction||0) - (s.advance||0);
}

function updatePayrollField(idx, field, value) {
  if (!window._payrollStaging[idx]) return;
  if (field === 'note') {
    window._payrollStaging[idx][field] = value;
  } else {
    window._payrollStaging[idx][field] = parseFloat(value) || 0;
  }
  renderPayrollPage();
}

function togglePayrollRow(idx, checked) {
  if (window._payrollStaging[idx]) window._payrollStaging[idx].included = checked;
  renderPayrollPage();
}

function togglePayrollAll(checked) {
  window._payrollStaging.forEach(s => s.included = checked);
  renderPayrollPage();
}

function savePayrollRun() {
  const staging = window._payrollStaging.filter(s => s.included);
  if (staging.length === 0) { toast('اختر موظف واحد على الأقل', 'error'); return; }

  const totalNet = staging.reduce((sum, s) => sum + computeNet(s), 0);
  if (!DB.data.salaryRuns) DB.data.salaryRuns = [];

  const existing = DB.data.salaryRuns.find(r => r.month === payrollMonth);
  if (existing) {
    existing.items = JSON.parse(JSON.stringify(staging));
    existing.totalNet = totalNet;
    existing.savedAt = Date.now();
  } else {
    DB.data.salaryRuns.push({
      id: 'run_' + uid(),
      month: payrollMonth,
      items: JSON.parse(JSON.stringify(staging)),
      totalNet,
      savedAt: Date.now()
    });
  }
  DB.save();
  toast(`✓ تم حفظ كشف رواتب ${payrollMonth} (${fmtMoney(totalNet)})`, 'success');
  renderPayrollPage();
}

function printPayroll() {
  const staging = (window._payrollStaging||[]).filter(s => s.included);

  if (!q) return;
  const answer = computeAIAnswer(q);
  const host = document.getElementById('ai-answer');
  host.innerHTML = `

function computeAIAnswer(question) {
  const q = normalizeArabic(question);
  const monthStart = todayStr().slice(0,7);
  const settings = DB.data.settings;
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Compute per-employee monthly stats
  const stats = employees.map(emp => {
    const att = DB.data.attendance.filter(a => a.employeeId === emp.id && (a.date||'').startsWith(monthStart) && a.checkIn);
    const lateDays = att.filter(a => diffMinutes(settings.workStart, a.checkIn) > settings.lateGraceMins).length;
    const tasks = DB.data.tasks.filter(t => (t.assignees||[]).includes(emp.id) && (t.date||'').startsWith(monthStart));
    const doneTasks = tasks.filter(t => t.status === 'done').length;
    const totalMins = att.reduce((s,a) => s + (a.checkIn && a.checkOut ? diffMinutes(a.checkIn, a.checkOut) : 0), 0);
    return { emp, presentDays: att.length, lateDays, tasks: tasks.length, doneTasks, totalMins };
  });

  // Late employee
  if (q.includes('متاخر') || q.includes('تاخير')) {
    const sorted = stats.filter(s => s.lateDays > 0).sort((a,b) => b.lateDays - a.lateDays);
    if (sorted.length === 0) return '✅ ممتاز! مفيش أي موظف متأخر هذا الشهر — كل الموظفين بيحضروا في الوقت المحدد.';
    const top = sorted[0];
    let ans = `<b>أكتر موظف متأخر هذا الشهر:</b><br>🥇 <b>${escapeHtml(top.emp.name)}</b> — تأخر <b style="color:#c2410c">${top.lateDays}</b> مرة.<br><br>`;
    if (sorted.length > 1) {
      ans += '<b>باقي المتأخرين:</b><br>';
      ans += sorted.slice(1, 5).map((s,i) => `${i+2}. ${escapeHtml(s.emp.name)} — ${s.lateDays} مرة`).join('<br>');
    }
    return ans;
  }

  // Salary cost
  if (q.includes('مرتب') || q.includes('رواتب') || q.includes('تكلفه') || q.includes('تكلفة')) {
    const run = (DB.data.salaryRuns||[]).find(r => r.month === monthStart);
    if (run) {
      return `<b>💰 تكلفة مرتبات شهر ${monthStart}:</b><br>الإجمالي المحفوظ: <b style="color:#16a34a;font-size:16px">${fmtMoney(run.totalNet)}</b><br>عدد الموظفين: ${(run.items||[]).length}`;
    }
    const totalBase = employees.reduce((s,e) => s + (e.baseSalary||0), 0);
    return `<b>💰 تكلفة المرتبات الأساسية المتوقعة:</b><br>إجمالي المرتبات الأساسية: <b style="color:#16a34a;font-size:16px">${fmtMoney(totalBase)}</b><br>عدد الموظفين النشطين: ${employees.length}<br><br><small style="color:var(--text-muted)">💡 لم يتم حفظ كشف رواتب لهذا الشهر بعد. اذهب لقسم المرتبات لإضافة الحوافز والخصومات.</small>`;
  }

  // Least productive
  if (q.includes('اقل انتاجيه') || q.includes('اقل انتاج') || (q.includes('اقل') && (q.includes('انتاج') || q.includes('مهام')))) {
    const withTasks = stats.slice().sort((a,b) => (a.doneTasks + a.presentDays) - (b.doneTasks + b.presentDays));
    if (withTasks.length === 0) return 'لا توجد بيانات كافية للتحليل.';
    const low = withTasks[0];
    return `<b>📉 أقل الموظفين إنتاجية هذا الشهر:</b><br>⚠️ <b>${escapeHtml(low.emp.name)}</b><br>• أيام حضور: ${low.presentDays}<br>• مهام منجزة: ${low.doneTasks}<br>• ساعات عمل: ${minsToHours(low.totalMins)}<br><br><small style="color:var(--text-muted)">💡 ينصح بمراجعة أسباب انخفاض الإنتاجية ومناقشتها معه.</small>`;
  }

  // Most productive
  if (q.includes('اكتر') && (q.includes('منجز') || q.includes('مهام') || q.includes('انتاج'))) {
    const sorted = stats.slice().sort((a,b) => (b.doneTasks*2 + b.presentDays) - (a.doneTasks*2 + a.presentDays));
    if (sorted.length === 0) return 'لا توجد بيانات كافية.';
    const top = sorted[0];
    let ans = `<b>🏆 أكتر موظف إنجازاً هذا الشهر:</b><br>🥇 <b>${escapeHtml(top.emp.name)}</b><br>• مهام منجزة: <b style="color:#047857">${top.doneTasks}</b><br>• أيام حضور: ${top.presentDays}<br>• ساعات عمل: ${minsToHours(top.totalMins)}`;
    if (sorted.length > 1) {
      ans += '<br><br><b>الترتيب:</b><br>';
      ans += sorted.slice(1,4).map((s,i) => `${i+2}. ${escapeHtml(s.emp.name)} — ${s.doneTasks} مهمة`).join('<br>');
    }
    return ans;
  }

  // Absence
  if (q.includes('غايب') || q.includes('غياب')) {
    // Working days this month so far
    const today = new Date();
    let workDays = 0;
    const d = new Date(monthStart + '-01');
    while (d <= today) {
      const code = ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()];
      if (!(settings.weekendDays||[]).includes(code)) workDays++;
      d.setDate(d.getDate()+1);
    }
    const absent = stats.map(s => ({ ...s, absentDays: Math.max(0, workDays - s.presentDays) }))
                        .filter(s => s.absentDays > 0)
                        .sort((a,b) => b.absentDays - a.absentDays);
    if (absent.length === 0) return '✅ ممتاز! مفيش غياب ملحوظ هذا الشهر.';
    const top = absent[0];
    let ans = `<b>❌ أكتر الموظفين غياباً هذا الشهر:</b><br>(أيام العمل حتى الآن: ${workDays})<br><br>`;
    ans += absent.slice(0,5).map((s,i) => `${i+1}. <b>${escapeHtml(s.emp.name)}</b> — غاب <b style="color:#b91c1c">${s.absentDays}</b> يوم (حضر ${s.presentDays})`).join('<br>');
    return ans;
  }

  // Count employees
  if (q.includes('كام موظف') || q.includes('عدد الموظف')) {
    return `<b>👥 عدد الموظفين:</b><br>• النشطون: <b>${employees.length}</b><br>• الإجمالي: <b>${DB.data.employees.length}</b><br>• المعطّلون: ${DB.data.employees.length - employees.length}`;
  }

  // Default fallback
  return `🤔 لم أفهم سؤالك تماماً. جرب أحد الأسئلة الجاهزة بالأعلى، أو اسأل عن:<br>• التأخير والغياب<br>• تكلفة المرتبات<br>• الإنتاجية (الأكثر/الأقل)<br>• عدد الموظفين`;
}

function renderAIRiskAnalysis() {
  const host = document.getElementById('ai-risk-analysis');
  if (!host) return;
  const monthStart = todayStr().slice(0,7);
  const settings = DB.data.settings;
  const employees = DB.data.employees.filter(e => !e.disabled);

  // Risk score: high lateness + high absence + low tasks = at risk
  const today = new Date();
  let workDays = 0;
  const d = new Date(monthStart + '-01');
  while (d <= today) {
    const code = ['SU','MO','TU','WE','TH','FR','SA'][d.getDay()];
    if (!(settings.weekendDays||[]).includes(code)) workDays++;
    d.setDate(d.getDate()+1);
  }

  const risks = employees.map(emp => {
    const att = DB.data.attendance.filter(a => a.employeeId === emp.id && (a.date||'').startsWith(monthStart) && a.checkIn);
    const lateDays = att.filter(a => diffMinutes(settings.workStart, a.checkIn) > settings.lateGraceMins).length;
    const absentDays = Math.max(0, workDays - att.length);
    const tasks = DB.data.tasks.filter(t => (t.assignees||[]).includes(emp.id) && (t.date||'').startsWith(monthStart) && t.status === 'done').length;

    let score = 0;
    const reasons = [];
    if (workDays > 0 && absentDays / workDays > 0.3) { score += 40; reasons.push(`غياب مرتفع (${absentDays} يوم)`); }
    if (lateDays >= 3) { score += 30; reasons.push(`تأخير متكرر (${lateDays} مرة)`); }
    if (att.length > 0 && tasks === 0) { score += 20; reasons.push('لا توجد مهام منجزة'); }

    return { emp, score, reasons };
  }).filter(r => r.score >= 30).sort((a,b) => b.score - a.score);

  if (risks.length === 0) {
    host.innerHTML = '<div style="text-align:center;padding:20px;color:#047857;font-weight:700">✅ لا يوجد موظفون معرّضون للمخاطر حالياً</div>';
    return;
  }

  host.innerHTML = risks.slice(0,5).map(r => {
    const level = r.score >= 60 ? { label: 'خطر عالٍ', color: '#dc2626' } : { label: 'يحتاج متابعة', color: '#f59e0b' };
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface-2);border-radius:10px;margin-bottom:6px;border-inline-start:3px solid ${level.color}">
      <div class="lp-row-avatar" style="width:34px;height:34px;font-size:13px">${r.emp.photo?`<img src="${r.emp.photo}">`:escapeHtml(r.emp.name.charAt(0))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:800">${escapeHtml(r.emp.name)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${r.reasons.join(' • ')}</div>
      </div>
      <span class="badge" style="background:${level.color}1a;color:${level.color}">${level.label}</span>
    </div>`;
  }).join('');
}

function renderAIAnomaly() {
  const host = document.getElementById('ai-anomaly');
  if (!host) return;
  const monthStart = todayStr().slice(0,7);
  const settings = DB.data.settings;
  const employees = DB.data.employees.filter(e => !e.disabled);

  const anomalies = [];
  employees.forEach(emp => {
    const att = DB.data.attendance.filter(a => a.employeeId === emp.id && (a.date||'').startsWith(monthStart) && a.checkIn);
    // Detect: check-in much earlier or later than usual
    if (att.length >= 3) {
      const times = att.map(a => { const [h,m]=a.checkIn.split(':').map(Number); return h*60+m; });
      const avg = times.reduce((s,t)=>s+t,0)/times.length;
      times.forEach((t, i) => {
        if (Math.abs(t - avg) > 90) { // more than 1.5h deviation
          anomalies.push({ emp, date: att[i].date, time: att[i].checkIn, type: t > avg ? 'متأخر بشكل غير معتاد' : 'مبكر بشكل غير معتاد' });
        }
      });
    }
    // Detect: no checkout (forgot)
    att.forEach(a => {
      if (a.checkIn && !a.checkOut && a.date < todayStr()) {
        anomalies.push({ emp, date: a.date, time: a.checkIn, type: 'لم يسجل انصراف' });
      }
    });
  });

  if (anomalies.length === 0) {
    host.innerHTML = '<div style="text-align:center;padding:20px;color:#047857;font-weight:700">✅ لا توجد أنماط غياب غير طبيعية</div>';
    return;
  }

  host.innerHTML = anomalies.slice(0,6).map(a => `
    <div style="display:flex;align-items:center;gap:10px;padding:9px;background:var(--surface-2);border-radius:10px;margin-bottom:6px">
      <span style="font-size:16px">⚠️</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700">${escapeHtml(a.emp.name)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${a.date} — ${a.type} (${a.time})</div>
      </div>
    </div>
  `).join('');
}

        </div>
        <div style="height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${completionRate}%;background:linear-gradient(90deg,#06b6d4,#0e7490);border-radius:999px;transition:width .6s ease"></div>
        </div>
      </div>
    </div>
    <div style="padding:14px;background:linear-gradient(135deg,rgba(168,85,247,.06),var(--surface));border:1px solid rgba(168,85,247,.25);border-radius:12px">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:#7c3aed">🎯 ملاحظات المساعد الذكي:</div>
      <div style="font-size:13px;line-height:1.9">${insights.map(i => '• ' + i).join('<br>')}</div>
    </div>
  `;
}


</script>
</body>
</html>
