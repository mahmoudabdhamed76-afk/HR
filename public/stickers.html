<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ستيكرات QR — الطابعات</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:#e9eef7;color:#0d1b3a}
.bar{position:sticky;top:0;z-index:5;background:#0a2357;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.bar b{font-size:16px}.bar span{color:#b9c8ec;font-size:13px}
.bar .sp{flex:1}
.bar select,.bar button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 14px;font-size:14px}
.bar select{background:#16337a;color:#fff}
.bar button{background:#f7c12d;color:#0a2357;cursor:pointer}
.msg{max-width:520px;margin:60px auto;background:#fff;border-radius:18px;padding:26px;text-align:center;font-weight:700;line-height:1.9}
.sheet{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:8mm;box-shadow:0 10px 40px -20px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
.big .grid{grid-template-columns:repeat(2,1fr);gap:8mm}
.stk{border:1.5px dashed #9aa6bf;border-radius:4mm;padding:3.5mm;display:flex;flex-direction:column;align-items:center;gap:2mm;break-inside:avoid;page-break-inside:avoid}
.h{display:flex;align-items:center;gap:2mm;width:100%;border-bottom:2px solid #0a2357;padding-bottom:1.5mm}
.lg{width:9mm;height:9mm;border-radius:2mm;background:#0a2357;color:#f7c12d;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-weight:900}
.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.h b{font-size:10pt;display:block;line-height:1.2}.h span{font-size:7pt;color:#6b7a99}
.qr{width:38mm}.big .qr{width:58mm}.qr svg{width:100%;height:auto;display:block}
.t{text-align:center;line-height:1.35}.t b{display:block;font-size:10pt}.big .t b{font-size:13pt}.t span{display:block;font-size:7.5pt;color:#33415c}
.f{background:#f7c12d;color:#0a2357;font-weight:900;font-size:8pt;border-radius:2mm;padding:1mm 3mm}
@media (max-width:230mm){.sheet{width:100%;min-height:0;margin:10px 0}.grid{grid-template-columns:repeat(2,1fr)}}
@media print{@page{size:A4 portrait;margin:0}body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none;width:210mm}.grid{grid-template-columns:repeat(3,1fr)}.big .grid{grid-template-columns:repeat(2,1fr)}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar"><div><b id="ttl">ستيكرات QR</b><br><span id="sub">جاري التحميل...</span></div><span class="sp"></span>
  <select id="sz"><option value="">3 في الصف (صغير)</option><option value="big">2 في الصف (كبير)</option></select>
  <button id="pr">🖨️ اطبع / احفظ PDF</button></div>
<div id="out"></div>
<script src="vendor/qrcode/qrcode.js"></script>
<script>
(function () {
  var BASE = location.pathname.replace(/\/[^/]*$/, ''), qs = new URLSearchParams(location.search), out = document.getElementById('out');
  var tok = null; try { tok = localStorage.getItem('em_att_token'); } catch (e) {}
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(t) { out.innerHTML = '<div class="msg">' + t + '</div>'; document.getElementById('sub').textContent = ''; }
  function qr(u) { var q = qrcode(0, 'M'); q.addData(u); q.make(); return q.createSvgTag({ cellSize: 5, margin: 1, scalable: true }); }
  if (!tok) return msg('سجّل دخول الإدارة في البرنامج الأول من نفس المتصفح، وبعدين افتح الصفحة دي تاني.');
  var H = { Authorization: 'Bearer ' + tok };
  var q = qs.get('c') ? 'center=' + encodeURIComponent(qs.get('c')) : qs.get('d') ? 'device=' + encodeURIComponent(qs.get('d')) : '';
  if (!q) return msg('مفيش طابعات محددة.');
  Promise.all([fetch(BASE + '/api/public-info').then(function (r) { return r.json(); }), fetch(BASE + '/api/links?' + q, { headers: H }).then(function (r) { return r.json(); })]).then(function (res) {
    var info = res[0], d = res[1];
    if (d.error) return msg(esc(d.error));
    var logo = info.logo ? '<img src="' + BASE + '/logo?v=' + info.logo + '" alt="">' : esc((info.company_name || 'E').slice(0, 1));
    var list = [];
    if (d.center) list.push({ url: location.origin + d.path, title: d.center, line: 'بلاغ أعطال المركز' });
    (d.devices || d.rows || []).forEach(function (x) { list.push({ url: location.origin + x.path, title: x.name, line: [(x.brand ? [x.brand, x.model].filter(Boolean).join(' ') : x.model), x.center || d.center].filter(Boolean).join(' — '), serial: x.serial }); });
    if (!list.length) return msg('مفيش طابعات متسجلة للمركز ده — ضيف الطابعات من صفحة "الطابعات والصيانة الدورية" الأول.');
    document.getElementById('ttl').textContent = d.center ? 'ستيكرات ' + d.center : 'ستيكرات الطابعات';
    document.getElementById('sub').textContent = list.length + ' ستيكر — اطبعها على ورق ستيكر A4 والأحسن تتغلف';
    out.innerHTML = '<div class="sheet" id="sh"><div class="grid">' + list.map(function (s) {
      return '<div class="stk"><div class="h"><div class="lg">' + logo + '</div><div><b>' + esc(info.company_name) + '</b><span>صيانة طابعات الأشعة</span></div></div><div class="qr">' + qr(s.url) + '</div><div class="t"><b>' + esc(s.title) + '</b>' + (s.line ? '<span>' + esc(s.line) + '</span>' : '') + (s.serial ? '<span dir="ltr">S/N ' + esc(s.serial) + '</span>' : '') + '</div><div class="f">📷 امسح الكود للإبلاغ عن عطل</div></div>';
    }).join('') + '</div></div>';
  }).catch(function () { msg('مقدرتش أوصل للسيرفر.. جرب تاني'); });
  document.getElementById('pr').onclick = function () { window.print(); };
  document.getElementById('sz').onchange = function (e) { var s = document.getElementById('sh'); if (s) s.className = 'sheet ' + e.target.value; };
})();
</script>
</body>
</html>
