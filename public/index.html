<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2357">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>إدارة الحضور والانصراف — EmdadX</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2357; --navy-2:#11337a; --navy-3:#1b4aa6; --blue:#2563d9; --sky:#eaf1fc; --sky-2:#f5f8fe;
  --gold:#f7c12d; --gold-2:#ffd75e; --gold-bg:#fff6d9; --gold-ink:#7a5600;
  --ink:#0d1b3a; --ink-2:#33415c; --muted:#6b7a99; --line:#e2e9f4; --line-2:#eef2f8; --bg:#eef3fa; --card:#fff;
  --green:#14955a; --green-bg:#e5f6ed; --red:#dc3545; --red-bg:#fdecee; --orange:#e67e0d; --orange-bg:#fff1e0;
  --purple:#6c4ee6; --purple-bg:#efebfe; --teal:#0d9488; --teal-bg:#e0f5f3; --slate:#6f7d99; --slate-bg:#eef1f6;
  --indigo:#4352d8; --indigo-bg:#ebedfd; --blue-bg:#e8f0fd;
  --r:20px; --r-sm:13px;
  --sh:0 1px 2px rgba(10,35,87,.05),0 10px 28px -14px rgba(10,35,87,.20);
  --sh-lg:0 30px 70px -24px rgba(10,35,87,.45);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img,iframe{display:block}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
::selection{background:var(--gold-2);color:var(--navy)}
:focus-visible{outline:3px solid rgba(247,193,45,.65);outline-offset:2px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s;position:relative;overflow:hidden;user-select:none}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 10px 22px -12px rgba(10,35,87,.8)}
.btn-primary:hover{box-shadow:0 14px 26px -12px rgba(10,35,87,.9)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--navy);box-shadow:0 10px 22px -12px rgba(230,170,10,.9)}
.btn-green{background:linear-gradient(135deg,#25b56d,var(--green));color:#fff}
.btn-red{background:linear-gradient(135deg,#f0566a,var(--red));color:#fff}
.btn-soft{background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:0 1px 2px rgba(10,35,87,.05)}
.btn-soft:hover{border-color:#cfd9ea;background:var(--sky-2)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{background:rgba(10,35,87,.05)}
.btn-sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-xs{height:28px;padding:0 10px;border-radius:9px;font-size:12px}
.btn-icon{width:40px;padding:0}
.btn-sm.btn-icon{width:34px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-xls{background:#e7f6ee;color:#0f7a43;border:1px solid #c5ead6}
.btn-pdf{background:#fdecee;color:#c22c3b;border:1px solid #f7cdd2}
.btn-print{background:#e8f0fd;color:#1d4fb0;border:1px solid #cddcf8}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field small{color:var(--muted);font-size:11.5px}
.inp,select.inp,textarea.inp{width:100%;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 13px;outline:none;transition:border .2s,box-shadow .2s;font-size:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 13px;resize:vertical}
.inp:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(27,74,166,.12)}
.inp-sm{height:38px;border-radius:10px;font-size:13.5px}
.inp-ico{position:relative}
.inp-ico svg.i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.inp-ico .inp{padding-inline-start:40px}
input[type=date].inp,input[type=time].inp{direction:ltr;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tr{width:46px;height:26px;border-radius:20px;background:#cfd8e6;position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+.tr{background:var(--green)}
.switch input:checked+.tr::after{inset-inline-start:23px}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{cursor:pointer}
.daypick input{display:none}
.daypick span{display:inline-flex;height:34px;padding:0 12px;align-items:center;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink-2);background:#fff;transition:.15s}
.daypick input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.optcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.optcards label{cursor:pointer}
.optcards input{display:none}
.optcards .oc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;text-align:center;font-weight:700;font-size:13px;transition:.15s;height:100%}
.optcards .oc small{font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.4}
.optcards input:checked+.oc{border-color:var(--navy);background:var(--sky-2);box-shadow:0 0 0 3px rgba(10,35,87,.08)}

/* ---------- chips & tiles ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap;line-height:1}
.chip svg.i{width:14px;height:14px}
.c-green{background:var(--green-bg);color:var(--green)}
.c-red{background:var(--red-bg);color:var(--red)}
.c-orange{background:var(--orange-bg);color:var(--orange)}
.c-purple{background:var(--purple-bg);color:var(--purple)}
.c-teal{background:var(--teal-bg);color:var(--teal)}
.c-slate{background:var(--slate-bg);color:var(--slate)}
.c-blue{background:var(--blue-bg);color:var(--blue)}
.c-indigo{background:var(--indigo-bg);color:var(--indigo)}
.c-gold{background:var(--gold-bg);color:var(--gold-ink)}
.c-navy{background:var(--navy);color:#fff}
.flag{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.flag.red{color:var(--red)} .flag.orange{color:var(--orange)} .flag.slate{color:var(--slate)} .flag.blue{color:var(--blue)} .flag.green{color:var(--green)} .flag.purple{color:var(--purple)}
.tile{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:inset 0 -5px 10px rgba(0,0,0,.10),0 10px 18px -10px var(--c,#0a2357)}
.tile svg.i{width:24px;height:24px}
.tile.sm{width:40px;height:40px;border-radius:13px}
.tile.sm svg.i{width:20px;height:20px}
.tile.xs{width:32px;height:32px;border-radius:10px}
.tile.xs svg.i{width:17px;height:17px}
.t-blue{--c:#2563d9;background:linear-gradient(155deg,#5a95f5,#1d55c9)}
.t-green{--c:#14955a;background:linear-gradient(155deg,#3fcf86,#10874f)}
.t-orange{--c:#e67e0d;background:linear-gradient(155deg,#ffb54f,#ea760a)}
.t-red{--c:#dc3545;background:linear-gradient(155deg,#ff6f7d,#d22a3b)}
.t-purple{--c:#6c4ee6;background:linear-gradient(155deg,#a08bff,#5e3fe0)}
.t-teal{--c:#0d9488;background:linear-gradient(155deg,#3ccfc2,#0b877c)}
.t-slate{--c:#6f7d99;background:linear-gradient(155deg,#aab5ca,#6d7a96)}
.t-navy{--c:#0a2357;background:linear-gradient(155deg,#2c56a8,#0a2357)}
.t-indigo{--c:#4352d8;background:linear-gradient(155deg,#7c88f4,#3a47cc)}
.t-gold{--c:#f2b40c;background:linear-gradient(155deg,#ffdc6e,#f2b40c);color:var(--navy)}
.t-pink{--c:#e0457b;background:linear-gradient(155deg,#ff7aa5,#d93a70)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;letter-spacing:-.5px}
.av.lg{width:58px;height:58px;border-radius:18px;font-size:20px}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:12px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;background:linear-gradient(160deg,#f7faff 0%,#eaf1fb 100%);position:relative;overflow:hidden}
.lg-hero{position:relative;padding:48px 56px 140px;display:flex;flex-direction:column;justify-content:center;gap:22px;z-index:1}
.lg-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 300px at 80% 10%,rgba(37,99,217,.10),transparent 70%),radial-gradient(500px 300px at 10% 60%,rgba(247,193,45,.12),transparent 70%);z-index:-1}
.lg-kicker{font-weight:800;color:var(--navy);font-size:20px;display:inline-flex;flex-direction:column;align-self:flex-start;transform:rotate(-3deg)}
.lg-kicker svg{width:150px;height:14px;margin-top:-2px}
.lg-title{font-size:clamp(34px,4.4vw,60px);font-weight:900;line-height:1.15;color:var(--navy);letter-spacing:-1px}
.lg-title em{font-style:normal;display:block;background:linear-gradient(90deg,var(--navy),var(--navy-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-pill{align-self:flex-start;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--navy);font-weight:900;font-size:clamp(16px,1.8vw,24px);padding:8px 26px;border-radius:16px;box-shadow:0 14px 30px -14px rgba(230,170,10,.9);position:relative}
.lg-pill::before,.lg-pill::after{content:'';position:absolute;top:50%;width:16px;height:3px;background:var(--navy);border-radius:2px}
.lg-pill::before{right:-26px;transform:rotate(-30deg)} .lg-pill::after{left:-26px;transform:rotate(30deg)}
.lg-tag{font-size:17px;font-weight:700;color:var(--ink-2)}
.lg-feats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:22px;box-shadow:var(--sh);padding:18px 8px}
.lg-feats>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;border-inline-start:1px solid var(--line-2)}
.lg-feats>div:first-child{border:0}
.lg-feats .fi{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.lg-feats b{font-size:14px;color:var(--navy);line-height:1.3}
.lg-feats span{font-size:12px;color:var(--muted);line-height:1.3}
.lg-more{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:28px 16px 16px;position:relative}
.lg-more h4{position:absolute;top:-17px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;font-weight:800;padding:4px 26px;border-radius:12px;font-size:15px;white-space:nowrap}
.lg-more .g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px}
.lg-more .g div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.lg-more .g b{font-size:12.5px;color:var(--navy);line-height:1.25}
.lg-more .g span{font-size:11px;color:var(--muted);line-height:1.2;margin-top:-4px}
.lg-wave{position:absolute;bottom:0;left:0;width:min(560px,46vw);z-index:0;pointer-events:none}
.lg-wave-txt{position:absolute;bottom:34px;left:44px;color:#fff;font-weight:900;font-size:30px;line-height:1.15;transform:rotate(-6deg);z-index:2;pointer-events:none}
.lg-wave-txt small{display:block;font-size:20px;font-weight:700;opacity:.9}
.lg-wave-txt b{color:var(--gold)}
.lg-side{display:flex;align-items:center;justify-content:center;padding:32px;z-index:2}
.lg-card{width:100%;max-width:420px;background:#fff;border-radius:28px;box-shadow:var(--sh-lg);padding:32px 30px 26px;position:relative}
.lg-card::before{content:'';position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(160deg,rgba(247,193,45,.8),transparent 40%,transparent 60%,rgba(10,35,87,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lg-logo{width:68px;height:68px;border-radius:22px;background:linear-gradient(150deg,var(--navy-2),var(--navy));color:var(--gold);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 16px 30px -14px rgba(10,35,87,.9)}
.lg-logo svg.i{width:36px;height:36px}
.lg-card h2{text-align:center;font-size:23px;font-weight:900;color:var(--navy)}
.lg-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sky);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{height:40px;border-radius:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 4px 12px -6px rgba(10,35,87,.4)}
.seg button.on svg{color:var(--gold-ink)}
.lg-form{display:flex;flex-direction:column;gap:14px}
.lg-form .btn{height:50px;font-size:16px;border-radius:15px;margin-top:4px}
.lg-demo{margin-top:16px;background:var(--gold-bg);border:1px dashed #f0cf6a;border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--gold-ink);text-align:center;line-height:1.7}
.lg-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.lg-err{background:var(--red-bg);color:var(--red);border-radius:11px;padding:9px 12px;font-weight:700;font-size:13px;display:none}
.lg-err.show{display:block;animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}

/* ---------- Admin shell ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(185deg,#0d2a66 0%,var(--navy) 55%,#081c47 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;z-index:40}
.side::after{content:'';position:absolute;bottom:0;left:0;right:0;height:180px;background:radial-gradient(300px 140px at 30% 120%,rgba(247,193,45,.18),transparent 70%);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,var(--gold-2),var(--gold));color:var(--navy);display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(247,193,45,.65);flex-shrink:0}
.brand-mark svg.i{width:26px;height:26px}
.brand b{display:block;font-size:16.5px;font-weight:900;line-height:1.25}
.brand span{font-size:12px;color:#9fb3dd}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:14px;position:relative;z-index:1}
.nav-sec{font-size:11px;color:#7f93c1;font-weight:700;padding:12px 12px 4px;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:#c8d5f1;font-weight:700;font-size:14px;transition:background .2s,color .2s}
.nav a .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:.2s}
.nav a .ico svg.i{width:18px;height:18px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--navy);box-shadow:0 12px 24px -12px rgba(247,193,45,.8)}
.nav a.on .ico{background:rgba(10,35,87,.12)}
.nav .bdg{margin-inline-start:auto;background:var(--red);color:#fff;font-size:11px;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px;font-weight:800}
.side-foot{margin-top:auto;padding-top:16px;position:relative;z-index:1}
.side-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px}
.side-user b{font-size:13.5px;display:block;line-height:1.3}
.side-user span{font-size:11.5px;color:#9fb3dd}
.side-user .btn{color:#c8d5f1;margin-inline-start:auto}
.side-user .btn:hover{background:rgba(255,255,255,.1);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(238,243,250,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);min-height:68px}
.top h1{font-size:20px;font-weight:900;color:var(--navy);line-height:1.2}
.top .crumb{font-size:12px;color:var(--muted);font-weight:600}
.top-menu{display:none}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--green);background:var(--green-bg);height:30px;padding:0 12px;border-radius:20px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s infinite}
.live.off{color:var(--slate);background:var(--slate-bg)}
.live.off i{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,149,90,.55)}70%{box-shadow:0 0 0 8px rgba(20,149,90,0)}100%{box-shadow:0 0 0 0 rgba(20,149,90,0)}}
.clockchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;height:42px;padding:0 14px;font-weight:700;color:var(--ink-2);font-size:13px}
.clockchip b{color:var(--navy);font-size:15px;font-weight:900}
.bell{position:relative}
.bell .dot{position:absolute;top:4px;inset-inline-end:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.page{padding:24px 28px 48px;width:100%;max-width:1560px;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{display:none}
.scrim{display:none}

/* ---------- Cards & layout ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-h h3{font-size:16px;font-weight:900;color:var(--navy);line-height:1.3}
.card-h p{font-size:12.5px;color:var(--muted);line-height:1.3}
.card-h .act{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g-dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .tile{margin:0 auto 12px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.sec-title{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.sec-title h2{font-size:17px;font-weight:900;color:var(--navy)}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(115deg,var(--navy) 0%,#123a86 55%,#1d55c0 100%);color:#fff;padding:26px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 24px 50px -28px rgba(10,35,87,.9);margin-bottom:18px}
.hero::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;left:-120px;top:-210px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
.hero::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;left:24%;bottom:-170px;background:radial-gradient(circle,rgba(247,193,45,.25),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:15px;font-weight:700;color:#bcd0f5}
.hero h2{font-size:clamp(22px,2.4vw,30px);font-weight:900;line-height:1.25;display:inline-flex;flex-direction:column}
.hero h2 svg{width:170px;height:14px;margin-top:-2px}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.hero .meta span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);height:34px;padding:0 13px;border-radius:12px;font-weight:700;font-size:13px}
.hero .meta svg.i{width:16px;height:16px;color:var(--gold)}
.hero .bigclock{font-size:15px}
.hero .bigclock b{font-size:18px;font-weight:900;color:var(--gold)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring .v b{font-size:30px;font-weight:900}
.ring .v span{font-size:11.5px;color:#bcd0f5;font-weight:700}
.hero-ring{display:flex;align-items:center;gap:18px}
.hero-ring .legend{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.hero-ring .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;text-align:right}
.kpi:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px rgba(10,35,87,.35)}
.kpi::after{content:'';position:absolute;inset-inline-end:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.07}
.kpi .v{font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.kpi .l{font-size:13.5px;font-weight:800;color:var(--ink-2);line-height:1.2}
.kpi .s{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3;min-height:15px}
.feed{display:flex;flex-direction:column;max-height:560px;overflow:auto;margin:0 -6px;padding:0 6px}
.feed-it{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.feed-it:last-child{border:0}
.feed-it b{font-size:14px;display:block;line-height:1.3}
.feed-it .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feed-it .tm{margin-inline-start:auto;text-align:left;font-weight:900;color:var(--navy);font-size:14px;white-space:nowrap}
.feed-it .tm small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.feed-it.new{animation:flash 2s ease}
@keyframes flash{0%{background:var(--gold-bg)}100%{background:transparent}}
.mini-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.mini-it{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line-2)}
.mini-it:last-child{border:0}
.mini-it b{font-size:13.5px;line-height:1.3;display:block}
.mini-it span{font-size:12px;color:var(--muted)}
.mini-it .end{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.bars{width:100%;height:auto;display:block}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.dbar{display:flex;flex-direction:column;gap:12px}
.dbar .r{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.track{height:10px;border-radius:10px;background:var(--line-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ticker{direction:ltr;margin-top:18px;background:linear-gradient(90deg,var(--navy),#123a86);border-radius:18px;overflow:hidden;position:relative;height:50px;box-shadow:0 14px 30px -18px rgba(10,35,87,.8)}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2}
.ticker::before{right:0;background:linear-gradient(270deg,#0a2357,transparent)}
.ticker::after{left:0;background:linear-gradient(90deg,#123a86,transparent)}
.ticker-track{display:flex;gap:0;height:100%;align-items:center;width:max-content;animation:tick 45s linear infinite;direction:ltr}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-it{display:inline-flex;align-items:center;gap:8px;padding:0 26px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;direction:rtl;border-inline-start:1px solid rgba(255,255,255,.12)}
.ticker-it b{font-size:17px;color:var(--gold)}
.ticker-it .tri{font-size:11px}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--r);background:#fff;box-shadow:var(--sh);max-height:calc(100vh - 250px);min-height:120px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
.tbl th{position:sticky;top:0;z-index:2;background:#f5f8fd;color:var(--ink-2);font-weight:800;font-size:12.5px;text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap;font-size:13.5px}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover td{background:#f9fbff}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who b{display:block;font-size:13.5px;line-height:1.3}
.tbl .who span{font-size:11.5px;color:var(--muted)}
.tbl .tm{font-weight:800;color:var(--navy)}
.tbl .tm small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tbl tfoot td{position:sticky;bottom:0;background:#f5f8fd;font-weight:900;color:var(--navy);border-top:1px solid var(--line)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.pinbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;font-weight:800;font-size:12px}
.pinbtn svg.i{width:15px;height:15px}
.rate{display:flex;align-items:center;gap:8px;min-width:96px}
.rate .track{flex:1;height:8px}
.rate b{font-size:12.5px;min-width:36px;text-align:left}
.statusbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.statusbar::-webkit-scrollbar{display:none}
.sbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink-2);white-space:nowrap;transition:.15s}
.sbtn b{min-width:24px;height:22px;border-radius:8px;display:grid;place-items:center;padding:0 6px;font-size:12px;background:var(--line-2)}
.sbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sbtn.on b{background:var(--gold);color:var(--navy)}
.datenav{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px}
.datenav .inp{border:0;height:36px;width:150px;box-shadow:none;font-weight:800}
.datenav .lbl{font-weight:800;color:var(--navy);font-size:13px;padding:0 6px;white-space:nowrap}
.more-row{text-align:center;padding:14px}

/* ---------- Mobile attendance cards ---------- */
.acards{display:flex;flex-direction:column;gap:10px}
.acard{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;gap:10px}
.acard .hd{display:flex;align-items:center;gap:10px}
.acard .hd b{display:block;font-size:14.5px;line-height:1.3}
.acard .hd span{font-size:12px;color:var(--muted)}
.acard .tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acard .tl div{background:var(--sky-2);border-radius:12px;padding:7px 4px;text-align:center;line-height:1.35}
.acard .tl span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.acard .tl b{font-size:14px;font-weight:900;color:var(--navy)}
.acard .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acard .ft .flags{margin:0}

/* ---------- Entity cards ---------- */
.ecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ecard{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ecard:hover{transform:translateY(-2px);box-shadow:0 18px 36px -18px rgba(10,35,87,.35)}
.ecard .hd{display:flex;align-items:center;gap:12px}
.ecard .hd b{font-size:15.5px;display:block;line-height:1.3;color:var(--navy)}
.ecard .hd span{font-size:12.5px;color:var(--muted)}
.ecard .tags{display:flex;gap:6px;flex-wrap:wrap}
.ecard .ft{display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.ecard .ft .grow{font-size:12px;color:var(--muted)}
.ecard.off{opacity:.62}
.ecard .stripe{position:absolute;top:0;inset-inline-start:0;width:5px;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:700}
.shift-card .time{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;color:var(--navy)}
.shift-card .time small{font-size:12px;color:var(--muted);font-weight:700}
.map{width:100%;height:180px;border:0;border-radius:14px;background:var(--sky)}
.leave-card .period{font-weight:800;color:var(--ink-2);font-size:13.5px}
.leave-card .ft{flex-wrap:wrap}
.leave-card .ft .grow{flex-basis:100%;margin-bottom:2px}
.leave-card .reason{background:var(--sky-2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink-2)}

/* ---------- Roster ---------- */
.roster td{padding:8px 8px}
.roster th{text-align:center}
.roster th small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.roster th.hol{color:var(--teal)}
.rsel{appearance:none;-webkit-appearance:none;width:100%;min-width:104px;height:36px;border-radius:10px;border:1.5px solid transparent;font-weight:800;font-size:12.5px;text-align:center;text-align-last:center;cursor:pointer;padding:0 8px;position:relative}
.rsel.k-morning{background:var(--gold-bg);color:var(--gold-ink)}
.rsel.k-evening{background:var(--orange-bg);color:var(--orange)}
.rsel.k-night{background:var(--indigo-bg);color:var(--indigo)}
.rsel.k-rest{background:var(--slate-bg);color:var(--slate)}
.rsel.ov{border-color:var(--navy)}
.rcell{position:relative}
.rcell .dot{position:absolute;top:3px;inset-inline-end:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid #fff}

/* ---------- Modal & toast ---------- */
.ovl{position:fixed;inset:0;background:rgba(8,22,56,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:#fff;border-radius:26px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.modal.lg{max-width:780px}
.modal.sm{max-width:420px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}
.modal-h h3{font-size:18px;font-weight:900;color:var(--navy);line-height:1.3}
.modal-h p{font-size:12.5px;color:var(--muted)}
.modal-h .x{margin-inline-start:auto}
.modal-b{padding:4px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-f .sp{flex:1}
.toasts{position:fixed;top:18px;left:18px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(380px,calc(100vw - 36px))}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh-lg);font-weight:700;font-size:13.5px;pointer-events:auto;animation:tin .35s cubic-bezier(.2,.9,.3,1.2);border-inline-start:5px solid var(--green)}
.toast.err{border-color:var(--red)} .toast.info{border-color:var(--blue)} .toast.warn{border-color:var(--orange)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateX(-30px)}}
@keyframes tout{to{opacity:0;transform:translateX(-30px)}}
.cred{background:linear-gradient(135deg,var(--navy),#1a4aa8);color:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.cred span{display:block;font-size:12px;color:#bcd0f5;font-weight:700}
.cred b{font-size:26px;font-weight:900;color:var(--gold);letter-spacing:2px;direction:ltr;display:block}
.note{background:var(--sky-2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.note svg.i{color:var(--blue);margin-top:2px}
.note.warn{background:var(--orange-bg);border-color:#fbd9ae}
.note.warn svg.i{color:var(--orange)}
.note.gold{background:var(--gold-bg);border-color:#f3dd8f}
.note.gold svg.i{color:var(--gold-ink)}

/* ---------- Employee app ---------- */
.emp{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-b));position:relative}
.emp-top{background:linear-gradient(140deg,var(--navy) 0%,#163f92 70%,#1d55c0 100%);color:#fff;padding:calc(14px + var(--safe-t)) 18px 78px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.emp-top::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;bottom:-150px;background:radial-gradient(circle,rgba(247,193,45,.30),transparent 65%)}
.emp-bar{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.emp-bar h1{font-size:18px;font-weight:900;flex:1;text-align:center}
.emp-bar .btn{color:#fff;background:rgba(255,255,255,.1)}
.emp-hello{display:flex;align-items:center;gap:12px;margin-top:16px;position:relative;z-index:1}
.emp-hello b{font-size:18px;font-weight:900;display:block;line-height:1.3}
.emp-hello span{font-size:13px;color:#bcd0f5}
.emp-body{margin-top:-58px;padding:0 14px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
.clockcard{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:18px 18px 22px;text-align:center}
.clockcard .bigt{font-size:46px;font-weight:900;color:var(--navy);line-height:1.1;letter-spacing:-1px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.clockcard .bigt .ltr small{font-size:22px;color:var(--muted)}
.clockcard .bigt>small{font-size:20px;color:var(--gold-ink);font-weight:800}
.clockcard .dt{font-weight:700;color:var(--muted);font-size:14px;margin-top:2px}
.clockcard .shift{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:12px;font-weight:800;font-size:13px}
.punch-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
.punch{width:184px;height:184px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;font-size:18px;position:relative;transition:transform .15s}
.punch:active{transform:scale(.96)}
.punch svg.i{width:62px;height:62px;stroke-width:1.6}
.punch.in{background:radial-gradient(circle at 30% 25%,#3fd88a,#0f8a4f 70%);box-shadow:0 22px 40px -16px rgba(20,149,90,.85),inset 0 -10px 20px rgba(0,0,0,.12)}
.punch.out{background:radial-gradient(circle at 30% 25%,#ff7a87,#c9283a 70%);box-shadow:0 22px 40px -16px rgba(220,53,69,.85),inset 0 -10px 20px rgba(0,0,0,.12)}
.punch.done{background:radial-gradient(circle at 30% 25%,#5b7bc1,#0a2357 70%);box-shadow:0 22px 40px -16px rgba(10,35,87,.75)}
.punch::before,.punch::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid currentColor;opacity:0}
.punch.in::before,.punch.in::after{color:#18a058;animation:ring 2.2s infinite}
.punch.out::before,.punch.out::after{color:#dc3545;animation:ring 2.2s infinite}
.punch::after{animation-delay:1.1s!important}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.punch.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.locpill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;font-weight:700;font-size:13px;max-width:100%}
.locpill svg.i{width:17px;height:17px}
.locpill.ok{background:var(--green-bg);color:var(--green)}
.locpill.warn{background:var(--orange-bg);color:var(--orange)}
.locpill.err{background:var(--red-bg);color:var(--red)}
.locpill.wait{background:var(--sky);color:var(--navy-3)}
.workline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.workline div{background:var(--sky-2);border-radius:14px;padding:10px 6px}
.workline span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.workline b{font-size:16px;font-weight:900;color:var(--navy);display:block}
.ecard2{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.ecard2 h3{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mstats div{background:var(--sky-2);border-radius:14px;padding:10px 4px;text-align:center}
.mstats b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.mstats span{font-size:11.5px;color:var(--muted);font-weight:700}
.hist-it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.hist-it:last-child{border:0}
.hist-it .d{width:48px;height:52px;border-radius:14px;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1}
.hist-it .d b{font-size:18px;font-weight:900;color:var(--navy)}
.hist-it .d span{font-size:10.5px;color:var(--muted);font-weight:700}
.hist-it .t{flex:1;min-width:0}
.hist-it .t b{font-size:13.5px;font-weight:800}
.hist-it .t .sub{font-size:12px;color:var(--muted)}

const Sync = {
  es: null, last: 0, watch: null,
  connect() {
    this.close();
    if (!S.token || S.kind !== 'user' || !window.EventSource) return;
    this.es = new EventSource(BASE + '/api/events?token=' + encodeURIComponent(S.token));
    this.last = Date.now();
    const alive = () => { this.last = Date.now(); setLive(true); };
    this.es.addEventListener('hello', alive);
    this.es.addEventListener('ping', alive);
    this.es.addEventListener('change', e => { alive(); let d = {}; try { d = JSON.parse(e.data); } catch {} this.onChange(d); });
    this.es.onerror = () => setLive(false);
    this.watch = setInterval(() => { if (Date.now() - this.last > 50000) this.connect(); }, 15000);
  },
  close() { if (this.es) { this.es.close(); this.es = null; } clearInterval(this.watch); setLive(false); },
  onChange(d) {
    if (d.type === 'punch' && d.name) {

async function rosterHtml() {
  const from = S.f.rosterFrom = S.f.rosterFrom || weekStart(today());

  const shifts = S.boot.shifts;
  const sel = (r, c) => {
    const sh = c.shift_id ? byId(shifts, c.shift_id) : null; const kind = c.rest ? 'rest' : (sh ? sh.kind : 'rest');
    return `<td class="c rcell">${c.override ? '<span class="dot" title="معدّل يدويًا"></span>' : ''}<select class="rsel k-${kind} ${c.override ? 'ov' : ''}" data-roster="${r.emp_id}" data-date="${c.date}">
      ${shifts.map(s => `<option value="${s.id}" ${!c.rest && String(c.shift_id) === String(s.id) ? 'selected' : ''}>${esc(SK[s.kind] ? SK[s.kind].t : s.name)} ${t12(s.start_time).replace(/:00/, '')}</option>`).join('')}
      <option value="rest" ${c.rest ? 'selected' : ''}>راحة</option>${!c.rest && !c.shift_id ? '<option value="" selected>—</option>' : ''}${c.override ? '<option value="default">↺ الافتراضي</option>' : ''}</select></td>`;
  };

      <div class="datenav"><button class="btn btn-ghost btn-icon btn-sm" data-act="roster-week" data-n="-7">${ic('chevR')}</button><span class="lbl">${dShort(d.from)} — ${dShort(d.to)}</span><button class="btn btn-ghost btn-icon btn-sm" data-act="roster-week" data-n="7">${ic('chevL')}</button>${isThis ? '' : '<button class="btn btn-xs btn-gold" data-act="roster-week" data-n="0">الأسبوع ده</button>'}</div>
      <select class="inp inp-sm" style="width:auto;min-width:150px" data-f="rosterDept">${deptOptions(dept)}</select>
      <span class="sp"></span>
      <button class="btn btn-sm btn-soft" data-act="roster-copy" title="نسخ التعديلات للأسبوع اللي بعده">${ic('copyWeek')}<span class="btn-txt">نسخ للأسبوع الجاي</span></button>
      <div class="legend-row"><span><i style="background:var(--gold)"></i>صباحي</span><span><i style="background:var(--orange)"></i>مسائي</span><span><i style="background:var(--indigo)"></i>ليلي</span><span><i style="background:var(--slate)"></i>راحة</span></div>
    </div>
    ${d.rows.length ? `<div class="tbl-wrap"><table class="tbl roster" style="min-width:${220 + 7 * 120}px"><thead><tr><th style="text-align:right">الموظف</th>${d.days.map(x => `<th class="${x.holiday ? 'hol' : ''}">${DAYS[x.weekday]}<small>${dMini(x.date)}${x.holiday ? ' • ' + esc(x.holiday) : ''}</small></th>`).join('')}</tr></thead>
    <tbody>${d.rows.map(r => `<tr><td>${whoCell(r)}</td>${r.cells.map(c => sel(r, c)).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="note" style="margin-top:14px">${ic('info')}<div>اختار من أي خانة علشان تغير وردية الموظف في اليوم ده بس. الخانات اللي عليها <b style="color:var(--gold-ink)">نقطة صفرا</b> متعدلة يدويًا، وتقدر ترجعها للافتراضي.</div></div>`
    : `<div class="card empty"><b>مفيش موظفين</b></div>`}`;

function leaveForm(l = {}, admin = true) {

function bindLeaveForm(root) {
  const t = $('[data-ltype]', root);
  const upd = () => { const perm = PERMS.includes(t.value); $('[data-perm]', root).classList.toggle('hide', !perm); $('[data-full]', root).classList.toggle('hide', perm); $('[data-lbl-from]', root).textContent = perm ? 'التاريخ *' : 'من تاريخ *'; };
  t.onchange = upd; upd();
  const fd = $('[name=from_date]', root), td = $('[name=to_date]', root);
  fd.addEventListener('change', () => { if (td.value < fd.value) td.value = fd.value; });
}

  const l = id ? (S.cacheLeaves || []).find(x => x.id === id) || {} : {};

/* ---------- Ranges ---------- */
function quickRange(v) {
  const t = today(); const ms = t.slice(0, 8) + '01';
  if (v === 'today') return [t, t];
  if (v === 'yesterday') { const y = addDays(t, -1); return [y, y]; }
  if (v === 'week') return [weekStart(t), t];
  if (v === 'month') return [ms, t];
  if (v === 'lastmonth') { const le = addDays(ms, -1); return [le.slice(0, 8) + '01', le]; }
  if (v === '3months') return [addDays(t, -89), t];
  return [ms, t];
}

/* ------------------------------------------------------------ Clock --- */
function tickClock() {
  const p = nowParts();
  const t = t12(p.time, true);
  $$('[data-clock]').forEach(el => el.textContent = t12(p.time));
  $$('[data-clock-sec]').forEach(el => el.textContent = t);
  $$('[data-clock-date]').forEach(el => el.textContent = dShort(p.date));
  $$('[data-elapsed]').forEach(el => {
    const from = Date.parse(el.dataset.elapsed.replace(' ', 'T') + 'Z'); const s = Math.max(0, Math.floor((srvNow() - from) / 1000));
    el.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  });
  const big = $('[data-bigclock]');
  if (big) { const h = p.h % 12 || 12; big.innerHTML = `<span class="ltr">${pad(h)}:${pad(p.m)}<small>:${pad(p.s)}</small></span><small>${p.h < 12 ? 'صباحًا' : 'مساءً'}</small>`; }
}
setInterval(tickClock, 1000);

function getPos(timeout = 15000) {
  return new Promise((res, rej) => {
    if (!window.isSecureContext) return rej(new Error('تحديد الموقع محتاج رابط آمن (https). اطلب من الإدارة رابط البرنامج الصح'));
    if (!navigator.geolocation) return rej(new Error('الجهاز ده مش بيدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() }),
      e => rej(new Error(e.code === 1 ? 'لازم تسمح للبرنامج يستخدم الموقع (من إعدادات المتصفح ← الموقع ← سماح)' : e.code === 2 ? 'مش قادر أحدد موقعك.. شغّل الـ GPS وجرب تاني' : 'تحديد الموقع اتأخر.. جرب في مكان مفتوح')),
      { enableHighAccuracy: true, timeout, maximumAge: 5000 });
  });
}

function locState() {
  const h = S.home, l = S.loc;
  if (!l || l.busy) return { cls: 'wait', icon: 'locate', t: 'جاري تحديد موقعك...' };
  if (l.err) return { cls: h.settings.require_location === '1' ? 'err' : 'warn', icon: 'alert', t: l.err };
  const site = h.site;
  if (site && site.lat !== null) {
    const d = Math.round(haversine(l.lat, l.lng, site.lat, site.lng));
    if (d <= site.radius) return { cls: 'ok', icon: 'pin', t: `أنت داخل نطاق ${site.name} (${meters(d)})`, d };
    return { cls: h.settings.geofence_mode === 'block' ? 'err' : 'warn', icon: 'pin', t: `أنت بعيد عن ${site.name} بمسافة ${meters(d)}`, d, out: true };
  }
  return { cls: 'ok', icon: 'pin', t: `تم تحديد موقعك (دقة ${meters(l.acc)})` };
}
function updateLocPill() {
  const el = $('#locPill'); if (!el || !S.home) return;

    <div class="ecard2"><h3>${ic('clipboard')} طلباتي</h3>${h.leaves.length ? h.leaves.map(l => {
      const st = LST[l.status], perm = PERMS.includes(l.type);
      return `<div class="hist-it"><div class="tile sm ${perm ? 't-orange' : l.type === 'mission' ? 't-blue' : 't-purple'}">${ic(perm ? 'clock' : 'clipboard')}</div><div class="t"><b style="direction:rtl">${LT[l.type]}</b><div class="sub">${perm ? dShort(l.from_date) + ' • ' + t12(l.from_time) + ' - ' + t12(l.to_time) : (l.from_date === l.to_date ? dShort(l.from_date) : dShort(l.from_date) + ' ← ' + dShort(l.to_date))}</div>${l.reply ? `<div class="sub" style="color:var(--ink-2)">الرد: ${esc(l.reply)}</div>` : ''}</div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${chip(st.t, st.c)}${l.status === 'pending' ? `<button class="btn btn-xs btn-soft" style="color:var(--red)" data-eact="leave-cancel" data-id="${l.id}">إلغاء</button>` : ''}</div></div>`;
    }).join('') : '<div class="muted" style="text-align:center;padding:16px">مفيش طلبات لسه</div>'}</div></div>`;
}
function empProfileHtml() {
  const h = S.home, e = h.emp, site = h.site;
  return empHeader('حسابي') + `<div class="emp-body">
    <div class="ecard2"><h3>${ic('user')} بياناتي</h3><div class="kv" style="font-size:14px;gap:8px 14px"><span>الكود</span><b class="ltr" style="text-align:right">${esc(e.code)}</b><span>الوظيفة</span><b>${esc(e.job || '—')}</b><span>القسم</span><b>${esc(e.dept || '—')}</b>
      <span>الوردية</span><b>${h.today.shift_name ? esc(h.today.shift_name) : '—'}</b><span>أيام الراحة</span><b>${restText(e.rest_days)}</b><span>موقع العمل</span><b>${site ? esc(site.name) : 'أي مكان'}</b><span>الشركة</span><b>${esc(h.settings.company_name)}</b></div></div>
    <div class="ecard2"><h3>${ic('key')} تغيير الرقم السري</h3><div class="stack" style="gap:10px" id="pinForm"><input class="inp" type="password" inputmode="numeric" name="old" placeholder="الرقم السري الحالي"><input class="inp" type="password" inputmode="numeric" name="new" placeholder="الرقم السري الجديد (4-8 أرقام)"><button class="btn btn-soft" data-eact="pin">${ic('check')} تغيير</button></div></div>
    <div class="ecard2"><div class="note">${ic('phone')}<div>علشان تفتح البرنامج بسرعة: من قائمة المتصفح اختار <b>"إضافة إلى الشاشة الرئيسية"</b>.</div></div></div>
    <button class="btn btn-red" style="height:50px" data-eact="logout">${ic('logout')} تسجيل خروج</button></div>`;
}
async function doPunch(btn) {
  const h = S.home, type = btn.dataset.type, req = h.settings.require_location === '1';
  btn.classList.add('busy'); btn.disabled = true;
  try {
    let loc = S.loc && !S.loc.err && !S.loc.busy && Date.now() - S.loc.at < 30000 ? S.loc : null;
    if (!loc) { try { S.loc = { busy: true }; updateLocPill(); loc = await getPos(); S.loc = loc; } catch (e) { S.loc = { err: e.message, at: Date.now() }; if (req) throw e; loc = null; } updateLocPill(); }
    const ls = loc ? locState() : null;
    if (ls && ls.out && h.settings.geofence_mode === 'warn') {
      if (!await confirmBox(`أنت بعيد عن <b>${esc(h.site.name)}</b> بمسافة <b>${meters(ls.d)}</b>.<br>التسجيل هيتم بس هيظهر للإدارة إنه <b>خارج النطاق</b>. تكمل؟`, { ok: 'سجّل', icon: 'pin' })) return;
    }
    const r = await api('/api/my/punch', { type, lat: loc ? loc.lat : null, lng: loc ? loc.lng : null, acc: loc ? loc.acc : null, device: deviceId() });
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    successSheet(r, loc);
    loadHome(true);
  } catch (e) {
    modal({ title: 'مقدرتش أسجل', icon: 'alert', tile: 't-red', size: 'sm', body: `<p style="font-size:15px;font-weight:700;line-height:1.8">${esc(e.message)}</p>`, foot: `<button class="btn btn-primary" data-close style="flex:1">تمام</button>` });
  } finally { if (btn.isConnected) { btn.classList.remove('busy'); btn.disabled = false; } }
}
function successSheet(r, loc) {
  const isIn = r.type === 'in', rec = r.record, ts = isIn ? rec.in_at : rec.out_at;
  const out = r.site && r.dist !== null && r.dist > r.site.radius;
  const m = modal({
    title: isIn ? 'حضور' : 'انصراف', icon: null, size: 'sm',
    body: `<div class="success-head"><div class="ck ${isIn ? '' : 'out'}">${ic('check')}</div><h3 class="${isIn ? '' : 'out'}">${isIn ? 'تم تسجيل الحضور بنجاح' : 'تم تسجيل الانصراف بنجاح'}</h3>${!isIn && rec.in_at ? `<p class="muted" style="font-weight:700">مدة العمل: ${dur((Date.parse(rec.out_at.replace(' ', 'T')) - Date.parse(rec.in_at.replace(' ', 'T'))) / 60000)}</p>` : ''}</div>
      <div class="srows"><div class="srow">${ic('cal')}<span>التاريخ</span><b><span class="ltr">${ts.slice(0, 10)}</span><br><small class="muted">${DAYS[weekday(ts.slice(0, 10))]}</small></b></div>
        <div class="srow">${ic('clock')}<span>الوقت</span><b>${t12(ts, true)}</b></div>
        <div class="srow">${ic('pin')}<span>الموقع</span><b id="sAddr">${loc ? `<span class="muted">جاري تحديد العنوان...</span>` : '<span class="muted">بدون موقع</span>'}</b></div>
        ${r.site && r.dist !== null ? `<div class="srow">${ic('locate')}<span>النطاق</span><b>${chip((out ? 'خارج النطاق • ' : 'داخل النطاق • ') + meters(r.dist), out ? 'orange' : 'green')}</b></div>` : ''}</div>
      ${loc ? mapFrame(loc.lat, loc.lng, 170, 0.003) : ''}`,
    foot: `<button class="btn ${isIn ? 'btn-green' : 'btn-primary'}" data-close style="flex:1;height:48px">${ic('check')} تمام</button>`,
  });
  if (loc) {
    const fallback = `<span class="ltr">${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</span>`;
    let tries = 0;
    const poll = async () => {
      if (!m.el.isConnected) return;
      try { const a = await api('/api/my/address?id=' + rec.id); const addr = isIn ? a.in_addr : a.out_addr; if (addr) { $('#sAddr').textContent = addr; return; } } catch {}
      if (++tries < 4) setTimeout(poll, 1800); else { const el = $('#sAddr'); if (el) el.innerHTML = fallback; }
    };
    setTimeout(poll, 1500);
  }
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-etab]');
  if (t && S.kind === 'emp') { e.preventDefault(); S.etab = t.dataset.etab; renderEmp(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-eact]'); if (!a || S.kind !== 'emp') return;
  const k = a.dataset.eact;
  if (k === 'punch') doPunch(a);
  if (k === 'locate') locate();
  if (k === 'refresh') { a.querySelector('svg').classList.add('spin'); await loadHome(true); locate(); }
  if (k === 'logout') { if (await confirmBox('عايز تسجل خروج؟', { ok: 'خروج', icon: 'logout' })) logout(); }
  if (k === 'pin') busy(a, async () => { const v = formVals($('#pinForm')); await api('/api/my/pin', v); $$('#pinForm input').forEach(i => i.value = ''); toast('تم تغيير الرقم السري'); });
  if (k === 'leave-send') busy(a, async () => { const v = formVals($('#lvForm')); await api('/api/my/leave', v); toast('تم إرسال الطلب للإدارة'); await loadHome(true); });
  if (k === 'leave-cancel') { if (!await confirmBox('إلغاء الطلب ده؟', { ok: 'إلغاء الطلب', danger: true })) return; busy(null, async () => { await api('/api/my/leave/cancel', { id: +a.dataset.id }); toast('تم إلغاء الطلب'); await loadHome(true); }); }
});
setInterval(() => { if (S.kind === 'emp' && S.etab === 'home' && document.visibilityState === 'visible' && !modals.length) loadHome(true); }, 90000);

/* ------------------------------------------------------------ Boot --- */
function start() {
  if (!S.token) return renderLogin();
  if (S.kind === 'emp') return startEmp();
  return startAdmin();
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
start();
</script>
</body>
</html>
