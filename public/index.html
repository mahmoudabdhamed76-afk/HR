<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('em_att_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* iPhone: stop Safari from zooming the page when a field is focused (pinch-zoom still works on iOS) */
if(/iPhone|iPad|iPod/.test(navigator.userAgent)){var vp=document.querySelector('meta[name=viewport]');if(vp)vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover')}</script>
<meta name="theme-color" content="#0a2357">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>إدارة الحضور والانصراف — EmdadX</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a2357; --navy-2:#11337a; --navy-3:#1b4aa6; --blue:#2563d9; --sky:#eaf1fc; --sky-2:#f5f8fe;
  --gold:#f7c12d; --gold-2:#ffd75e; --gold-bg:#fff6d9; --gold-ink:#7a5600;
  --ink:#0d1b3a; --ink-2:#33415c; --muted:#6b7a99; --line:#e2e9f4; --line-2:#eef2f8; --bg:#eef3fa; --card:#fff;
  --green:#14955a; --green-bg:#e5f6ed; --red:#dc3545; --red-bg:#fdecee; --orange:#e67e0d; --orange-bg:#fff1e0;
  --purple:#6c4ee6; --purple-bg:#efebfe; --teal:#0d9488; --teal-bg:#e0f5f3; --slate:#6f7d99; --slate-bg:#eef1f6;
  --indigo:#4352d8; --indigo-bg:#ebedfd; --blue-bg:#e8f0fd;
  --r:20px; --r-sm:13px;
  --sh:0 1px 2px rgba(10,35,87,.05),0 10px 28px -14px rgba(10,35,87,.20);
  --sh-lg:0 30px 70px -24px rgba(10,35,87,.45);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --heading:#0a2357; --title-2:#1b4aa6; --input:#fff; --th:#f5f8fd; --hover:#f9fbff; --glass:rgba(238,243,250,.86);
  --login-bg:linear-gradient(160deg,#f7faff 0%,#eaf1fb 100%); --primary:#0a2357; --primary-b:#0a2357;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html{color-scheme:light}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0a1120; --card:#111b31; --input:#0d1629; --sky:#182648; --sky-2:#14203c; --line:#25365e; --line-2:#1b2948;
  --ink:#e6ecfa; --ink-2:#c2cde6; --muted:#8b9abd; --heading:#eef3ff; --title-2:#8fb4ff; --th:#15213d; --hover:#15223f;
  --glass:rgba(10,17,32,.86); --login-bg:linear-gradient(160deg,#0c1630 0%,#0a1120 100%); --primary:#2c56a8; --primary-b:#5b8cf0;
  --green:#3ccf86; --green-bg:rgba(60,207,134,.14); --red:#ff6b7a; --red-bg:rgba(255,107,122,.14); --orange:#ffa940; --orange-bg:rgba(255,169,64,.14);
  --purple:#a78bfa; --purple-bg:rgba(167,139,250,.15); --teal:#2dd4bf; --teal-bg:rgba(45,212,191,.13); --slate:#9aa8c7; --slate-bg:rgba(154,168,199,.13);
  --indigo:#8b97ff; --indigo-bg:rgba(139,151,255,.15); --blue:#6ea2ff; --blue-bg:rgba(110,162,255,.14); --gold-bg:rgba(247,193,45,.13); --gold-ink:#f7c94a;
  --sh:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.75); --sh-lg:0 30px 70px -24px rgba(0,0,0,.85);
}
[data-theme=dark] .side{background:linear-gradient(185deg,#0d2152 0%,#0a183b 55%,#071130 100%);border-inline-start:1px solid #1b2948}
[data-theme=dark] .btn-primary{background:linear-gradient(135deg,#3a6fd0,#1f4594)}
[data-theme=dark] .btn-xls{background:rgba(60,207,134,.12);color:#5be0a0;border-color:rgba(60,207,134,.3)}
[data-theme=dark] .btn-pdf{background:rgba(255,107,122,.12);color:#ff8a96;border-color:rgba(255,107,122,.3)}
[data-theme=dark] .btn-print{background:rgba(110,162,255,.12);color:#8fb8ff;border-color:rgba(110,162,255,.3)}
[data-theme=dark] .note.warn{border-color:rgba(255,169,64,.3)}
[data-theme=dark] .note.gold{border-color:rgba(247,193,45,.3)}
[data-theme=dark] .lg-wave path:first-child{fill:#12306f}
[data-theme=dark] .seg button.on{background:#1c2b52}
[data-theme=dark] .hero{background:linear-gradient(115deg,#0f2b66 0%,#143a86 55%,#1d55c0 100%)}
[data-theme=dark] .map{filter:brightness(.85) contrast(1.05)}
[data-theme=dark] .tile{box-shadow:inset 0 -5px 10px rgba(0,0,0,.15)}
[data-theme=dark] input[type=date].inp::-webkit-calendar-picker-indicator,[data-theme=dark] input[type=time].inp::-webkit-calendar-picker-indicator{filter:invert(.85)}
body,.card,.kpi,.ecard,.modal,.inp,.btn-soft,.sbtn,.datenav,.clockchip,.etabs,.bnav,.clockcard,.ecard2,.acard{transition:background-color .3s,border-color .3s,color .3s}
.theme-btn svg.i{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.theme-btn:active svg.i{transform:rotate(90deg)}
.btn.theme-fab{position:fixed;top:16px;left:16px;z-index:60;box-shadow:var(--sh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img,iframe{display:block}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
::selection{background:var(--gold-2);color:#0a2357}
:focus-visible{outline:3px solid rgba(247,193,45,.65);outline-offset:2px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s;position:relative;overflow:hidden;user-select:none}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--navy-2),var(--navy));color:#fff;box-shadow:0 10px 22px -12px rgba(10,35,87,.8)}
.btn-primary:hover{box-shadow:0 14px 26px -12px rgba(10,35,87,.9)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0a2357;box-shadow:0 10px 22px -12px rgba(230,170,10,.9)}
.btn-green{background:linear-gradient(135deg,#25b56d,var(--green));color:#fff}
.btn-red{background:linear-gradient(135deg,#f0566a,var(--red));color:#fff}
.btn-soft{background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:0 1px 2px rgba(10,35,87,.05)}
.btn-soft:hover{border-color:var(--line);background:var(--sky-2)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{background:rgba(10,35,87,.05)}
.btn-sm{height:34px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-xs{height:28px;padding:0 10px;border-radius:9px;font-size:12px}
.btn-icon{width:40px;padding:0}
.btn-sm.btn-icon{width:34px}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-xls{background:#e7f6ee;color:#0f7a43;border:1px solid #c5ead6}
.btn-pdf{background:#fdecee;color:#c22c3b;border:1px solid #f7cdd2}
.btn-print{background:#e8f0fd;color:#1d4fb0;border:1px solid #cddcf8}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field small{color:var(--muted);font-size:11.5px}
.inp,select.inp,textarea.inp{width:100%;height:44px;border:1.5px solid var(--line);background:var(--input);border-radius:12px;padding:0 13px;outline:none;transition:border .2s,box-shadow .2s;font-size:14px}
textarea.inp{height:auto;min-height:84px;padding:10px 13px;resize:vertical}
.inp:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(27,74,166,.12)}
.inp-sm{height:38px;border-radius:10px;font-size:13.5px}
.inp-ico{position:relative}
.inp-ico svg.i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.inp-ico .inp{padding-inline-start:40px}
input[type=date].inp,input[type=time].inp{direction:ltr;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tr{width:46px;height:26px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.switch .tr::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+.tr{background:var(--green)}
.switch input:checked+.tr::after{inset-inline-start:23px}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{cursor:pointer}
.daypick input{display:none}
.daypick span{display:inline-flex;height:34px;padding:0 12px;align-items:center;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;color:var(--ink-2);background:var(--input);transition:.15s}
.daypick input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.optcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.optcards label{cursor:pointer}
.optcards input{display:none}
.optcards .oc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:center;font-weight:700;font-size:13px;transition:.15s;height:100%}
.optcards .oc small{font-weight:500;color:var(--muted);font-size:11.5px;line-height:1.4}
.optcards input:checked+.oc{border-color:var(--primary-b);background:var(--sky-2);box-shadow:0 0 0 3px rgba(10,35,87,.08)}

/* ---------- chips & tiles ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap;line-height:1}
.chip svg.i{width:14px;height:14px}
.c-green{background:var(--green-bg);color:var(--green)}
.c-red{background:var(--red-bg);color:var(--red)}
.c-orange{background:var(--orange-bg);color:var(--orange)}
.c-purple{background:var(--purple-bg);color:var(--purple)}
.c-teal{background:var(--teal-bg);color:var(--teal)}
.c-slate{background:var(--slate-bg);color:var(--slate)}
.c-blue{background:var(--blue-bg);color:var(--blue)}
.c-indigo{background:var(--indigo-bg);color:var(--indigo)}
.c-gold{background:var(--gold-bg);color:var(--gold-ink)}
.c-navy{background:var(--primary);color:#fff}
.flag{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.flag.red{color:var(--red)} .flag.orange{color:var(--orange)} .flag.slate{color:var(--slate)} .flag.blue{color:var(--blue)} .flag.green{color:var(--green)} .flag.purple{color:var(--purple)}
.tile{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:inset 0 -5px 10px rgba(0,0,0,.10),0 10px 18px -10px var(--c,#0a2357)}
.tile svg.i{width:24px;height:24px}
.tile.sm{width:40px;height:40px;border-radius:13px}
.tile.sm svg.i{width:20px;height:20px}
.tile.xs{width:32px;height:32px;border-radius:10px}
.tile.xs svg.i{width:17px;height:17px}
.t-blue{--c:#2563d9;background:linear-gradient(155deg,#5a95f5,#1d55c9)}
.t-green{--c:#14955a;background:linear-gradient(155deg,#3fcf86,#10874f)}
.t-orange{--c:#e67e0d;background:linear-gradient(155deg,#ffb54f,#ea760a)}
.t-red{--c:#dc3545;background:linear-gradient(155deg,#ff6f7d,#d22a3b)}
.t-purple{--c:#6c4ee6;background:linear-gradient(155deg,#a08bff,#5e3fe0)}
.t-teal{--c:#0d9488;background:linear-gradient(155deg,#3ccfc2,#0b877c)}
.t-slate{--c:#6f7d99;background:linear-gradient(155deg,#aab5ca,#6d7a96)}
.t-navy{--c:#0a2357;background:linear-gradient(155deg,#2c56a8,#0a2357)}
.t-indigo{--c:#4352d8;background:linear-gradient(155deg,#7c88f4,#3a47cc)}
.t-gold{--c:#f2b40c;background:linear-gradient(155deg,#ffdc6e,#f2b40c);color:#0a2357}
.t-pink{--c:#e0457b;background:linear-gradient(155deg,#ff7aa5,#d93a70)}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;letter-spacing:-.5px}
.av.lg{width:58px;height:58px;border-radius:18px;font-size:20px}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:12px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;background:var(--login-bg);position:relative;overflow:hidden}
.lg-hero{position:relative;padding:48px 56px 140px;display:flex;flex-direction:column;justify-content:center;gap:22px;z-index:1}
.lg-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 300px at 80% 10%,rgba(37,99,217,.10),transparent 70%),radial-gradient(500px 300px at 10% 60%,rgba(247,193,45,.12),transparent 70%);z-index:-1}
.lg-kicker{font-weight:800;color:var(--heading);font-size:20px;display:inline-flex;flex-direction:column;align-self:flex-start;transform:rotate(-3deg)}
.lg-kicker svg{width:150px;height:14px;margin-top:-2px}
.lg-title{font-size:clamp(34px,4.4vw,60px);font-weight:900;line-height:1.15;color:var(--heading);letter-spacing:-1px}
.lg-title em{font-style:normal;display:block;background:linear-gradient(90deg,var(--heading),var(--title-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-pill{align-self:flex-start;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0a2357;font-weight:900;font-size:clamp(16px,1.8vw,24px);padding:8px 26px;border-radius:16px;box-shadow:0 14px 30px -14px rgba(230,170,10,.9);position:relative}
.lg-pill::before,.lg-pill::after{content:'';position:absolute;top:50%;width:16px;height:3px;background:var(--heading);border-radius:2px}
.lg-pill::before{right:-26px;transform:rotate(-30deg)} .lg-pill::after{left:-26px;transform:rotate(30deg)}
.lg-tag{font-size:17px;font-weight:700;color:var(--ink-2)}
.lg-feats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px 8px}
.lg-feats>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;border-inline-start:1px solid var(--line-2)}
.lg-feats>div:first-child{border:0}
.lg-feats .fi{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.lg-feats b{font-size:14px;color:var(--heading);line-height:1.3}
.lg-feats span{font-size:12px;color:var(--muted);line-height:1.3}
.lg-more{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:28px 16px 16px;position:relative}
.lg-more h4{position:absolute;top:-17px;right:50%;transform:translateX(50%);background:var(--primary);color:#fff;font-weight:800;padding:4px 26px;border-radius:12px;font-size:15px;white-space:nowrap}
.lg-more .g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px}
.lg-more .g div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.lg-more .g b{font-size:12.5px;color:var(--heading);line-height:1.25}
.lg-more .g span{font-size:11px;color:var(--muted);line-height:1.2;margin-top:-4px}
.lg-wave{position:absolute;bottom:0;left:0;width:min(560px,46vw);z-index:0;pointer-events:none}
.lg-wave-txt{position:absolute;bottom:34px;left:44px;color:#fff;font-weight:900;font-size:30px;line-height:1.15;transform:rotate(-6deg);z-index:2;pointer-events:none}
.lg-wave-txt small{display:block;font-size:20px;font-weight:700;opacity:.9}
.lg-wave-txt b{color:var(--gold)}
.lg-side{display:flex;align-items:center;justify-content:center;padding:32px;z-index:2}
.login.solo{grid-template-columns:1fr;place-items:center;min-height:100vh;min-height:100dvh;background:radial-gradient(700px 380px at 85% 0%,rgba(37,99,217,.13),transparent 70%),radial-gradient(600px 360px at 5% 100%,rgba(247,193,45,.16),transparent 70%),var(--login-bg)}
.login.solo .lg-side{width:100%;padding:70px 16px calc(30px + var(--safe-b))}
.lg-card{width:100%;max-width:420px;background:var(--card);border-radius:28px;box-shadow:var(--sh-lg);padding:32px 30px 26px;position:relative}
.lg-card::before{content:'';position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(160deg,rgba(247,193,45,.8),transparent 40%,transparent 60%,rgba(10,35,87,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lg-logo{width:68px;height:68px;border-radius:22px;background:linear-gradient(150deg,var(--navy-2),var(--navy));color:var(--gold);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 16px 30px -14px rgba(10,35,87,.9)}
.lg-logo svg.i{width:36px;height:36px}
.lg-card h2{text-align:center;font-size:23px;font-weight:900;color:var(--heading)}
.lg-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sky);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{height:40px;border-radius:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.seg button.on{background:var(--card);color:var(--heading);box-shadow:0 4px 12px -6px rgba(10,35,87,.4)}
.seg button.on svg{color:var(--gold-ink)}
.lg-form{display:flex;flex-direction:column;gap:14px}
.lg-form .btn{height:50px;font-size:16px;border-radius:15px;margin-top:4px}
.lg-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.lg-err{background:var(--red-bg);color:var(--red);border-radius:11px;padding:9px 12px;font-weight:700;font-size:13px;display:none}
.lg-err.show{display:block;animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}

/* ---------- Admin shell ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(185deg,#0d2a66 0%,var(--navy) 55%,#081c47 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;z-index:40}
.side::after{content:'';position:absolute;bottom:0;left:0;right:0;height:180px;background:radial-gradient(300px 140px at 30% 120%,rgba(247,193,45,.18),transparent 70%);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,var(--gold-2),var(--gold));color:#0a2357;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(247,193,45,.65);flex-shrink:0}
.brand-mark svg.i{width:26px;height:26px}
.brand b{display:block;font-size:16.5px;font-weight:900;line-height:1.25}
.brand span{font-size:12px;color:#9fb3dd}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:14px;position:relative;z-index:1}
.nav-sec{font-size:11px;color:#7f93c1;font-weight:700;padding:12px 12px 4px;letter-spacing:.3px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:#c8d5f1;font-weight:700;font-size:14px;transition:background .2s,color .2s}
.nav a .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:.2s}
.nav a .ico svg.i{width:18px;height:18px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0a2357;box-shadow:0 12px 24px -12px rgba(247,193,45,.8)}
.nav a.on .ico{background:rgba(10,35,87,.12)}
.nav .bdg{margin-inline-start:auto;background:var(--red);color:#fff;font-size:11px;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px;font-weight:800}
.side-foot{margin-top:auto;padding-top:16px;position:relative;z-index:1}
.side-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px}
.side-user b{font-size:13.5px;display:block;line-height:1.3}
.side-user span{font-size:11.5px;color:#9fb3dd}
.side-user .btn{color:#c8d5f1;margin-inline-start:auto}
.side-user .btn:hover{background:rgba(255,255,255,.1);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);min-height:68px}
.top h1{font-size:20px;font-weight:900;color:var(--heading);line-height:1.2}
.top .crumb{font-size:12px;color:var(--muted);font-weight:600}
.top-menu{display:none}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--green);background:var(--green-bg);height:30px;padding:0 12px;border-radius:20px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s infinite}
.live.off{color:var(--slate);background:var(--slate-bg)}
.live.off i{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,149,90,.55)}70%{box-shadow:0 0 0 8px rgba(20,149,90,0)}100%{box-shadow:0 0 0 0 rgba(20,149,90,0)}}
.clockchip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;height:42px;padding:0 14px;font-weight:700;color:var(--ink-2);font-size:13px}
.clockchip b{color:var(--heading);font-size:15px;font-weight:900}
.bell{position:relative}
.bell .dot{position:absolute;top:4px;inset-inline-end:4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.page{padding:24px 28px 48px;width:100%;max-width:1560px;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{display:none}
.scrim{display:none}

/* ---------- Cards & layout ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-h h3{font-size:16px;font-weight:900;color:var(--heading);line-height:1.3}
.card-h p{font-size:12.5px;color:var(--muted);line-height:1.3}
.card-h .act{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g-dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .tile{margin:0 auto 12px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.sec-title{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.sec-title h2{font-size:17px;font-weight:900;color:var(--heading)}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(115deg,var(--navy) 0%,#123a86 55%,#1d55c0 100%);color:#fff;padding:26px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 24px 50px -28px rgba(10,35,87,.9);margin-bottom:18px}
.hero::before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;left:-120px;top:-210px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%)}
.hero::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;left:24%;bottom:-170px;background:radial-gradient(circle,rgba(247,193,45,.25),transparent 65%)}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:15px;font-weight:700;color:#bcd0f5}
.hero h2{font-size:clamp(22px,2.4vw,30px);font-weight:900;line-height:1.25;display:inline-flex;flex-direction:column}
.hero h2 svg{width:170px;height:14px;margin-top:-2px}
.hero .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.hero .meta span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);height:34px;padding:0 13px;border-radius:12px;font-weight:700;font-size:13px}
.hero .meta svg.i{width:16px;height:16px;color:var(--gold)}
.hero .bigclock{font-size:15px}
.hero .bigclock b{font-size:18px;font-weight:900;color:var(--gold)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring .v b{font-size:30px;font-weight:900}
.ring .v span{font-size:11.5px;color:#bcd0f5;font-weight:700}
.hero-ring{display:flex;align-items:center;gap:18px}
.hero-ring .legend{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.hero-ring .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;text-align:right}
.kpi:hover{transform:translateY(-3px);box-shadow:0 18px 36px -18px rgba(10,35,87,.35)}
.kpi::after{content:'';position:absolute;inset-inline-end:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.07}
.kpi .v{font-size:30px;font-weight:900;color:var(--heading);line-height:1}
.kpi .l{font-size:13.5px;font-weight:800;color:var(--ink-2);line-height:1.2}
.kpi .s{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3;min-height:15px}
.feed{display:flex;flex-direction:column;max-height:560px;overflow:auto;margin:0 -6px;padding:0 6px}
.feed-it{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.feed-it:last-child{border:0}
.feed-it b{font-size:14px;display:block;line-height:1.3}
.feed-it .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feed-it .tm{margin-inline-start:auto;text-align:left;font-weight:900;color:var(--heading);font-size:14px;white-space:nowrap}
.feed-it .tm small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.feed-it.new{animation:flash 2s ease}
@keyframes flash{0%{background:var(--gold-bg)}100%{background:transparent}}
.mini-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.mini-it{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line-2)}
.mini-it:last-child{border:0}
.mini-it b{font-size:13.5px;line-height:1.3;display:block}
.mini-it span{font-size:12px;color:var(--muted)}
.mini-it .end{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.bars{width:100%;height:auto;display:block}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink-2)}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.dbar{display:flex;flex-direction:column;gap:12px}
.dbar .r{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.track{height:10px;border-radius:10px;background:var(--line-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ticker{direction:ltr;margin-top:18px;background:linear-gradient(90deg,var(--navy),#123a86);border-radius:18px;overflow:hidden;position:relative;height:50px;box-shadow:0 14px 30px -18px rgba(10,35,87,.8)}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2}
.ticker::before{right:0;background:linear-gradient(270deg,#0a2357,transparent)}
.ticker::after{left:0;background:linear-gradient(90deg,#123a86,transparent)}
.ticker-track{display:flex;gap:0;height:100%;align-items:center;width:max-content;animation:tick 45s linear infinite;direction:ltr}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-it{display:inline-flex;align-items:center;gap:8px;padding:0 26px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;direction:rtl;border-inline-start:1px solid rgba(255,255,255,.12)}
.ticker-it b{font-size:17px;color:var(--gold)}
.ticker-it .tri{font-size:11px}
@keyframes tick{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--r);background:var(--card);box-shadow:var(--sh);max-height:calc(100vh - 250px);min-height:120px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--th);color:var(--ink-2);font-weight:800;font-size:12.5px;text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap;font-size:13.5px}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl td.c,.tbl th.c{text-align:center}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who b{display:block;font-size:13.5px;line-height:1.3}
.tbl .who span{font-size:11.5px;color:var(--muted)}
.tbl .tm{font-weight:800;color:var(--heading)}
.tbl .tm small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tbl tfoot td{position:sticky;bottom:0;background:var(--th);font-weight:900;color:var(--heading);border-top:1px solid var(--line)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.pinbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;font-weight:800;font-size:12px}
.pinbtn svg.i{width:15px;height:15px}
.rate{display:flex;align-items:center;gap:8px;min-width:96px}
.rate .track{flex:1;height:8px}
.rate b{font-size:12.5px;min-width:36px;text-align:left}
.statusbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.statusbar::-webkit-scrollbar{display:none}
.sbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink-2);white-space:nowrap;transition:.15s}
.sbtn b{min-width:24px;height:22px;border-radius:8px;display:grid;place-items:center;padding:0 6px;font-size:12px;background:var(--line-2)}
.sbtn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sbtn.on b{background:var(--gold);color:#0a2357}
.datenav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.datenav .inp{border:0;height:36px;width:150px;box-shadow:none;font-weight:800}
.datenav .lbl{font-weight:800;color:var(--heading);font-size:13px;padding:0 6px;white-space:nowrap}
.more-row{text-align:center;padding:14px}

/* ---------- Mobile attendance cards ---------- */
.acards{display:flex;flex-direction:column;gap:10px}
.acard{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;gap:10px}
.acard .hd{display:flex;align-items:center;gap:10px}
.acard .hd b{display:block;font-size:14.5px;line-height:1.3}
.acard .hd span{font-size:12px;color:var(--muted)}
.acard .tl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acard .tl div{background:var(--sky-2);border-radius:12px;padding:7px 4px;text-align:center;line-height:1.35}
.acard .tl span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.acard .tl b{font-size:14px;font-weight:900;color:var(--heading)}
.acard .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acard .ft .flags{margin:0}

/* ---------- Entity cards ---------- */
.ecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.ecard{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.ecard:hover{transform:translateY(-2px);box-shadow:0 18px 36px -18px rgba(10,35,87,.35)}
.ecard .hd{display:flex;align-items:center;gap:12px}
.ecard .hd b{font-size:15.5px;display:block;line-height:1.3;color:var(--heading)}
.ecard .hd span{font-size:12.5px;color:var(--muted)}
.ecard .tags{display:flex;gap:6px;flex-wrap:wrap}
.ecard .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.ecard .ft .grow{font-size:12px;color:var(--muted)}
.ecard.off{opacity:.62}
.ecard .stripe{position:absolute;top:0;inset-inline-start:0;width:5px;height:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:700}
.shift-card .time{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;color:var(--heading)}
.shift-card .time small{font-size:12px;color:var(--muted);font-weight:700}
.map{width:100%;height:180px;border:0;border-radius:14px;background:var(--sky)}
.leave-card .period{font-weight:800;color:var(--ink-2);font-size:13.5px}
.leave-card .ft{flex-wrap:wrap}
.leave-card .ft .grow{flex-basis:100%;margin-bottom:2px}
.leave-card .reason{background:var(--sky-2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink-2)}

/* ---------- Visits ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.vcard{background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.vcard:hover{transform:translateY(-2px);box-shadow:0 18px 36px -18px rgba(10,35,87,.4)}
.vthumb{position:relative;display:block;width:100%;aspect-ratio:16/10;background:var(--sky);overflow:hidden}
.vthumb .vimg{width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block}
.vcard:hover .vthumb .vimg{transform:scale(1.05)}
.vthumb .noimg{width:100%;height:100%}
.vthumb .vtag{position:absolute;top:10px;inset-inline-start:10px}
.vthumb .vtag .chip{box-shadow:0 4px 12px rgba(0,0,0,.25);background:var(--card)}
.vthumb .vrv{position:absolute;top:10px;inset-inline-end:10px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.vthumb .vrv svg.i{width:18px;height:18px}
.vthumb .vtime{position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(5,15,40,.65);color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:10px;backdrop-filter:blur(4px)}
.vbody{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}
.vbody .ttl{display:flex;align-items:center;gap:10px}
.vbody .ttl b{display:block;font-size:15.5px;color:var(--heading);line-height:1.3}
.vbody .ttl span{font-size:12px;color:var(--muted)}
.vbody .tags{display:flex;gap:6px;flex-wrap:wrap}
.vbody .ft{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.vbody .ft .who{display:flex;align-items:center;gap:8px}
.vdet{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.7}
.vdetail{background:var(--sky-2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.9;white-space:pre-wrap}
.handover{display:flex;align-items:center;gap:8px;background:var(--gold-bg);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:13px}
.handover svg.i{color:var(--gold-ink);flex-shrink:0}
.handover.big{padding:12px 14px;gap:12px}
.handover.big svg.i{width:28px;height:28px}
.handover.big div{display:flex;flex-direction:column;line-height:1.5}
.handover.big b{font-size:15px;color:var(--heading)}
.handover.big a{font-weight:800;color:var(--blue);font-size:13px;align-self:flex-start}
.noimg{display:grid;place-items:center;color:var(--muted);background:var(--sky)}
.noimg svg.i{width:30px;height:30px;opacity:.6}
.vmini{display:flex;flex-direction:column;gap:4px}
.vmini-it{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;text-align:right;width:100%;transition:background .2s}
.vmini-it:hover{background:var(--hover)}
.vmini-it>div{flex:1;min-width:0}
.vmini-it b{display:block;font-size:13.5px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmini-it span{font-size:12px;color:var(--muted)}
.vm-img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex-shrink:0;display:block}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line-2);width:100%;text-align:right}
.vrow:last-child{border:0}
.vrow .t{flex:1;min-width:0}
.vrow .t b{font-size:14px;font-weight:800;color:var(--heading);display:block}
.vrow .t .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.vrow .t .sub svg.i{width:13px;height:13px}
.vr-img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;display:block}
.vsec{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--heading);font-size:14.5px;border-top:1px dashed var(--line);padding-top:14px}
.vsec svg.i{color:var(--red)}
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:18px;padding:22px 12px;cursor:pointer;text-align:center;background:var(--sky-2);transition:border-color .2s,background .2s}
.photo-pick:hover{border-color:var(--primary-b)}
.photo-pick svg.i{width:40px;height:40px;color:var(--heading);stroke-width:1.6}
.photo-pick b{font-size:15px;color:var(--heading)}
.photo-pick span{font-size:12px;color:var(--muted)}
.photo-prev{display:flex;gap:12px;align-items:center;background:var(--sky-2);border-radius:18px;padding:10px}
.photo-prev img{width:128px;height:96px;object-fit:cover;border-radius:12px;flex-shrink:0}
.photo-prev .pinfo{display:flex;flex-direction:column;gap:6px;font-size:12.5px;align-items:flex-start}
.photo-prev .pinfo>b{color:var(--green);display:flex;align-items:center;gap:4px;font-size:14px}
.vphoto{width:100%;max-height:58vh;object-fit:contain;border-radius:16px;background:#000;display:block}
.optcards.res4{grid-template-columns:repeat(4,1fr)}
.selfie-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800;font-size:13px;color:var(--ink-2)}
.selfie{width:84px;height:84px;border-radius:16px;object-fit:cover}
@media (max-width:560px){.optcards.res4{grid-template-columns:repeat(2,1fr)}.optcards.res4 .oc{padding:10px 6px}}

/* ---------- Roster ---------- */
.roster td{padding:8px 8px}
.roster th{text-align:center}
.roster th small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.roster th.hol{color:var(--teal)}
.rsel{appearance:none;-webkit-appearance:none;width:100%;min-width:104px;height:36px;border-radius:10px;border:1.5px solid transparent;font-weight:800;font-size:12.5px;text-align:center;text-align-last:center;cursor:pointer;padding:0 8px;position:relative}
.rsel.k-morning{background:var(--gold-bg);color:var(--gold-ink)}
.rsel.k-evening{background:var(--orange-bg);color:var(--orange)}
.rsel.k-night{background:var(--indigo-bg);color:var(--indigo)}
.rsel.k-rest{background:var(--slate-bg);color:var(--slate)}
.rsel.ov{border-color:var(--heading)}
.rcell{position:relative}
.rcell .dot{position:absolute;top:3px;inset-inline-end:3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}

/* ---------- Modal & toast ---------- */
.ovl{position:fixed;inset:0;background:rgba(8,22,56,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--card);border-radius:26px;width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.modal.lg{max-width:780px}
.modal.sm{max-width:420px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}
.modal-h h3{font-size:18px;font-weight:900;color:var(--heading);line-height:1.3}
.modal-h p{font-size:12.5px;color:var(--muted)}
.modal-h .x{margin-inline-start:auto}
.modal-b{padding:4px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-b>*{flex-shrink:0}
.modal-f{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.modal-f .sp{flex:1}
.toasts{position:fixed;top:18px;left:18px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:min(380px,calc(100vw - 36px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-lg);font-weight:700;font-size:13.5px;pointer-events:auto;animation:tin .35s cubic-bezier(.2,.9,.3,1.2);border-inline-start:5px solid var(--green)}
.toast.err{border-color:var(--red)} .toast.info{border-color:var(--blue)} .toast.warn{border-color:var(--orange)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateX(-30px)}}
@keyframes tout{to{opacity:0;transform:translateX(-30px)}}
.cred{background:linear-gradient(135deg,var(--navy),#1a4aa8);color:#fff;border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.cred span{display:block;font-size:12px;color:#bcd0f5;font-weight:700}
.cred b{font-size:26px;font-weight:900;color:var(--gold);letter-spacing:2px;direction:ltr;display:block}
.note{background:var(--sky-2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.note svg.i{color:var(--blue);margin-top:2px}
.note.warn{background:var(--orange-bg);border-color:#fbd9ae}
.note.warn svg.i{color:var(--orange)}
.note.gold{background:var(--gold-bg);border-color:#f3dd8f}
.note.gold svg.i{color:var(--gold-ink)}

/* ---------- Employee app ---------- */
.emp{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safe-b));position:relative}
.emp-top{background:linear-gradient(140deg,var(--navy) 0%,#163f92 70%,#1d55c0 100%);color:#fff;padding:calc(14px + var(--safe-t)) 18px 78px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.emp-top::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;bottom:-150px;background:radial-gradient(circle,rgba(247,193,45,.30),transparent 65%)}
.emp-bar{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.emp-bar h1{font-size:18px;font-weight:900;flex:1;text-align:center}
.emp-bar .btn{color:#fff;background:rgba(255,255,255,.1);border:0;box-shadow:none}
.emp-hello{display:flex;align-items:center;gap:12px;margin-top:16px;position:relative;z-index:1}
.emp-hello b{font-size:18px;font-weight:900;display:block;line-height:1.3}
.emp-hello span{font-size:13px;color:#bcd0f5}
.emp-body{margin-top:-58px;padding:0 14px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}
.clockcard{background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:18px 18px 22px;text-align:center}
.clockcard .bigt{font-size:46px;font-weight:900;color:var(--heading);line-height:1.1;letter-spacing:-1px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.clockcard .bigt .ltr small{font-size:22px;color:var(--muted)}
.clockcard .bigt>small{font-size:20px;color:var(--gold-ink);font-weight:800}
.clockcard .dt{font-weight:700;color:var(--muted);font-size:14px;margin-top:2px}
.clockcard .shift{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px;border-radius:12px;font-weight:800;font-size:13px}
.punch-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:18px}
.punch{width:184px;height:184px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:900;font-size:18px;position:relative;transition:transform .15s}
.punch:active{transform:scale(.96)}
.punch svg.i{width:62px;height:62px;stroke-width:1.6}
.punch.in{background:radial-gradient(circle at 30% 25%,#3fd88a,#0f8a4f 70%);box-shadow:0 22px 40px -16px rgba(20,149,90,.85),inset 0 -10px 20px rgba(0,0,0,.12)}
.punch.out{background:radial-gradient(circle at 30% 25%,#ff7a87,#c9283a 70%);box-shadow:0 22px 40px -16px rgba(220,53,69,.85),inset 0 -10px 20px rgba(0,0,0,.12)}
.punch.done{background:radial-gradient(circle at 30% 25%,#5b7bc1,#0a2357 70%);box-shadow:0 22px 40px -16px rgba(10,35,87,.75)}
.punch::before,.punch::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid currentColor;opacity:0}
.punch.in::before,.punch.in::after{color:#18a058;animation:ring 2.2s infinite}
.punch.out::before,.punch.out::after{color:#dc3545;animation:ring 2.2s infinite}
.punch::after{animation-delay:1.1s!important}
@keyframes ring{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.punch.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.locpill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;font-weight:700;font-size:13px;max-width:100%}
.locpill svg.i{width:17px;height:17px}
.locpill.ok{background:var(--green-bg);color:var(--green)}
.locpill.warn{background:var(--orange-bg);color:var(--orange)}
.locpill.err{background:var(--red-bg);color:var(--red)}
.locpill.wait{background:var(--sky);color:var(--navy-3)}
.workline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.workline div{background:var(--sky-2);border-radius:14px;padding:10px 6px}
.workline span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.workline b{font-size:16px;font-weight:900;color:var(--heading);display:block}
.ecard2{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px}
.ecard2 h3{font-size:15px;font-weight:900;color:var(--heading);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mstats div{background:var(--sky-2);border-radius:14px;padding:10px 4px;text-align:center}
.mstats b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.mstats span{font-size:11.5px;color:var(--muted);font-weight:700}
.hist-it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2)}
.hist-it:last-child{border:0}
.hist-it .d{width:48px;height:52px;border-radius:14px;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1}
.hist-it .d b{font-size:18px;font-weight:900;color:var(--heading)}
.hist-it .d span{font-size:10.5px;color:var(--muted);font-weight:700}
.hist-it .t{flex:1;min-width:0}
.hist-it .t b{font-size:13.5px;font-weight:800}
.hist-it .t .sub{font-size:12px;color:var(--muted)}
.etabs{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;background:var(--card);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:8px 4px calc(8px + var(--safe-b));box-shadow:0 -10px 34px -14px rgba(10,35,87,.3);border-radius:24px 24px 0 0;z-index:50}
.etabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:14px;position:relative}
.etabs button svg.i{width:22px;height:22px}
.etabs button.on{color:var(--heading)}
.etabs button.on::before{content:'';position:absolute;top:-8px;width:28px;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
.etabs .bdg{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.success-head{text-align:center;padding:4px 0 2px}
.success-head .ck{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#3fd88a,#0f8a4f 70%);box-shadow:0 16px 30px -12px rgba(20,149,90,.8);animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.success-head .ck.out{background:radial-gradient(circle at 30% 25%,#ff7a87,#c9283a 70%);box-shadow:0 16px 30px -12px rgba(220,53,69,.8)}
.success-head .ck svg.i{width:40px;height:40px;stroke-width:3}
.success-head h3{font-size:20px;font-weight:900;color:var(--green)}
.success-head h3.out{color:var(--red)}
.srows{background:var(--sky-2);border-radius:18px;padding:6px 14px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.srow svg.i{color:var(--navy-3)}
.srow span{color:var(--muted);font-weight:700;font-size:12.5px;min-width:54px}
.srow b{margin-inline-start:auto;font-weight:800;color:var(--ink);text-align:left;font-size:14px}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.pr{font-family:var(--font);color:#0d1b3a}
.pr-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid #0a2357;padding-bottom:10px;margin-bottom:10px;position:relative}
.pr-head::after{content:'';position:absolute;bottom:-3px;right:0;width:160px;height:3px;background:#f7c12d}
.pr-brand{display:flex;align-items:center;gap:10px}
.pr-mark{width:42px;height:42px;border-radius:12px;background:#0a2357;color:#f7c12d;display:grid;place-items:center}
.pr-mark svg.i{width:24px;height:24px}
.pr-brand b{display:block;font-size:17px;font-weight:900}
.pr-brand span{font-size:11px;color:#6b7a99}
.pr-title{flex:1;text-align:center}
.pr-title h1{font-size:20px;font-weight:900;color:#0a2357}
.pr-title p{font-size:12px;color:#33415c;font-weight:700}
.pr-meta{font-size:10.5px;color:#6b7a99;text-align:left}
.pr-meta b{color:#0d1b3a;font-size:11.5px}
.pr-stats{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pr-stats div{border:1px solid #e2e9f4;border-radius:8px;padding:4px 12px;font-size:11px;background:#f5f8fe}
.pr-stats b{font-size:14px;color:#0a2357;margin-inline-start:6px}
.pr-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.pr-tbl th{background:#0a2357;color:#fff;padding:6px 5px;font-weight:800;border:1px solid #0a2357}
.pr-tbl td{border:1px solid #d9e1ee;padding:5px;text-align:center}
.pr-tbl tbody tr:nth-child(even) td{background:#f6f9fe}
.pr-tbl tfoot td{background:var(--card)6d9;font-weight:900}
.pr-tbl .s-green{color:#14955a;font-weight:800} .pr-tbl .s-red{color:#dc3545;font-weight:800} .pr-tbl .s-orange{color:#e67e0d;font-weight:800} .pr-tbl .s-purple{color:#6c4ee6;font-weight:800} .pr-tbl .s-slate{color:#6f7d99} .pr-tbl .s-teal{color:#0d9488;font-weight:800} .pr-tbl .s-blue{color:#2563d9;font-weight:800}
.pr-foot{display:flex;gap:40px;margin-top:26px;font-size:12px;font-weight:800}
.pr-foot div{flex:1;text-align:center}
.pr-foot span{display:block;border-bottom:1px dotted #33415c;height:30px;margin-top:4px}
.pr-by{text-align:left!important;color:#6b7a99;font-weight:600!important;font-size:10px}

/* ---------- Responsive ---------- */
@media (max-width:1500px){.shell{grid-template-columns:250px minmax(0,1fr)}.page{padding:22px 22px 44px}.top{padding:12px 22px}}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){
  .g-dash{grid-template-columns:minmax(0,1fr)}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login{grid-template-columns:1fr}
  .lg-hero{padding:34px 22px 20px;gap:16px}
  .lg-more,.lg-wave,.lg-wave-txt{display:none}
  .lg-side{padding:6px 16px 40px}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;right:0;width:286px;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh-lg)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(8,22,56,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
  .top{padding:10px 14px calc(10px);padding-top:calc(10px + var(--safe-t));gap:8px}
  .top h1{font-size:17px}
  .top-menu{display:inline-flex}
  .clockchip .d,.top .crumb,.live span{display:none}
  .live{padding:0 9px}
  .page{padding:16px 14px calc(100px + var(--safe-b))}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--card);z-index:30;padding:6px 6px calc(6px + var(--safe-b));box-shadow:0 -10px 30px -14px rgba(10,35,87,.3);border-radius:22px 22px 0 0}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:800;color:var(--muted);padding:5px 0;position:relative}
  .bnav a svg.i{width:22px;height:22px}
  .bnav a.on{color:var(--heading)}
  .bnav a.on::before{content:'';position:absolute;top:-6px;width:26px;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
  .bnav .bdg{position:absolute;top:0;inset-inline-end:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  .hero{grid-template-columns:1fr;padding:20px}
  .hero-ring{justify-content:space-between}
  .ring{width:110px;height:110px}
  .ring .v b{font-size:25px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:13px;gap:8px;border-radius:18px}
  .kpi .v{font-size:25px}
  .kpi .tile{width:40px;height:40px;border-radius:13px}
  .kpi .tile svg.i{width:20px;height:20px}
  .g-2,.g-3{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px;border-radius:18px}
  .tbl-wrap{max-height:none;border-radius:16px}
  .toolbar .btn-txt{display:none}
  .toolbar .datenav{flex:1}
  .toolbar .datenav .inp{width:100%}
  .ovl{align-items:flex-end;padding:0}
  .modal,.modal.lg,.modal.sm{max-width:none;border-radius:26px 26px 0 0;max-height:92vh;animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
  .modal-f{padding-bottom:calc(16px + var(--safe-b))}
  .toasts{top:auto;bottom:calc(84px + var(--safe-b));left:12px;right:12px;max-width:none}
  .dbar .r{grid-template-columns:96px 1fr 46px}
  .card-h{flex-wrap:wrap}
  .card-h .act.legend-row{width:100%;margin-inline-start:0;justify-content:flex-start}
  .ecards{grid-template-columns:1fr}
}
@keyframes sheet{from{transform:translateY(100%)}}
@media (max-width:560px){
  .grid2,.grid3{grid-template-columns:1fr}
  .lg-feats{grid-template-columns:repeat(2,1fr);gap:14px 0}
  .lg-feats>div:nth-child(3){border:0}
  .lg-title{font-size:32px}
  .lg-pill::before,.lg-pill::after{display:none}
  .lg-card{padding:26px 20px 22px;border-radius:24px}
  .optcards{grid-template-columns:1fr}
  .clockchip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= v2: photos, live tracking, chat ================= */
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xl{width:92px;height:92px;border-radius:28px;font-size:32px}
.emp-hello .av{border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.who-link{display:block;color:inherit;border-radius:12px}
.who-link:hover b{color:var(--title-2);text-decoration:underline;text-underline-offset:3px}
.ph-edit{display:flex;align-items:center;gap:16px;background:var(--sky-2);border-radius:18px;padding:12px 14px}
.ph-edit .ph-act{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph-edit .ph-act b{color:var(--heading);font-size:14.5px}
.ph-edit .ph-act span{font-size:12px;color:var(--muted)}
.weak-banner{display:flex;align-items:center;gap:12px;background:var(--red-bg);border:1px solid rgba(220,53,69,.25);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:16px;font-weight:600;font-size:13.5px}
.weak-banner svg.i{color:var(--red)}
.weak-banner>div{flex:1;min-width:0}
.weak-banner .btn{margin-inline-start:auto;flex-shrink:0}
@media (max-width:700px){.weak-banner{flex-wrap:wrap;font-size:13px}.weak-banner>div{flex-basis:calc(100% - 40px)}.weak-banner .btn{width:100%}}
/* live ticker at the top */
.ticker.top{margin:0 0 18px}
.ticker{display:block;height:50px!important;min-height:50px;max-height:50px;line-height:1.2;contain:paint}
.ticker .ticker-track{position:absolute;top:0;left:0;height:50px}
.ticker-it{height:50px;line-height:1.2}
.ticker .tk-live{position:absolute;top:0;bottom:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0a2357;font-weight:900;font-size:13.5px;direction:rtl;box-shadow:-12px 0 24px rgba(10,35,87,.45)}
.ticker .tk-live i{width:9px;height:9px;border-radius:50%;background:#d22a3b;animation:pulse-r 1.5s infinite}
@keyframes pulse-r{0%{box-shadow:0 0 0 0 rgba(210,42,59,.6)}70%{box-shadow:0 0 0 8px rgba(210,42,59,0)}100%{box-shadow:0 0 0 0 rgba(210,42,59,0)}}
.ticker.top::before{right:96px}
.ticker-it.ev{font-weight:700;font-size:13.5px}
.ticker-it.ev b{font-size:14px;color:#fff}
.ticker-it.ev .dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
/* live map */
.live-card{margin-bottom:18px}
.live-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.maphold{height:410px;border-radius:16px;overflow:hidden;background:var(--sky);position:relative;isolation:isolate}
.maphold.tall{height:calc(100vh - 128px);min-height:480px}
.maphold .map-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;z-index:0;text-align:center;padding:20px}
.lmap{width:100%;height:100%;position:relative;z-index:1}
.live-list{display:flex;flex-direction:column;gap:7px;max-height:410px;overflow:auto;padding:2px}
.lv-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);text-align:right;width:100%;transition:border-color .15s,background .15s;cursor:pointer}
.lv-it:hover{border-color:var(--line);background:var(--sky-2)}
.lv-it.on{border-color:var(--primary-b);background:var(--sky-2)}
.lv-it .t{flex:1;min-width:0}
.lv-it b{display:block;font-size:13.5px;color:var(--heading);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-it .sub{font-size:11.5px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;line-height:1.5}
.lv-it .sub svg.i{width:12px;height:12px}
.lv-it .end svg.i{width:12px;height:12px;vertical-align:-2px}
.mob-only{display:none}
.lv-it .end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.lvs{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11.5px}
.lvs i{width:8px;height:8px;border-radius:50%;background:currentColor}
.lvs.fresh{color:var(--green)} .lvs.fresh i{animation:pulse 1.8s infinite}
.lvs.stale{color:var(--orange)} .lvs.old{color:var(--red)} .lvs.off,.lvs.none{color:var(--slate)}
.live-stats{display:flex;gap:8px;flex-wrap:wrap}
.lmap.leaflet-container{font-family:var(--font);background:var(--sky)}
[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
[data-theme=dark] .leaflet-bar a{background:#14203c;color:#e6ecfa;border-color:#25365e}
[data-theme=dark] .leaflet-control-attribution{background:rgba(17,27,49,.8);color:#8b9abd}
[data-theme=dark] .leaflet-control-attribution a{color:#8fb4ff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);box-shadow:var(--sh-lg)}
.leaflet-popup-content{direction:rtl;text-align:right;font-family:var(--font);margin:12px 14px;font-size:13px;line-height:1.6;min-width:210px}
.leaflet-popup-content b{color:var(--heading)}
.pop-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pop-h b{display:block;font-size:14.5px}
.pop-h span{font-size:12px;color:var(--muted)}
.pop-k{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin-bottom:10px}
.pop-k span{color:var(--muted)}
.pop-a{display:flex;gap:6px;flex-wrap:wrap}
.pop-img{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:block}
.leaflet-tooltip{font-family:var(--font);font-weight:700;direction:rtl}
.emk-w{background:none;border:0}
.emk{display:flex;flex-direction:column;align-items:center;width:120px}
.emk .av{width:42px;height:42px;border-radius:50%;font-size:14px;border:3px solid #22c55e;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.emk.stale .av{border-color:#f59e0b} .emk.old .av{border-color:#ef4444} .emk.off .av,.emk.none .av{border-color:#94a3b8;filter:grayscale(.55)}
.emk.fresh .av{animation:mk-pulse 2s infinite}
@keyframes mk-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55),0 6px 16px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 12px rgba(34,197,94,0),0 6px 16px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0),0 6px 16px rgba(0,0,0,.35)}}
.emk span{margin-top:3px;background:rgba(10,35,87,.92);color:#fff;font:800 11px/1.6 Cairo,Tahoma,sans-serif;padding:0 8px;border-radius:8px;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.emk.off span,.emk.none span{background:rgba(100,116,139,.92)}
.cmk{width:30px;height:30px;border-radius:10px;background:#e2414b;color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3);border:2px solid #fff}
.cmk.site{background:#0a2357;border-color:#f7c12d}
.cmk.visit{background:#6c4ee6;border-radius:50%}
.cmk svg.i{width:16px;height:16px}
.pnum{width:22px;height:22px;border-radius:50%;background:#0a2357;color:#f7c12d;border:2px solid #f7c12d;font:800 10.5px/18px Cairo,Tahoma,sans-serif;text-align:center}
.pnum.in{background:#14955a;color:#fff;border-color:#fff;width:28px;height:28px;line-height:24px;font-size:11px}
.pnum.out{background:#dc3545;color:#fff;border-color:#fff;width:28px;height:28px;line-height:24px;font-size:11px}
/* tracking page */
.trk{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
.trk-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 128px);overflow:auto;padding-bottom:4px}
.trk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trk-sum div{background:var(--sky-2);border-radius:12px;padding:8px 4px;text-align:center}
.trk-sum b{display:block;font-size:18px;font-weight:900;color:var(--heading);line-height:1.3}
.trk-sum span{font-size:11px;color:var(--muted);font-weight:700}
.tl{display:flex;flex-direction:column;position:relative;padding-inline-start:6px}
.tl-it{display:flex;gap:10px;align-items:flex-start;padding:7px 0;position:relative;width:100%;text-align:right}
.tl-it::before{content:'';position:absolute;inset-inline-start:13px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.tl-it:last-child::before{display:none}
.tl-it .tl-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;flex-shrink:0;z-index:1}
.tl-it .tl-ic svg.i{width:15px;height:15px}
.tl-it .t{flex:1;min-width:0}
.tl-it b{font-size:13px;color:var(--heading);display:block;line-height:1.4}
.tl-it span{font-size:11.5px;color:var(--muted)}
.tl-it .tm{font-weight:800;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tl-gap .tl-ic{background:var(--slate-bg);color:var(--orange)}
/* chat */
.chat-page{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;height:calc(100vh - 128px);min-height:500px}
.chat-list,.chat-thread{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.ch-head{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line-2)}
.ch-items{overflow:auto;flex:1}
.ch-it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);width:100%;text-align:right;transition:background .15s}
.ch-it:hover{background:var(--hover)}
.ch-it.on{background:var(--sky-2);box-shadow:inset -4px 0 0 var(--gold)}
.ch-it .t{flex:1;min-width:0}
.ch-it b{display:block;font-size:14px;color:var(--heading);line-height:1.35}
.ch-it .pv{font-size:12.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.ch-it.unr .pv{color:var(--ink);font-weight:700}
.ch-it .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.ch-it .un{background:var(--green);color:#fff;min-width:21px;height:21px;border-radius:11px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.ct-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);min-height:64px}
.ct-head b{display:block;font-size:15px;color:var(--heading);line-height:1.3}
.ct-head span{font-size:12px;color:var(--muted)}
.ct-msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 20% 10%,var(--sky-2),transparent 55%),var(--bg)}
.msg{max-width:min(78%,540px);padding:7px 12px 5px;border-radius:17px;font-size:14px;line-height:1.65;position:relative;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 2px rgba(10,35,87,.08);animation:msgin .25s ease}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#1b4aa6,#0a2357);color:#fff;border-end-end-radius:5px}
.msg.them{align-self:flex-start;background:var(--card);color:var(--ink);border-end-start-radius:5px;border:1px solid var(--line-2)}
.msg.bc{background:var(--gold-bg);color:var(--ink);border:1px dashed rgba(200,150,10,.45)}
.msg.bc.me{color:var(--ink)}
.msg .bct{display:flex;align-items:center;gap:5px;font-weight:800;font-size:11.5px;color:var(--gold-ink);margin-bottom:2px}
.msg .bct svg.i{width:14px;height:14px}
.msg .who-n{display:block;font-size:11px;font-weight:800;opacity:.8}
.msg .mt{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:10.5px;opacity:.78;margin-top:1px;white-space:nowrap}
.msg .mt svg.i{width:14px;height:14px;stroke-width:2.4}
.msg .mt .rd{color:#7dd3fc}
.msg.them .mt .rd,.msg.bc .mt .rd{color:var(--blue)}
.msg .mdel{position:absolute;top:4px;inset-inline-end:-30px;opacity:0;transition:.15s;color:var(--muted)}
.msg:hover .mdel{opacity:1}
.day-sep{align-self:center;background:var(--card);color:var(--muted);font-size:11.5px;font-weight:800;padding:3px 14px;border-radius:12px;margin:8px 0 4px;box-shadow:0 1px 2px rgba(10,35,87,.08)}
.ct-quick{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;scrollbar-width:none}
.ct-quick button{flex-shrink:0;height:30px;padding:0 12px;border-radius:15px;background:var(--sky-2);color:var(--ink-2);font-weight:700;font-size:12.5px;border:1px solid var(--line)}
.ct-quick button:hover{background:var(--sky)}
.ct-bar{display:flex;gap:8px;padding:10px 12px;align-items:flex-end}
.ct-bar textarea.inp{flex:1;resize:none;height:46px;min-height:46px;max-height:140px;padding:11px 14px;border-radius:23px;line-height:1.5}
.ct-bar .btn{width:46px;height:46px;border-radius:50%;padding:0;flex-shrink:0}
.ct-bar .btn svg.i{transform:scaleX(-1)}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:30px}
.chat-off{background:var(--orange-bg);color:var(--ink);padding:10px 14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.chat-off svg.i{color:var(--orange)}
/* employee chat + tracking pill */
.echat{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.echat-card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:12px;min-height:calc(100vh - 330px)}
.ebar{position:fixed;left:0;right:0;bottom:calc(70px + var(--safe-b));max-width:500px;margin:0 auto;padding:8px 12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;gap:8px;z-index:45;align-items:flex-end}
.ebar textarea.inp{flex:1;resize:none;height:46px;min-height:46px;max-height:120px;padding:11px 14px;border-radius:23px}
.ebar .btn{width:46px;height:46px;border-radius:50%;padding:0;flex-shrink:0}
.ebar .btn svg.i{transform:scaleX(-1)}
.emp.chatmode{padding-bottom:calc(150px + var(--safe-b))}
.trackpill{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:14px;font-size:12.5px;font-weight:700;text-align:right;line-height:1.5}
.trackpill svg.i{width:18px;height:18px;flex-shrink:0}
.trackpill.ok{background:var(--green-bg);color:var(--green)}
.trackpill.warn{background:var(--orange-bg);color:var(--orange)}
.ebanner{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;width:100%;text-align:right}
.ebanner b{display:block;color:var(--heading);font-size:14px}
.ebanner span{font-size:12.5px;color:var(--muted)}
.ebanner .grow{min-width:0}
.ebanner.msgb{border-inline-start:5px solid var(--green)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa .btn{height:56px;border-radius:18px;font-size:15px}
/* employee profile modal */
.prof-h{display:flex;align-items:center;gap:16px}
.prof-h b{display:block;font-size:20px;font-weight:900;color:var(--heading);line-height:1.3}
.prof-h span{color:var(--muted);font-size:13px}
.prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prof-stats div{background:var(--sky-2);border-radius:14px;padding:10px 6px;text-align:center}
.prof-stats b{display:block;font-size:20px;font-weight:900;line-height:1.25}
.prof-stats span{font-size:11.5px;color:var(--muted);font-weight:700}
@media (max-width:1100px){.live-grid{grid-template-columns:1fr}.live-list{max-height:none}}
@media (max-width:900px){
  .maphold{height:320px}
  .maphold.tall{height:58vh;min-height:360px}
  .trk{grid-template-columns:1fr}
  .trk-side{max-height:none;order:2}
  .chat-page{grid-template-columns:1fr;height:calc(100vh - 170px - var(--safe-b));min-height:420px}
  .chat-page.has-cur .chat-list{display:none}
  .chat-page:not(.has-cur) .chat-thread{display:none}
  .msg{max-width:86%}
  .msg .mdel{display:none}
  .ticker .tk-live span{display:none}
  .ticker .tk-live{padding:0 12px}
  .ticker.top::before{right:40px}
  .prof-h{flex-direction:column;text-align:center}
  .mob-only{display:inline-flex}
}

/* ================= mobile sizing fixes (iOS auto-zoom, overflow) ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%}
body{max-width:100%;position:relative}
a,button,label,.btn,[data-act],[data-eact],[data-etab]{touch-action:manipulation}
img,video,canvas,iframe{max-width:100%}
.modal{max-height:calc(100dvh - 40px)}
@media (pointer:coarse),(max-width:900px){
  input,select,textarea,.inp,.inp-sm,select.inp,textarea.inp{font-size:16px!important}
  .modal,.modal.lg,.modal.sm{max-height:92dvh;width:100%}
  .modal-b{overflow-x:hidden}
}
@supports (-webkit-touch-callout:none){
  input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:40px}
  input[type=date].inp::-webkit-date-and-time-value,input[type=time].inp::-webkit-date-and-time-value{text-align:right}
}
@supports (-webkit-touch-callout:none){
  input[type=datetime-local].inp,input[type=month].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;line-height:40px}
}
.field,.grid2>*,.grid3>*{min-width:0}

/* ================= v1.2: tasks, signature, rating, kiosk, offline ================= */
.tsteps{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin:2px 0}
.tsteps::before{content:"";position:absolute;top:8px;inset-inline:10%;height:3px;border-radius:3px;background:var(--line)}
.tsteps::after{content:"";position:absolute;top:8px;inset-inline-start:10%;width:calc(var(--p,0%) * .8);height:3px;border-radius:3px;background:var(--green);transition:width .4s}
.tsteps>div{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.tsteps i{width:19px;height:19px;border-radius:50%;background:var(--card);border:3px solid var(--line);position:relative;z-index:2;transition:.3s}
.tbl-pay td,.tbl-pay th{padding-inline:8px}
.tsteps .on i{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
.tsteps span{font-size:11px;font-weight:800;color:var(--muted);line-height:1.3}
.tsteps .on span{color:var(--heading)}
.tsteps small{font-size:10.5px;color:var(--muted);direction:ltr;min-height:14px}
.tcard.new{box-shadow:var(--sh),0 0 0 2px var(--blue-bg)}
.tcard.new .stripe{animation:tpulse 1.6s ease-in-out infinite}
@keyframes tpulse{50%{opacity:.35}}
.tcard .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tcard .acts .btn{height:46px}
.task-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(115deg,#1d55c0,#0a2357);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);cursor:pointer;animation:fadeUp .4s ease}
.task-banner b{display:block;font-size:15px}
.task-banner span{font-size:12.5px;color:#cfe0ff}
.task-banner .tile{background:var(--gold);color:#0a2357}
.etab-bdg{position:absolute;top:4px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;line-height:1}
.sigwrap{flex-shrink:0;position:relative;border:2px dashed var(--line);border-radius:16px;background:#fff;overflow:hidden;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigwrap .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9aa6bf;font-weight:700;pointer-events:none;font-size:14px}
.sigwrap.has .ph{display:none}
.sigwrap .clr{position:absolute;top:8px;left:8px;z-index:2}
.sigimg{flex-shrink:0;background:#fff;border-radius:14px;border:1px solid var(--line);padding:6px;display:flex;align-items:center;gap:12px}
.sigimg img{height:74px;max-width:60%;object-fit:contain}
.sigimg span{color:#33415c;font-size:12.5px;font-weight:700}
.stars{color:var(--gold);letter-spacing:2px;font-size:17px;line-height:1;white-space:nowrap}
.stars .off{color:var(--line)}
.rate-box{flex-shrink:0;display:flex;gap:12px;align-items:center;background:var(--gold-bg);border-radius:14px;padding:10px 14px}
.rate-box p{font-size:13px;color:var(--ink-2);margin-top:2px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:8px;align-items:center;margin-bottom:8px}
.share-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.share-row .btn{height:46px}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{background:#1fbd5a}
.okshot{text-align:center;padding:6px 0 2px}
.okshot .tile{margin:0 auto 10px;width:64px;height:64px;border-radius:22px}
.okshot b{display:block;font-size:19px;color:var(--heading)}
.qbar{display:flex;align-items:center;gap:10px;background:var(--orange-bg);color:var(--orange);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px}
.qbar .btn{margin-inline-start:auto}
.scan{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan .fr{position:absolute;top:50%;left:50%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-58%);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);border:3px solid var(--gold)}
.scan .bar{position:absolute;bottom:0;inset-inline:0;padding:18px 18px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:10px;align-items:center;color:#fff;text-align:center;font-weight:700}
.scan .x{position:absolute;top:calc(14px + var(--safe-t));right:14px;z-index:2}
.cust-it{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cust-it:last-child{border:0}
.cust-it b{flex:1;font-size:13.5px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line-2)}
.lb-row:last-child{border:0}
.lb-row .rk{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--sky);color:var(--heading);flex-shrink:0}
.lb-row:nth-child(1) .rk{background:var(--gold);color:#0a2357}
.lb-row:nth-child(2) .rk{background:#d9e2f1;color:#0a2357}

/* ================= v1.5: live routes board ================= */
.routes{position:relative;overflow:hidden;border-radius:26px;padding:18px 20px 16px;margin-bottom:18px;color:#fff;background:linear-gradient(180deg,#0b2a6b 0%,#0a2357 45%,#071a44 100%);box-shadow:0 24px 50px -24px rgba(10,35,87,.75);isolation:isolate}

.rt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

.rt-way::before{content:'';position:absolute;left:0;right:0;bottom:8px;height:16px;border-radius:9px;background:linear-gradient(180deg,#1a2a4f,#0d1834);box-shadow:inset 0 2px 0 rgba(255,255,255,.06),0 6px 14px -6px rgba(0,0,0,.6)}

.st-onway:not(.stale) .rt-way::after,.moving .rt-way::after{animation:roadmv .8s linear infinite}

.walker .w-shirt{fill:#f7c12d}
.walker .w-shoe{stroke:#0d1834;stroke-width:4;stroke-linecap:round}
.walker .w-bag{fill:#dc3545;stroke:#7a1621;stroke-width:1.2}.walker .w-bagh{fill:none;stroke:#7a1621;stroke-width:1.5}

.st-onway:not(.stale) .walker .l2,.moving .walker .l2,.rt-empty .walker .l2{animation:legB .62s ease-in-out infinite}

.st-onway:not(.stale) .rt-face,.moving .rt-face{animation:bobf .31s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes legB{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}

@keyframes armB{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes bobw{50%{transform:translateY(-2px)}}

.st-free .rt-bld{opacity:.5}
.rt-burst{position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--gold);opacity:0;pointer-events:none}
.rt-lane.just .rt-burst{animation:burst 1.2s ease-out 2}

.rt-empty{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:18px;padding:14px 18px}

.rt-empty b{display:block;font-size:15px}.rt-empty span{font-size:12.5px;color:#b9c8ec;line-height:1.7}

.sdot.busy{background:#e5394d;animation:pulse-r 1.8s infinite}
.sdot.free{background:#18b46a;animation:pulse 2.2s infinite}

.avst{position:relative;flex-shrink:0;display:inline-block}
.avst>.sdot{position:absolute;bottom:-2px;inset-inline-start:-2px;width:14px;height:14px;border:2.5px solid var(--card)}
