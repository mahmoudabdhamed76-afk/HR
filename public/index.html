.hello-st .sdot{width:8px;height:8px;animation:none}
.stcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden;border:2px solid transparent;animation:fadeUp .35s ease}
.stcard::before{content:'';position:absolute;inset:0 0 auto 0;height:5px}
.stcard.free{border-color:rgba(24,180,106,.25)}.stcard.free::before{background:linear-gradient(90deg,#18b46a,#7fe3b0)}
.stcard.busy{border-color:rgba(229,57,77,.3);background:linear-gradient(180deg,var(--red-bg),transparent 62%),var(--card)}.stcard.busy::before{background:linear-gradient(90deg,#e5394d,#ff8a96)}

.st-head b{display:block;font-size:16px;font-weight:900;color:var(--heading);line-height:1.35}

.st-head .t span strong{color:var(--heading);font-weight:900}
.st-clock{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;background:var(--card);border-radius:14px;padding:6px 14px;box-shadow:inset 0 0 0 1.5px rgba(229,57,77,.2)}

.hello-st{cursor:pointer}
.st-timer{font-size:20px;font-weight:900;color:var(--red);direction:ltr;font-variant-numeric:tabular-nums;background:var(--card);border-radius:12px;padding:4px 10px;box-shadow:0 1px 0 var(--line)}
.stbtn{width:100%;height:62px;border-radius:19px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:900;font-size:18px;position:relative;overflow:hidden;transition:transform .15s}
.stbtn:active{transform:scale(.97)}

.stbtn.go{background:linear-gradient(135deg,#f0566a,#c9283a);box-shadow:0 14px 26px -14px rgba(220,53,69,.9)}
.stbtn.done{background:linear-gradient(135deg,#25c47a,#0f8a4f);box-shadow:0 14px 26px -14px rgba(20,149,90,.9)}
.st-acts{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.st-acts .btn{height:62px;border-radius:19px;margin-top:14px;padding:0 14px;flex-direction:column;gap:2px;font-size:12px}
.st-acts .btn svg.i{width:20px;height:20px}
.st-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:700}
.st-meta span{display:inline-flex;align-items:center;gap:4px}
.st-meta svg.i{width:13px;height:13px}
.st-meta .warn{color:var(--orange)}

.stc-empty{text-align:center;color:var(--muted);font-size:13px;padding:16px}

.stb-it .tm{font-size:13px;font-weight:900;color:var(--red);white-space:nowrap;font-variant-numeric:tabular-nums;align-self:flex-start}

.stlog-it span{font-size:12px;color:var(--muted)}
.stlog-it .m{font-weight:900;color:var(--heading);font-size:13px;white-space:nowrap}

async function api(path, body, opts = {}) {
  const o = { method: body !== undefined ? 'POST' : 'GET', headers: {} };
  if (S.token) o.headers.Authorization = 'Bearer ' + S.token;
  if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(BASE + path, o); }
  catch { const e = new Error('مفيش اتصال بالسيرفر.. اتأكد إن البرنامج شغال وإنك متصل بالشبكة'); e.offline = true; throw e; }
  let j = {}; try { j = await r.json(); } catch {}
  if ([502, 503, 504].includes(r.status) && !j.error) { const e = new Error('السيرفر مش متاح دلوقتي.. جرب كمان شوية'); e.offline = true; throw e; }
  if (r.status === 401 && !opts.noLogout && S.token) { logout(true); throw new Error(j.error || 'انتهت الجلسة'); }
  if (!r.ok) throw new Error(j.error || ('خطأ ' + r.status));
  if (!opts.noTrack && body === undefined && Array.isArray(j.rows)) {
    if (/^\/api\/report\/(day|range)/.test(path)) S.lastRows = j.rows;
    if (path.startsWith('/api/leaves')) S.cacheLeaves = j.rows;
  }
  return j;
}

const Sync = {
  es: null, last: 0, watch: null,
  connect() {
    this.close();
    if (!S.token || S.kind !== 'user' || !window.EventSource) return;
    this.es = new EventSource(BASE + '/api/events?token=' + encodeURIComponent(S.token));
    this.last = Date.now();
    const alive = () => { this.last = Date.now(); setLive(true); };
    this.es.addEventListener('hello', alive);
    this.es.addEventListener('ping', alive);
    this.es.addEventListener('change', e => { alive(); let d = {}; try { d = JSON.parse(e.data); } catch {} this.onChange(d); });
    this.es.onerror = () => setLive(false);
    this.watch = setInterval(() => { if (Date.now() - this.last > 50000) this.connect(); }, 15000);
  },
  close() { if (this.es) { this.es.close(); this.es = null; } clearInterval(this.watch); setLive(false); },
  onChange(d) {
    if (d.type === 'status') { Status.onEvent(d); return; }
    if (d.type === 'loc') { Live.onLoc(d); Routes.refreshSoon(); return; }
    if (d.type === 'task' || d.type === 'plan') Routes.refreshSoon();
    if (d.type === 'chat') { Chat.onEvent(d); return; }
    if (d.type === 'chat_read') { Chat.onRead(d); return; }
    if (d.type === 'punch' || d.type === 'visit') Live.refreshSoon();

      const out = d.radius && d.dist !== null && d.dist !== undefined && d.dist > d.radius;

    }
    if (d.type === 'leave' && d.name) toast(`طلب جديد من ${d.name}`, 'info', 'clipboard');
    if (d.type === 'visit' && d.rated) toast(`${d.name} قيّم الخدمة ${'★'.repeat(d.rating || 0)}`, 'ok', 'badgeCheck');
    else if (d.type === 'visit' && d.name) toast(`${d.name} سجّل زيارة في ${d.center}`, 'info', 'wrench');
    if (d.type === 'task' && d.name) toast(d.status === 'done' ? `${d.name} خلّص المهمة ✓` : `${d.name} ${d.label || ''}${d.title ? ' — ' + d.title : ''}`, d.status === 'decline' ? 'warn' : d.status === 'done' ? 'ok' : 'info', 'send');
    if (d.type === 'reward_seen') { toast(`❤️ ${d.name} شاف المكافأة "${d.title || ''}"`, 'ok', 'gift'); if (S.page === 'rewards') refreshSoon(); return; }
    if (d.type === 'reward') { if (S.page === 'rewards') refreshSoon(); return; }
    if (d.type === 'plan' && d.name && !d.edit) toast(`${d.name} جدول زيارة لـ ${d.center} — ${dayName(d.date)}${d.n > 1 ? ` (${d.n} مواعيد)` : ''}`, 'info', 'cal');
    if (d.type === 'kb' && d.author) toast(`💡 ${d.author} ضاف حل: ${d.code ? d.code + ' — ' : ''}${d.problem || ''}`, 'info', 'bulb');
    if (d.type === 'plan' && !['plans', 'dashboard'].includes(S.page)) return;

          <div class="card"><div class="card-h"><div class="tile sm t-blue">${ic('building')}</div><div><h3>الحضور حسب القسم</h3><p>النهارده</p></div></div><div class="dbar">${depts}</div></div>
        </div>
      </div>`;
  },
  after(page, silent) {
    requestAnimationFrame(() => { $$('[data-ring]', page).forEach(c => c.style.strokeDashoffset = c.dataset.ring); });
    $$('[data-count]', page).forEach(el => countUp(el, Number(el.dataset.count) || 0, el.textContent.includes('%') ? '%' : '', silent));
    tickClock();
    const th = $('[data-keep=ticker]', page); if (th) keepTicker(th, PAGES.dashboard._tick);
    const rh = $('[data-keep=routes]', page); if (rh) Routes.mount(rh);
    if (silent) Routes.refreshSoon();
    Status.refresh();
    (async () => {
      await mountMap('dash', $('[data-maphold=dash]', page));
      if (!silent || !Live.data) { try { await Live.load(); } catch {} }
      Live.paint();
    })();
  },
};
function keepTicker(holder, html) {
  let t = S.keepTicker;
  if (!t) { t = document.createElement('div'); t.className = 'ticker top'; t.innerHTML = `<div class="tk-live"><i></i><span>مباشر</span></div><div class="ticker-track"></div>`; S.keepTicker = t; }
  holder.replaceWith(t);
  const tr = t.querySelector('.ticker-track'); if (tr._h !== html) { tr.innerHTML = html; tr._h = html; }
}
function countUp(el, to, suf = '', instant) {
  if (instant || to === 0) { el.textContent = to + suf; return; }
  const t0 = performance.now(), D = 900;
  const step = t => { const p = Math.min(1, (t - t0) / D); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

}

const Push = {
  ios() { return /iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.standalone || matchMedia('(display-mode: standalone)').matches); },
  ok() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext; },
  state() { if (!this.ok()) return this.ios() ? 'ios' : 'unsupported'; return Notification.permission; },
  u8(b64) { const p = '='.repeat((4 - b64.length % 4) % 4); const r = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); },
  async enable() {
    if (!this.ok()) throw new Error(this.ios() ? 'على الآيفون: ضيف البرنامج للشاشة الرئيسية الأول (زرار المشاركة ← إضافة إلى الشاشة الرئيسية) وافتحه من الأيقونة' : location.protocol !== 'https:' ? 'الإشعارات محتاجة رابط https (زي Railway)' : 'المتصفح ده مش بيدعم الإشعارات');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('لازم تسمح بالإشعارات من إعدادات المتصفح');
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const { key } = await api('/api/push/key');
    let sub = await reg.pushManager.getSubscription();
    if (sub) { try { const k = new Uint8Array(sub.options.applicationServerKey || []); const want = this.u8(key); if (k.length && k.some((x, i) => x !== want[i])) { await sub.unsubscribe(); sub = null; } } catch {} }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this.u8(key) });
    await api('/api/push/subscribe', sub.toJSON());
    return true;
  },
  async test() { const r = await api('/api/push/test', {}); if (!r.ok) throw new Error('الإشعار متبعتش — جرب تفعّل تاني'); return r; },
  card(on, who) {
    const st = this.state();
    const msg = st === 'ios' ? 'على الآيفون لازم تضيف البرنامج للشاشة الرئيسية الأول (زرار المشاركة ⬆️ ← "إضافة إلى الشاشة الرئيسية") وتفتحه من الأيقونة.' : st === 'unsupported' ? (location.protocol !== 'https:' ? 'الإشعارات بتشتغل على رابط https بس (زي Railway).' : 'المتصفح ده مش بيدعم الإشعارات.') : st === 'denied' ? 'الإشعارات مقفولة من إعدادات المتصفح للموقع ده — افتحها من هناك.' : '';
    return `<div class="row wrap" style="gap:8px">${on && st === 'granted' ? chip('الإشعارات شغالة على الجهاز ده', 'green', 'checkCircle') : ''}
      ${st !== 'ios' && st !== 'unsupported' && st !== 'denied' ? `<button class="btn btn-sm ${on && st === 'granted' ? 'btn-soft' : 'btn-green'}" data-act="push-on">${ic('bell')} ${on && st === 'granted' ? 'تفعيل تاني' : 'تفعيل الإشعارات'}</button>` : ''}
      ${on && st === 'granted' ? `<button class="btn btn-sm btn-soft" data-act="push-test">${ic('send')} تجربة</button>` : ''}</div>${msg ? `<div class="note warn" style="margin-top:10px">${ic('info')}<div>${msg}</div></div>` : ''}<small class="muted" style="display:block;margin-top:8px">${who}</small>`;
  },
};

/* ---------- Voice typing (speech to text, Egyptian Arabic) ---------- */
const Mic = {
  rec: null, btnEl: null,
  ok() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },
  btn() { return `<button type="button" class="mic-btn" data-mic title="اتكلم بدل الكتابة">${ic('mic')}<span>اتكلم</span></button>`; },
  stop() { try { this.rec && this.rec.stop(); } catch {} },
  toggle(btn) {
    if (this.rec && this.btnEl === btn) return this.stop();
    if (this.rec) this.stop();
    const field = btn.closest('.field') || btn.parentElement; const inp = field && field.querySelector('textarea,input:not([type=hidden])');
    if (!inp) return;
    if (!this.ok()) return toast(/iPhone|iPad/.test(navigator.userAgent) ? 'استخدم زرار الميكروفون 🎤 اللي في كيبورد الآيفون' : 'المتصفح ده مش بيدعم الكتابة بالصوت — جرب Chrome، أو ميكروفون الكيبورد', 'warn', 'mic');
    if (!window.isSecureContext) return toast('الكتابة بالصوت محتاجة رابط https', 'warn', 'mic');
    const R = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    R.lang = 'ar-EG'; R.interimResults = true; R.continuous = true; R.maxAlternatives = 1;
    const base = inp.value ? inp.value.replace(/\s+$/, '') + ' ' : ''; let finalTxt = '';
    R.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalTxt += t + ' '; else interim += t; }
      inp.value = (base + finalTxt + interim).replace(/\s{2,}/g, ' ');
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      if (inp.tagName === 'TEXTAREA' && typeof autoGrow === 'function') autoGrow(inp);
    };
    R.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('لازم تسمح للبرنامج يستخدم الميكروفون', 'warn', 'mic'); else if (e.error === 'no-speech') toast('مسمعتش حاجة.. اتكلم تاني', 'info', 'mic'); else if (e.error !== 'aborted') toast('الميكروفون وقف: ' + e.error, 'warn', 'mic'); };
    R.onend = () => { btn.classList.remove('rec'); $('span', btn).textContent = 'اتكلم'; if (this.rec === R) { this.rec = null; this.btnEl = null; } inp.value = inp.value.trim(); inp.dispatchEvent(new Event('input', { bubbles: true })); };
    try { R.start(); } catch (er) { return toast('مقدرتش أشغل الميكروفون', 'err', 'mic'); }
    this.rec = R; this.btnEl = btn; btn.classList.add('rec'); $('span', btn).textContent = 'بسمعك... دوس للإيقاف';
    if (navigator.vibrate) navigator.vibrate(30);
  },
};

async function logoFromFile(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('الملف ده مش صورة')); i.src = url; });
    const sc = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let d = c.toDataURL('image/png'); if (d.length > 500000) d = c.toDataURL('image/jpeg', 0.85);
    return d;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Ranges ---------- */
function quickRange(v) {
  const t = today(); const ms = t.slice(0, 8) + '01';
  if (v === 'today') return [t, t];
  if (v === 'yesterday') { const y = addDays(t, -1); return [y, y]; }
  if (v === 'week') return [weekStart(t), t];
  if (v === 'month') return [ms, t];
  if (v === 'lastmonth') { const le = addDays(ms, -1); return [le.slice(0, 8) + '01', le]; }
  if (v === '3months') return [addDays(t, -89), t];
  return [ms, t];
}

function tickClock() {
  const p = nowParts();
  const t = t12(p.time, true);
  $$('[data-clock]').forEach(el => el.textContent = t12(p.time));
  $$('[data-clock-sec]').forEach(el => el.textContent = t);
  $$('[data-clock-date]').forEach(el => el.textContent = dShort(p.date));
  $$('[data-elapsed]').forEach(el => {
    const from = Date.parse(el.dataset.elapsed.replace(' ', 'T') + 'Z'); const s = Math.max(0, Math.floor((srvNow() - from) / 1000));
    el.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  });
  const big = $('[data-bigclock]');
  if (big) { const h = p.h % 12 || 12; big.innerHTML = `<span class="ltr">${pad(h)}:${pad(p.m)}<small>:${pad(p.s)}</small></span><small>${p.h < 12 ? 'صباحًا' : 'مساءً'}</small>`; }
}

function getPos(timeout = 15000) {
  return new Promise((res, rej) => {
    if (!window.isSecureContext) return rej(new Error('تحديد الموقع محتاج رابط آمن (https). اطلب من الإدارة رابط البرنامج الصح'));
    if (!navigator.geolocation) return rej(new Error('الجهاز ده مش بيدعم تحديد الموقع'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), at: Date.now() }),
      e => rej(new Error(e.code === 1 ? 'لازم تسمح للبرنامج يستخدم الموقع (من إعدادات المتصفح ← الموقع ← سماح)' : e.code === 2 ? 'مش قادر أحدد موقعك.. شغّل الـ GPS وجرب تاني' : 'تحديد الموقع اتأخر.. جرب في مكان مفتوح')),
      { enableHighAccuracy: true, timeout, maximumAge: 5000 });
  });
}

function sigPad(wrap) {
  const cv = $('canvas', wrap); let ctx = null, down = false, len = 0, lx = 0, ly = 0, box = null, k = 1;
  const setup = () => {
    const w = cv.offsetWidth, h = cv.offsetHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0a2357'; ctx.fillStyle = '#0a2357'; ctx.lineWidth = 2.6;

  const pos = e => { const r = cv.getBoundingClientRect(); k = cv.offsetWidth / (r.width || 1); return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };
  const grow = (x, y) => { box = box ? [Math.min(box[0], x), Math.min(box[1], y), Math.max(box[2], x), Math.max(box[3], y)] : [x, y, x, y]; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); if (!ctx || cv.width !== Math.round(cv.offsetWidth * Math.min(2, window.devicePixelRatio || 1))) setup();
    down = true; try { cv.setPointerCapture(e.pointerId); } catch {}
    [lx, ly] = pos(e); grow(lx, ly); ctx.beginPath(); ctx.arc(lx, ly, 1.3, 0, 7); ctx.fill();
  });
  cv.addEventListener('pointermove', e => {
    if (!down) return; e.preventDefault();
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
    len += Math.hypot(x - lx, y - ly); lx = x; ly = y; grow(x, y); if (len > 12) wrap.classList.add('has');
  });
  const up = () => { down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  return {
    clear() { if (ctx) ctx.clearRect(0, 0, cv.width, cv.height); setup(); },
    empty() { return len < 30; },
    data() {
      if (len < 30 || !box) return null;
      const dpr = cv.width / cv.offsetWidth, pad = 10;
      const x0 = Math.max(0, (box[0] - pad) * dpr), y0 = Math.max(0, (box[1] - pad) * dpr);
      const w = Math.min(cv.width - x0, (box[2] - box[0] + pad * 2) * dpr), h = Math.min(cv.height - y0, (box[3] - box[1] + pad * 2) * dpr);
      const sc = Math.min(1, 460 / w, 180 / h), o = document.createElement('canvas');
      o.width = Math.max(40, Math.round(w * sc)); o.height = Math.max(30, Math.round(h * sc));
      o.getContext('2d').drawImage(cv, x0, y0, w, h, 0, 0, o.width, o.height);
      return o.toDataURL('image/png');
    },
  };
}

const Scan = {
  token(t) { try { const u = new URL(String(t).trim(), location.href); return u.searchParams.get('qr'); } catch { return null; } },
  help(msg) {
    modal({
      title: 'امسح كود المقر', icon: 'camera', tile: 't-gold', size: 'sm',
      body: `${msg ? `<div class="note warn">${ic('alert')}<div>${esc(msg)}</div></div>` : ''}<p style="line-height:2;font-weight:600">١- افتح <b>كاميرا الموبايل</b> العادية<br>٢- وجّهها على كود الـ QR اللي على شاشة المقر<br>٣- هيظهر لينك فوق — دوس عليه وهيتسجل حضورك على طول</p>`,
      foot: `<button class="btn btn-primary" data-close style="flex:1">تمام</button>`,

  },
  async open(accept = t => Scan.token(t), hint = 'وجّه الكاميرا على كود الـ QR اللي على شاشة المقر') {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) return this.help(window.isSecureContext ? '' : 'الكاميرا بتشتغل على رابط https بس');

    catch (e) { return this.help(e && e.name === 'NotAllowedError' ? 'لازم تسمح للبرنامج يستخدم الكاميرا (من إعدادات المتصفح)' : 'مقدرتش أفتح الكاميرا'); }

    const ov = document.createElement('div'); ov.className = 'scan';
    ov.innerHTML = `<video playsinline muted autoplay></video><div class="fr"></div><button class="btn btn-icon x" style="background:rgba(255,255,255,.18);color:#fff">${ic('x')}</button><div class="bar"><b style="font-size:16px">${hint}</b><span style="font-size:12.5px;opacity:.85">بيتقرا لوحده</span></div>`;

    });
  },

    if (d.type === 'plan_remind') { toast(`⏰ تذكير: زيارة ${d.center}${d.time ? ' الساعة ' + t12(d.time) : ''}`, 'info', 'cal'); if (navigator.vibrate) navigator.vibrate([120, 60, 120]); }
    if (d.type === 'custody') { S.vis = null; toast('عهدتك من قطع الغيار اتحدثت', 'info', 'brief'); if (S.etab !== 'chat') EmpPoll.tick(); }
    if (d.type === 'status') { if (d.by) toast(`${d.by} خلّى حالتك متاح 🟢`, 'info', 'checkCircle'); EmpPoll.tick(); }
  },
};

/* ------------------------------------- Employee: live location sharing --- */
// Sends the phone location every N minutes between check-in and check-out while the app is open.
const Tracker = {
  timer: null, lastOk: 0, err: null, busy: false,
  going() { const h = S.home; return !!(h && h.settings.track === '1' && (h.tasks || []).some(t => t.status === 'onway' || t.status === 'accepted')); },
  on() { const h = S.home; return !!(h && h.settings.track === '1' && (h.open || this.going())); },
  ivMs() { return this.going() ? 30000 : (Number(S.home && S.home.settings.track_interval) || 15) * 60000; },
  sync() {
    if (!this.on()) return this.stop();
    if (S.home.last_ping) this.lastOk = Math.max(this.lastOk || 0, Date.parse(S.home.last_ping.replace(' ', 'T') + 'Z'));
    const per = this.going() ? 10000 : 30000;
    if (!this.timer || this.per !== per) { clearInterval(this.timer); this.per = per; this.timer = setInterval(() => this.tick(), per); }
    this.tick(); this.paint();
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  async tick(force) {
    if (!this.on() || this.busy || document.visibilityState !== 'visible') return;
    const now = srvNow().getTime();
    if (!force && this.lastOk && now - this.lastOk < this.ivMs() - (this.going() ? 5000 : 20000)) { this.paint(); return; }
    this.busy = true;
    try {
      const p = await getPos(20000); S.loc = p;
      let battery = null; try { if (navigator.getBattery) battery = Math.round((await navigator.getBattery()).level * 100); } catch {}
      const r = await api('/api/my/ping', { lat: p.lat, lng: p.lng, acc: p.acc, battery });
      if (r.ok) { this.lastOk = r.at ? Date.parse(r.at.replace(' ', 'T') + 'Z') : now; this.err = null; }
      else if (r.closed || r.off) this.stop();
    } catch (e) { this.err = e.message; }
    finally { this.busy = false; this.paint(); updateLocPill(); }
  },
  paint() {
    const el = $('#trackPill'); if (!el) return;
    const iv = Number(S.home.settings.track_interval) || 15;
    if (this.err) { el.className = 'trackpill warn'; el.innerHTML = `${ic('alert')}<span>مقدرناش نبعت موقعك للإدارة: ${esc(this.err)}</span>`; return; }
    el.className = 'trackpill ok';
    el.innerHTML = `${ic('radar')}<span>${this.going() ? 'إنت في الطريق لمهمة — موقعك بيتبعت كل 30 ثانية' : `موقعك بيتبعت للإدارة كل ${iv} دقيقة أثناء الشغل`}${this.lastOk ? ` • آخر تحديث ${t12(new Date(this.lastOk).toISOString().slice(11, 19))}` : ''} — خلّي البرنامج مفتوح</span>`;
  },
};

/* ------------------------------------------------------------ Boot --- */
/* ===================================================== v1.7: technician status (busy / available) === */
const arN = x => String(x || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْـ]/g, '').replace(/\s+/g, ' ').trim();
const minsTxt = m => (m || 0) < 1 ? 'أقل من دقيقة' : dur(m);
function stHelloPill() { const b = !!(S.home && S.home.status); return `<span class="hello-st ${b ? 'busy' : 'free'}" data-eact="st-jump"><i class="sdot ${b ? 'busy' : 'free'}"></i>${b ? 'مشغول' : 'متاح'}</span>`; }
function stCardHtml() {
  const h = S.home; if (!h) return '';
  const st = h.status, td = h.status_today || { jobs: 0, done_mins: 0 };
  const todayLine = td.jobs ? `<span>${ic('wrench')} النهارده: ${td.jobs === 1 ? 'شغلانة واحدة' : td.jobs + ' شغلانات'}</span>${td.done_mins ? `<span>${ic('timer')} ${dur(td.done_mins)} شغل خلصته</span>` : ''}` : '';
  if (st) return `<div class="stcard busy" id="stCard"><div class="st-head"><span class="sdot busy lg"></span><div class="t"><b>حالتك: مشغول</b><span>في <strong>${esc(st.center)}</strong>${st.area ? ' — ' + esc(st.area) : ''}</span></div></div>
    <div class="st-clock"><span>${ic('timer')} بقالك شغال</span><b data-elapsed="${st.since}">00:00:00</b></div>
    <div class="st-acts"><button class="stbtn done" data-eact="st-free">${ic('checkCircle')}<span class="lbl">خلصت<small>هترجع متاح عند الإدارة</small></span></button><button class="btn btn-soft" data-eact="st-busy">${ic('hospital')}غيّر المركز</button></div>
    <div class="st-meta"><span>${ic('clock')} بدأت ${t12(st.since)}</span>${st.far ? `<span class="warn">${ic('alert')} موبايلك كان بعيد عن المركز</span>` : ''}${todayLine}</div></div>`;
  return `<div class="stcard free" id="stCard"><div class="st-head"><span class="sdot free lg"></span><div class="t"><b>حالتك: متاح</b><span>الإدارة شايفاك فاضي لأي شغل</span></div></div>
    <button class="stbtn go" data-eact="st-busy">${ic('wrench')}<span class="lbl">أنا شغال<small>اختار المركز اللي أنت فيه</small></span></button>
    ${todayLine ? `<div class="st-meta">${todayLine}</div>` : ''}</div>`;
}
async function statusPicker() {
  let v = S.vis;
  if (!v) { try { v = await loadVis(); } catch (e) { v = visCache(); if (!v) return toast(e.message, 'err'); } }
  if (!S.loc || S.loc.err || Date.now() - (S.loc.at || 0) > 120000) locate();
  const h = S.home, cur = h.status;
  const taskC = new Set((h.tasks || []).filter(t => ['accepted', 'onway', 'arrived'].includes(t.status)).map(t => t.center_id).filter(Boolean));
  const planC = new Set((h.plans_today || []).filter(p => p.state === 'planned').map(p => p.center_id).filter(Boolean));
  const centers = v.centers || [];
  const myLoc = () => (S.loc && !S.loc.err && !S.loc.busy && typeof S.loc.lat === 'number') ? S.loc : null;
  const listHtml = q => {
    const l = myLoc();
    let L = centers.map(c => { const d = l && c.lat !== null && c.lat !== undefined ? haversine(l.lat, l.lng, c.lat, c.lng) : null; return { ...c, d, near: d !== null && d <= Math.max(c.radius || 300, 150) * 1.5 }; });
    if (q) { const n = arN(q); L = L.filter(c => arN(c.name + ' ' + (c.area || '')).includes(n)); }
    const rank = c => (c.near ? -8 : 0) + (taskC.has(c.id) ? -2 : 0) + (planC.has(c.id) ? -1 : 0) + (cur && cur.center_id === c.id ? 3 : 0);
    L.sort((a, b) => (rank(a) - rank(b)) || ((a.d ?? 1e12) - (b.d ?? 1e12)) || a.name.localeCompare(b.name, 'ar'));
    if (!L.length) return `<div class="stc-empty">مفيش مركز بالاسم ده — دوس "مركز مش في القائمة" تحت</div>`;
    return L.slice(0, 80).map(c => {
      const near = c.near;
      const tag = cur && cur.center_id === c.id ? '<span class="tag cur">أنت فيه دلوقتي</span>' : taskC.has(c.id) ? '<span class="tag task">مهمتك</span>' : near ? '<span class="tag near">قريب منك</span>' : planC.has(c.id) ? '<span class="tag task">في جدولك</span>' : '';
      return `<button class="stc-it" data-stc="${c.id}"><div class="tile xs ${near ? 't-green' : 't-navy'}">${ic('hospital')}</div><div class="t"><b>${esc(c.name)}</b>${c.area ? `<span>${esc(c.area)}</span>` : ''}</div>${tag}${c.d !== null ? `<span class="d">${meters(c.d)}</span>` : ''}</button>`;
    }).join('');
  };
  const m = modal({
    title: cur ? 'نقلت لمركز تاني؟' : 'أنت في مركز إيه؟', sub: 'اختار المركز وحالتك هتبقى "مشغول" عند الإدارة فورًا', icon: 'hospital', tile: 't-red',
    body: `<div class="inp-ico">${ic('search')}<input class="inp" placeholder="ابحث باسم المركز أو المنطقة" data-stq autocomplete="off"></div>
      <div class="stc-list" data-stlist>${listHtml('')}</div>
      <button class="stc-it new" data-stnew>${ic('plus')} مركز مش في القائمة</button>
      <div style="display:flex;flex-direction:column;gap:8px" data-stnewbox><input class="inp" placeholder="اكتب اسم المركز" data-stname autocomplete="off"><button class="btn btn-red" data-stgo>${ic('wrench')} ابدأ الشغل</button></div>`,
  });
  const list = $('[data-stlist]', m.el), q = $('[data-stq]', m.el), box = $('[data-stnewbox]', m.el);
  box.style.display = 'none';
  q.addEventListener('input', () => { list.innerHTML = listHtml(q.value.trim()); });
  let hadLoc = !!myLoc();
  const lw = setInterval(() => { if (!m.el.isConnected) return clearInterval(lw); if (!hadLoc && myLoc()) { hadLoc = true; list.innerHTML = listHtml(q.value.trim()); } }, 700);
  const go = (body, btn) => busy(btn, async () => {
    const l = myLoc() && Date.now() - S.loc.at < 300000 ? S.loc : null;
    const r = await api('/api/my/status', { busy: true, ...body, lat: l ? l.lat : null, lng: l ? l.lng : null, acc: l ? l.acc : null });
    m.close(); S.home.status = r.status; renderEmp(); window.scrollTo(0, 0);
    if (navigator.vibrate) navigator.vibrate(70);
    toast(`حالتك بقت مشغول في ${r.status.center} — الإدارة شايفاك 🔴`, 'info', 'wrench');
    loadHome(true);
  });
  list.addEventListener('click', e => { const b = e.target.closest('[data-stc]'); if (b && !b.disabled) go({ center_id: +b.dataset.stc }, b); });
  $('[data-stnew]', m.el).onclick = ev => { box.style.display = 'flex'; ev.currentTarget.style.display = 'none'; $('[data-stname]', m.el).value = q.value.trim(); $('[data-stname]', m.el).focus(); };
  $('[data-stgo]', m.el).onclick = ev => { const n = $('[data-stname]', m.el).value.trim(); if (!n) return toast('اكتب اسم المركز', 'warn'); go({ center_name: n }, ev.currentTarget); };
}
async function statusDone(btn) {
  if (!S.home || !S.home.status) return;
  const r = await busy(btn, () => api('/api/my/status', { busy: false }));
  if (!r) return;
  S.home.status = null; renderEmp(); if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  const e = r.ended;
  if (e && !e.visited) {
    const m = modal({ title: 'تمام.. بقيت متاح 🟢', sub: 'الإدارة شايفاك فاضي دلوقتي', icon: 'checkCircle', tile: 't-green', size: 'sm',
      body: `<p style="font-weight:700;line-height:1.9">اشتغلت <b>${minsTxt(e.mins)}</b> في <b>${esc(e.center)}</b>.<br>تحب تسجّل الزيارة دي (العطل والحل والصورة)؟</p>`,
      foot: `<button class="btn btn-gold" data-v style="flex:1">${ic('wrench')} سجّل الزيارة</button><button class="btn btn-soft" data-close>بعدين</button>` });
    $('[data-v]', m.el).onclick = () => { m.close(); visitForm(null, null, null, { center_id: e.center_id, center: e.center }); };
  } else toast(`تمام — حالتك بقت متاح 🟢${e ? ` (اشتغلت ${minsTxt(e.mins)} في ${e.center})` : ''}`, 'ok', 'checkCircle');
  loadHome(true);
}

/* management side: live board + per-technician log */
const Status = {
  data: null, flash: new Set(),
  async load() { this.data = await api('/api/status'); return this.data; },
  refreshSoon: debounce(() => Status.refresh(), 400),
  async refresh() { if (S.kind !== 'user' || !$('[data-stboard]')) return; try { await this.load(); this.paint(); } catch {} },
  paint() { $$('[data-stboard]').forEach(el => { el.innerHTML = this.boardHtml(); }); tickClock(); },
  itemHtml(x) {
    const b = x.state === 'busy', st = x.status;
    const w = b ? `مشغول في ${esc(st.center)}` : 'متاح';
    const sub = b ? [st.area ? esc(st.area) : '', st.far ? '⚠️ موبايله كان بعيد عن المركز' : '', x.jobs_today > 1 ? `${x.jobs_today} شغلانات النهارده` : ''].filter(Boolean).join(' • ') || esc(x.job || '')
      : [x.last_center ? `آخر شغل: ${esc(x.last_center)}` : esc(x.job || ''), x.jobs_today ? `${x.jobs_today} النهارده` : ''].filter(Boolean).join(' • ');
    const tm = b ? `<span class="tm ltr" data-elapsed="${st.since}"></span>` : x.free_since ? `<span class="tm" data-ago="${x.free_since}">${ago(tsAgo(x.free_since))}</span>` : '';
    return `<button class="stb-it ${x.state} ${this.flash.has(x.emp_id) ? 'flash' : ''}" data-act="st-log" data-id="${x.emp_id}"><span class="avst">${av(x.name, x.emp_id, '', x.photo)}<i class="sdot ${x.state}"></i></span><div class="t"><b>${esc(x.name)}</b><span class="w">${w}</span>${sub ? `<span class="s">${sub}</span>` : ''}</div>${tm}</button>`;
  },
  boardHtml() {
    const d = this.data;
    if (!d) return `<div class="empty" style="padding:20px">${ic('refresh', 'spin')}</div>`;
    const B = d.list.filter(x => x.state === 'busy'), F = d.list.filter(x => x.state === 'free'), O = d.list.filter(x => x.state === 'off');
    const sum = `<div class="stb-sum"><span class="stb-pill busy"><i class="sdot busy"></i><b>${B.length}</b>مشغول</span><span class="stb-pill free"><i class="sdot free"></i><b>${F.length}</b>متاح</span><span class="stb-pill"><i class="sdot off"></i><b>${O.length}</b>مش في الشغل</span></div>`;
    const items = B.concat(F);
    const grid = items.length ? `<div class="stb-grid">${items.map(x => this.itemHtml(x)).join('')}</div>`
      : `<div class="empty" style="padding:22px">${ic('wrench')}<b style="margin-top:6px">محدش في الشغل دلوقتي</b>أول ما فني يسجل حضور أو يدوس "أنا شغال" هيظهر هنا</div>`;
    const off = O.length ? `<details class="stb-off"><summary>${ic('chevL')} مش في الشغل (${O.length})</summary><div class="names">${O.map(x => `<button data-act="st-log" data-id="${x.emp_id}">${av(x.name, x.emp_id, '', x.photo)}${esc(x.name)}</button>`).join('')}</div></details>` : '';
    return sum + grid + off;
  },
  onEvent(d) {
    if (d.name) {
      if (d.busy) toast(d.from ? `🔴 ${d.name} نقل من ${d.from} لـ ${d.center}` : `🔴 ${d.name} بقى مشغول في ${d.center}${d.far ? ' — موبايله بعيد عن المركز' : ''}`, d.far ? 'warn' : 'info', 'wrench');
      else if (d.by === 'out') toast(`${d.name} انصرف — حالته اتقفلت (${d.center})`, 'info', 'logout');
      else if (d.auto) toast(`${d.name}: حالة "مشغول" في ${d.center} اتقفلت تلقائي`, 'info', 'clock');
      else toast(`🟢 ${d.name} خلّص${d.center ? ' في ' + d.center : ''}${d.mins ? ' بعد ' + dur(d.mins) : ''} وبقى متاح${d.by ? ` (${d.by})` : ''}`, 'ok', 'checkCircle');
    }
    this.flash.add(d.emp_id); setTimeout(() => this.flash.delete(d.emp_id), 5000);
    this.refreshSoon(); Live.refreshSoon();
    if (S.page === 'employees') refreshSoon(); else if (S.boot) reloadBoot().catch(() => {});
  },
};
setInterval(() => { $$('[data-ago]').forEach(el => { el.textContent = ago(tsAgo(el.dataset.ago)); }); }, 20000);
async function statusLogModal(id, date) {
  date = date || today();
  let d; try { d = await api(`/api/status/log?emp=${id}&date=${date}`); } catch (e) { return toast(e.message, 'err'); }
  const x = (Status.data && Status.data.list.find(r => r.emp_id === id)) || {};
  const cur = d.current, isToday = date === today();
  const total = d.rows.reduce((t, r) => t + (r.mins || 0), 0);
  const endTxt = r => !r.ended_by || r.ended_by === 'الفني' ? '' : ' • ' + (r.ended_by === 'انصراف' ? 'اتقفلت مع الانصراف' : r.ended_by === 'غيّر المركز' ? 'نقل لمركز تاني' : r.ended_by === 'تلقائي' ? 'اتقفلت تلقائي' : 'قفلها ' + esc(r.ended_by));
  const now = cur ? `<div class="stcard busy" style="padding:14px"><div class="st-head"><span class="sdot busy lg"></span><div class="t"><b>مشغول دلوقتي</b><span>في <strong>${esc(cur.center)}</strong> من ${t12(cur.since)}${cur.far ? ' • ⚠️ موبايله كان بعيد عن المركز' : ''}</span></div></div><div class="st-clock"><span>${ic('timer')} بقاله شغال</span><b data-elapsed="${cur.since}"></b></div></div>`
    : isToday ? `<div class="stcard free" style="padding:14px"><div class="st-head"><span class="sdot ${x.state === 'off' ? 'off' : 'free'} lg"></span><div class="t"><b>${x.state === 'off' ? 'مش في الشغل دلوقتي' : 'متاح دلوقتي'}</b><span>${x.free_since ? 'فاضي ' + ago(tsAgo(x.free_since)) : x.in_at ? 'حاضر من ' + t12(x.in_at) : 'مسجلش حضور'}</span></div></div></div>` : '';
  const rows = d.rows.length ? `<div class="stlog">${d.rows.map(r => `<div class="stlog-it"><span class="sdot ${r.end_at ? 'off' : 'busy'}"></span><div><b>${esc(r.center)}</b><span>${t12(r.since)} ← ${r.end_at ? t12(r.end_at) : 'لسه شغال'}${endTxt(r)}${r.far ? ' • ⚠️ بعيد عن المركز' : ''}</span></div><span class="m">${minsTxt(r.mins)}</span></div>`).join('')}</div>`
    : `<div class="empty" style="padding:18px">${ic('wrench')}<div>${isToday ? 'مداسش "أنا شغال" النهارده' : 'مفيش شغل متسجل اليوم ده'}</div></div>`;
  const emp = d.emp;
  const m = modal({
    title: emp.name, sub: 'حالة الشغل في المراكز', icon: 'wrench', tile: 't-red',
    body: `${now}
      <div class="row" style="gap:10px;align-items:flex-end"><div class="field" style="flex:1"><label>اليوم</label><input type="date" class="inp" value="${date}" max="${today()}" data-stdate></div>${d.rows.length ? `<div class="stb-pill" style="margin-bottom:4px"><b>${d.rows.length}</b>شغلانة • ${dur(total)}</div>` : ''}</div>
      ${rows}`,
    foot: `${cur ? `<button class="btn btn-soft" data-stclear style="color:var(--green)">${ic('checkCircle')} خليه متاح</button>` : ''}<span class="sp"></span><button class="btn btn-soft" data-act="chat-emp" data-id="${emp.id}">${ic('chat')} رسالة</button>${emp.phone ? `<a class="btn btn-soft btn-icon" href="tel:${esc(emp.phone)}" title="اتصال">${ic('call')}</a>` : ''}`,
  });
  tickClock();
  $('[data-stdate]', m.el).onchange = ev => { const v = ev.target.value; if (v) { m.close(); statusLogModal(id, v); } };
  $$('[data-act=chat-emp]', m.el).forEach(b => b.addEventListener('click', () => m.close()));
  const cl = $('[data-stclear]', m.el);
  if (cl) cl.onclick = async ev => {
    if (!await confirmBox(`${emp.name} لسه مشغول في ${cur.center}. تخلّي حالته "متاح"؟ (هيوصله إشعار)`, { ok: 'خليه متاح', icon: 'checkCircle' })) return;
    const r = await busy(ev.currentTarget, () => api('/api/status/clear', { emp_id: id }));
    if (r) { m.close(); toast(`حالة ${emp.name} بقت متاح`); Status.refresh(); }
  };
}
document.addEventListener('change', e => {
  const el = e.target.closest && e.target.closest('[data-autosave]'); if (!el || S.kind !== 'user') return;
  busy(null, async () => { await api('/api/settings/save', { [el.dataset.autosave]: el.checked ? '1' : '0' }); await reloadBoot(); toast('اتحفظ'); });
});

function start() {
  if (!S.token) return renderLogin();
  if (S.kind === 'emp') return startEmp();
  return startAdmin();
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
start();
